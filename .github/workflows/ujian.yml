# Ujian automatik pada setiap push ke main dan setiap pull request.
# Laman di GitHub Pages tetap dideploy terus dari main; semak tab Actions.
name: Ujian

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ujian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql:
    name: Database (RLS, audit, MFA, snapshot)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sql/run.sh

  pelayar:
    name: Pelayar (portal, Penyu, Minyak) & pembaca Setel
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run unit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: laporan-playwright
          path: tests/playwright-report
          retention-days: 14

  tailwind:
    name: CSS Penyu terkini
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tests/check-tailwind.sh
