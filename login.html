<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Log Masuk · Portal LPP</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icon-192.png" />
<meta name="theme-color" content="#0A1F2B" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>try { document.documentElement.classList.add(localStorage.getItem('penyu-theme') || 'dark') } catch { document.documentElement.classList.add('dark') }</script>
<link rel="stylesheet" href="shared/portal.css" />
<style>
  main { min-height: calc(100svh - 80px); display: grid; align-content: center; padding: 8px 0 48px; }
  .card { padding: 30px 24px 26px; border-radius: 28px; }
  .head { text-align: center; margin-bottom: 24px; }
  .head img { width: 92px; height: 92px; margin: 0 auto 16px; border-radius: 26px; object-fit: contain; background: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.45), 0 0 60px rgba(110,231,183,.15); }
  .head .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .head h1 { font-size: clamp(30px, 8vw, 38px); line-height: 1.05; letter-spacing: -.03em; }
  .head p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  #view .btn-primary { min-height: 54px; font-size: 17px; border-radius: 16px; box-shadow: 0 12px 32px rgba(110,231,183,.25); }
  #view input { min-height: 52px; }
  .bg-video { filter: blur(3px) saturate(1.1); transform: scale(1.04); }
  .bg-tint { background: radial-gradient(ellipse at 50% 40%, rgba(10,31,43,.6), rgba(10,31,43,.93) 75%); }
  html.light .bg-tint { background: radial-gradient(ellipse at 50% 40%, rgba(237,227,207,.6), rgba(237,227,207,.94) 75%); }
</style>
</head>
<body>
<video class="bg-video" src="assets/background.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
<div class="bg-tint"></div>

<div class="wrap narrow">
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-name">← Portal LPP</span></a>
  </header>
  <main><div class="card rise" id="view"></div><p class="center small muted" id="ver" style="margin-top:16px"></p></main>
</div>

<script type="module">
import { supabase, ROOT, BOOT_RECOVERY, BOOT_AUTH_ERROR, RECOVERY_FLAG, APP_VERSION, needsMfa, reportError } from './shared/auth.js'
document.getElementById('ver').textContent = `versi ${APP_VERSION}`

const view = document.getElementById('view')
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

// Selepas log masuk: ke app yang diminta (cth "penyu/"), atau portal.
function nextUrl() {
  const n = new URLSearchParams(location.search).get('next') || ''
  return /^[a-z0-9-]+\/$/.test(n) ? ROOT + n : ROOT + 'portal.html'
}
// Pautan reset mesti kembali ke halaman ini. Alamat ini perlu ada dalam senarai
// Redirect URLs di Supabase (Authentication → URL Configuration).
const resetRedirectUrl = () => ROOT + 'login.html'

const head = (title, sub) => `
  <div class="head">
    <img src="assets/logo.png" alt="" onerror="this.remove()" />
    <div class="eyebrow">Portal LPP</div>
    <h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}
  </div>`

function showLogin(prefill = '') {
  view.innerHTML = `${head('Log Masuk Staf', 'Satu akaun untuk semua aplikasi.')}
    <form id="f">
      <div class="field"><label for="email">Emel</label><input type="email" id="email" required autocomplete="email" value="${esc(prefill)}" /></div>
      <div class="field"><label for="pw">Kata laluan</label><input type="password" id="pw" required autocomplete="current-password" /></div>
      ${new URLSearchParams(location.search).get('sebab') === 'tidak-aktif' ? '<div class="msg msg-ok">Anda telah dilog keluar kerana tiada aktiviti. Sila log masuk semula.</div>' : ''}
      <div id="err" class="msg msg-err" hidden></div>
      <button class="btn btn-primary btn-block" id="btn">Log Masuk</button>
      <div class="center" style="margin-top:10px"><button type="button" class="link-btn" id="forgot">Lupa kata laluan?</button></div>
    </form>`
  const err = view.querySelector('#err'), btn = view.querySelector('#btn')
  view.querySelector('#forgot').onclick = () => showForgot(view.querySelector('#email').value.trim())
  view.querySelector('#f').onsubmit = async (e) => {
    e.preventDefault()
    err.hidden = true
    btn.disabled = true
    btn.textContent = 'Log masuk...'
    const { error } = await supabase.auth.signInWithPassword({
      email: view.querySelector('#email').value.trim(),
      password: view.querySelector('#pw').value
    })
    if (error) {
      err.textContent = /invalid login/i.test(error.message) ? 'Emel atau kata laluan salah.' : error.message
      err.hidden = false
      btn.disabled = false
      btn.textContent = 'Log Masuk'
      return
    }
    await afterLogin()
  }
}

// Selepas kata laluan: admin mesti lepasi MFA (kod 6 digit) sebelum masuk.
async function afterLogin() {
  const { data: s } = await supabase.auth.getSession()
  const uid = s?.session?.user?.id
  const { data: profile } = uid ? await supabase.from('staff_profiles').select('role').eq('id', uid).maybeSingle() : { data: null }
  if (!(await needsMfa(profile))) { location.replace(nextUrl()); return }
  const { data: f, error } = await supabase.auth.mfa.listFactors()
  if (error) { reportError('MFA listFactors: ' + error.message); location.replace(nextUrl()); return }
  const verified = (f.totp || []).filter(x => x.status === 'verified')
  if (verified.length) showMfaChallenge(verified[0].id)
  else showMfaEnroll((f.all || []).filter(x => x.factor_type === 'totp' && x.status !== 'verified'))
}

const mfaCancel = `<div class="center" style="margin-top:12px"><button type="button" class="link-btn" id="mfaOut">Log keluar</button></div>`
function bindMfaCommon(onCode) {
  view.querySelector('#mfaOut').onclick = async () => { await supabase.auth.signOut(); showLogin() }
  const code = view.querySelector('#code'), err = view.querySelector('#err'), btn = view.querySelector('#btn')
  code.focus()
  code.oninput = () => { code.value = code.value.replace(/\D/g, '').slice(0, 6) }
  view.querySelector('#f').onsubmit = async (e) => {
    e.preventDefault()
    if (code.value.length !== 6) { err.textContent = 'Masukkan 6 digit kod.'; err.hidden = false; return }
    err.hidden = true; btn.disabled = true
    const msg = await onCode(code.value)
    if (msg) { err.textContent = msg; err.hidden = false; btn.disabled = false; code.select() }
  }
}
const codeField = `<div class="field"><label for="code">Kod 6 digit</label><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" style="text-align:center;font-size:24px;letter-spacing:.4em" /></div>`
const badCode = (e) => /invalid|expired|code/i.test(e?.message || '') ? 'Kod salah atau sudah tamat. Cuba kod terbaru dalam app Authenticator.' : (e?.message || 'Ralat.')

function showMfaChallenge(factorId) {
  view.innerHTML = `${head('Pengesahan Admin', 'Buka app Authenticator di telefon anda dan masukkan kod 6 digit untuk Portal LPP.')}
    <form id="f">${codeField}<div id="err" class="msg msg-err" hidden></div>
      <button class="btn btn-primary btn-block" id="btn">Sahkan</button></form>${mfaCancel}
    <p class="small muted center" style="margin-top:14px">Hilang telefon? Minta admin lain buang MFA akaun anda di Supabase (Authentication → Users).</p>`
  bindMfaCommon(async (code) => {
    const { error } = await supabase.auth.mfa.challengeAndVerify({ factorId, code })
    if (error) return badCode(error)
    location.replace(nextUrl())
  })
}

// Kali pertama: daftar app Authenticator dengan kod QR, kemudian sahkan satu kod.
async function showMfaEnroll(stale) {
  for (const x of stale) { try { await supabase.auth.mfa.unenroll({ factorId: x.id }) } catch {} }
  const { data, error } = await supabase.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Authenticator ' + new Date().toISOString().slice(0, 16) })
  if (error) {
    // Jangan kunci admin keluar jika MFA tidak dapat dipasang (cth dimatikan dalam tetapan Supabase).
    reportError('MFA enroll: ' + error.message)
    view.innerHTML = `${head('MFA belum tersedia', 'Pengesahan dua langkah tidak dapat disediakan sekarang. Anda boleh teruskan; sila maklumkan kepada pentadbir sistem.')}
      <div class="msg msg-err small">${esc(error.message)}</div><button class="btn btn-primary btn-block" id="go">Teruskan</button>`
    view.querySelector('#go').onclick = () => location.replace(nextUrl())
    return
  }
  view.innerHTML = `${head('Sediakan Pengesahan Admin', 'Akaun admin perlukan kod 6 digit setiap kali log masuk. Sediakan sekali sahaja:')}
    <ol class="small" style="margin:0 0 14px;padding-left:20px;line-height:1.7">
      <li>Pasang <b>Google Authenticator</b> atau <b>Microsoft Authenticator</b> (percuma) di telefon.</li>
      <li>Dalam app itu, tekan <b>+</b> → <b>Imbas kod QR</b>, dan imbas kod di bawah.</li>
      <li>Masukkan kod 6 digit yang dipaparkan.</li></ol>
    <div style="background:#fff;border-radius:14px;padding:12px;width:200px;margin:0 auto 10px"><img src="${data.totp.qr_code}" alt="Kod QR untuk app Authenticator" style="width:100%" /></div>
    <p class="small muted center" style="margin:0 0 14px">Tidak boleh imbas? Masukkan kunci ini secara manual:<br><code style="user-select:all;word-break:break-all">${esc(data.totp.secret)}</code></p>
    <form id="f">${codeField}<div id="err" class="msg msg-err" hidden></div>
      <button class="btn btn-primary btn-block" id="btn">Sahkan & Teruskan</button></form>${mfaCancel}`
  bindMfaCommon(async (code) => {
    const { error } = await supabase.auth.mfa.challengeAndVerify({ factorId: data.id, code })
    if (error) return badCode(error)
    location.replace(nextUrl())
  })
}

function showForgot(prefill = '') {
  view.innerHTML = `
    <button type="button" class="link-btn" id="back">← Kembali log masuk</button>
    ${head('Lupa Kata Laluan', 'Masukkan emel akaun anda. Kami hantar pautan untuk tetapkan kata laluan baharu.')}
    <form id="f">
      <div class="field"><label for="email">Emel</label><input type="email" id="email" required autocomplete="email" value="${esc(prefill)}" /></div>
      <div id="msg" class="msg" hidden></div>
      <button class="btn btn-primary btn-block" id="btn">Hantar pautan reset</button>
    </form>`
  const msg = view.querySelector('#msg'), btn = view.querySelector('#btn'), email = view.querySelector('#email')
  const show = (html, ok) => { msg.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err'); msg.innerHTML = html; msg.hidden = false }
  view.querySelector('#back').onclick = () => showLogin(email.value.trim())
  view.querySelector('#f').onsubmit = async (e) => {
    e.preventDefault()
    const addr = email.value.trim()
    if (!addr) return
    btn.disabled = true
    const { error } = await supabase.auth.resetPasswordForEmail(addr, { redirectTo: resetRedirectUrl() })
    if (error) {
      const rate = error.status === 429 || /rate limit|too many|seconds/i.test(error.message || '')
      show(rate
        ? 'Terlalu banyak permintaan. Tunggu seminit dua, kemudian cuba lagi.'
        : `Emel tidak dapat dihantar sekarang. Sila hubungi admin.<div class="small muted" style="margin-top:4px">${esc(error.message)}</div>`, false)
      btn.disabled = false
      return
    }
    // Mesej sama sama ada emel itu berdaftar atau tidak (elak orang teka siapa staf).
    show('Jika emel itu berdaftar, pautan reset telah dihantar. Semak peti masuk anda (dan folder spam). Pautan hanya sah untuk tempoh singkat dan sekali guna sahaja.<div class="small" style="margin-top:6px">Tak terima dalam 5 minit? Semak ejaan emel dan folder spam, atau hubungi admin.</div>', true)
    let left = 60
    const tick = () => { btn.textContent = left > 0 ? `Hantar semula (${left}s)` : 'Hantar semula'; if (left-- > 0) setTimeout(tick, 1000); else btn.disabled = false }
    tick()
  }
}

function clearRecovery() {
  try { localStorage.removeItem(RECOVERY_FLAG) } catch {}
  try { sessionStorage.removeItem(RECOVERY_FLAG) } catch {}
}

function showInvalidLink() {
  clearRecovery()
  view.innerHTML = `${head('Pautan tidak sah', 'Pautan reset ini sudah tamat tempoh atau sudah digunakan. Sila minta pautan baharu.')}
    <button class="btn btn-primary btn-block" id="ask">Minta pautan baharu</button>`
  view.querySelector('#ask').onclick = () => showForgot()
}

// Skrin selepas klik pautan dalam emel: staf tetapkan kata laluan baharu.
async function showReset() {
  const { data } = await supabase.auth.getSession()
  if (!data?.session) return showInvalidLink()
  view.innerHTML = `
    <button type="button" class="link-btn" id="cancel">← Batal</button>
    ${head('Kata Laluan Baharu', 'Tetapkan kata laluan baharu untuk akaun anda (sekurang-kurangnya 8 aksara).')}
    <form id="f">
      <div class="field"><input type="password" id="p1" required minlength="8" placeholder="Kata laluan baharu" autocomplete="new-password" /></div>
      <div class="field"><input type="password" id="p2" required minlength="8" placeholder="Taip semula kata laluan baharu" autocomplete="new-password" /></div>
      <label class="check"><input type="checkbox" id="showPw" /> Tunjuk kata laluan</label>
      <div id="err" class="msg msg-err" hidden></div>
      <button class="btn btn-primary btn-block" id="btn">Simpan Kata Laluan</button>
    </form>`
  const p1 = view.querySelector('#p1'), p2 = view.querySelector('#p2'), err = view.querySelector('#err'), btn = view.querySelector('#btn')
  const finish = async () => {
    clearRecovery()
    try { await supabase.auth.signOut() } catch {}
    history.replaceState(null, '', location.pathname)
  }
  const showErr = (t) => { err.textContent = t; err.hidden = false }
  view.querySelector('#showPw').onchange = (e) => { p1.type = p2.type = e.target.checked ? 'text' : 'password' }
  view.querySelector('#cancel').onclick = async () => { await finish(); showLogin() }
  view.querySelector('#f').onsubmit = async (e) => {
    e.preventDefault()
    err.hidden = true
    if (p1.value.length < 8) return showErr('Kata laluan mesti sekurang-kurangnya 8 aksara.')
    if (p1.value !== p2.value) return showErr('Kedua-dua kata laluan tidak sama. Taip semula.')
    btn.disabled = true
    const { error } = await supabase.auth.updateUser({ password: p1.value })
    if (error) {
      btn.disabled = false
      const m = error.message || ''
      return showErr(/different from the old/i.test(m) ? 'Kata laluan baharu mesti berbeza daripada yang lama.'
        : /weak|least|characters/i.test(m) ? 'Kata laluan terlalu lemah. Cuba yang lebih panjang atau campur huruf dan nombor.'
        : /session|expired|not authenticated|missing/i.test(m) ? 'Sesi reset sudah tamat. Sila minta pautan baharu.'
        : m)
    }
    const email = data.session.user?.email || ''
    await finish()
    showLogin(email)
    const ok = document.createElement('div')
    ok.className = 'msg msg-ok'
    ok.textContent = 'Kata laluan berjaya ditukar. Sila log masuk dengan kata laluan baharu.'
    view.querySelector('form').prepend(ok)
  }
}

// ---------- Mula ----------
if (BOOT_RECOVERY) {
  // Datang dari pautan emel. Klien Supabase log masuk sementara; paksa tukar kata laluan dulu.
  try { localStorage.setItem(RECOVERY_FLAG, '1'); sessionStorage.setItem(RECOVERY_FLAG, '1') } catch {}
  await supabase.auth.getSession()
  await showReset()
} else if (BOOT_AUTH_ERROR) {
  showInvalidLink()
} else {
  let pending = null, sameTab = null
  try { pending = localStorage.getItem(RECOVERY_FLAG); sameTab = sessionStorage.getItem(RECOVERY_FLAG) } catch {}
  if (pending && sameTab) {
    // Refresh semasa di skrin kata laluan baharu: kekal jika sesi reset masih ada.
    await showReset()
  } else {
    // Tukar kata laluan tidak dihabiskan => jangan biar sesi sementara kekal.
    if (pending) { clearRecovery(); try { await supabase.auth.signOut() } catch {} }
    const { data } = await supabase.auth.getSession()
    if (data?.session) await afterLogin()
    else showLogin()
  }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
</script>
</body>
</html>
