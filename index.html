// DASHBOARD — gamified progress + real charts + year comparison
// =========================================================================
let chartInstances = []
function destroyCharts() { chartInstances.forEach(c => c.destroy()); chartInstances = [] }

// Lets hover/touch trigger the tooltip anywhere along a column, not just
// exactly on top of a point/bar — much easier to hit with a finger.
const CHART_INTERACTION = { mode: 'index', intersect: false }

// Vertical line that follows the active (hovered/touched) point so the
// eye has something to track across the chart, mouse or finger alike.
Chart.register({
  id: 'crosshairLine',
  afterDatasetsDraw(chart) {
    const active = chart.getActiveElements()
    if (!active.length) return
    const { ctx, chartArea: { top, bottom } } = chart
    const x = active[0].element.x
    ctx.save()
    ctx.beginPath()
    ctx.moveTo(x, top); ctx.lineTo(x, bottom)
    ctx.lineWidth = 1
    ctx.strokeStyle = 'rgba(110,231,183,.5)'
    ctx.setLineDash([4, 4])
    ctx.stroke()
    ctx.restore()
  }
})

// Double-click (desktop) or double-tap (mobile) a chart card to blow it up
// to fullscreen — small charts are hard to read/aim at on a phone.
function attachChartExpand(cardEl, titleFn, chartGetter) {
  function trigger() {
    const chart = chartGetter()
    if (!chart) return
    openChartFullscreen(titleFn(), chart.config.type, chart.data, chart.options)
  }
  cardEl.addEventListener('dblclick', (e) => { e.preventDefault(); trigger() })
  let lastTap = 0
  cardEl.addEventListener('touchend', () => {
    const now = Date.now()
    if (now - lastTap < 350) trigger()
    lastTap = now
  })
  const btn = cardEl.querySelector('.chart-expand-btn')
  if (btn) btn.onclick = (e) => { e.stopPropagation(); trigger() }
}

function openChartFullscreen(title, type, data, options) {
  const overlay = document.createElement('div')
  overlay.className = 'chart-expand-overlay'
  overlay.innerHTML = `
    <div class="chart-expand-panel frosted">
      <div class="flex items-center justify-between mb-3">
        <div class="eyebrow">${title}</div>
        <button class="btn btn-ghost btn-sm" id="chartExpandClose">✕ Tutup</button>
      </div>
      <div class="chart-expand-canvas-wrap"><canvas id="chartExpandCanvas"></canvas></div>
    </div>`
  document.body.appendChild(overlay)
  requestAnimationFrame(() => overlay.classList.add('show'))
  const clonedData = JSON.parse(JSON.stringify(data))
  const clonedOptions = JSON.parse(JSON.stringify(options))
  clonedOptions.maintainAspectRatio = false
  clonedOptions.interaction = CHART_INTERACTION
  const expandChart = new Chart(overlay.querySelector('#chartExpandCanvas').getContext('2d'), { type, data: clonedData, options: clonedOptions })
  function close() {
    expandChart.destroy()
    overlay.classList.remove('show')
    document.removeEventListener('keydown', onKey)
    setTimeout(() => overlay.remove(), 250)
  }
  function onKey(e) { if (e.key === 'Escape') close() }
  document.addEventListener('keydown', onKey)
  overlay.querySelector('#chartExpandClose').onclick = close
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close() })
  overlay.addEventListener('dblclick', (e) => { if (e.target === overlay) close() })
}

// Touch-drag axis lock for horizontally-scrollable strips sitting inside a
// vertically-scrollable page — without this, a diagonal-ish swipe that
// starts on the element can get "stuck" scrolling sideways only. Once we
// see which axis the finger committed to, we get out of the other axis's
// way for the rest of that gesture.
function axisLockScroll(el) {
  if (!el || el.dataset.axisLocked) return
  el.dataset.axisLocked = '1'
  let startX = 0, startY = 0, axis = null
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; axis = null
  }, { passive: true })
  el.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1 || axis) return
    const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'
      el.style.overflowX = axis === 'x' ? 'auto' : 'hidden'
    }
  }, { passive: true })
  el.addEventListener('touchend', () => { axis = null; el.style.overflowX = 'auto' }, { passive: true })
}
axisLockScroll(document.querySelector('#navbar .frosted'))

// =========================================================================
// MONTH DETAIL — opened by tapping a month in "Progress Bulanan" on the
// Dashboard. Shows a per-day table (only days with data) combining Entri
// Harian + Entri Individu, same aggregation shape as the Excel export.
// =========================================================================
async function screenMonthDetail() {
  const vm = state.viewMonth
  if (!vm) { go('dashboard'); return document.createElement('div') }
  const { island, year, month } = vm
  const monthLabel = MONTH_LABELS[month - 1]
  const wrap = document.createElement('div')
  const backBtn = document.createElement('button')
  backBtn.className = 'btn-back'; backBtn.textContent = '← Balik ke Dashboard'
  backBtn.onclick = () => go('dashboard')
  wrap.appendChild(backBtn)

  const header = document.createElement('div')
  header.className = 'flex items-center gap-2 mb-4'
  header.innerHTML = `<h1 class="font-display text-2xl">${monthLabel} ${year}</h1><span class="rounded px-2.5 py-1 text-xs font-semibold bg-teal-900/40">${island}</span>`
  wrap.appendChild(header)

  const bodyHolder = document.createElement('div')
  bodyHolder.className = 'stagger'
  bodyHolder.innerHTML = skeletonBlock(3)
  wrap.appendChild(bodyHolder)

  const monthStart = `${year}-${String(month).padStart(2,'0')}-01`
  const daysInMonth = new Date(year, month, 0).getDate()
  const monthEnd = `${year}-${String(month).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`

  const [{ data: daily }, { data: nests }, { data: hatchRows }] = await Promise.all([
    supabase.from('daily_entries').select('*').eq('island', island).gte('tarikh', monthStart).lte('tarikh', monthEnd),
    supabase.from('nest_records').select('*').eq('island', island).gte('tarikh_dijumpai', monthStart).lte('tarikh_dijumpai', monthEnd).order('created_at'),
    supabase.from('monthly_hatch').select('*').eq('island', island).eq('year', year).eq('month', month)
  ])
  // Buruk per baris: nilai sebenar kalau diisi, kalau tidak (dan menetas ada) = diram − menetas
  const burukOf = (buruk, menetas, diram) => buruk !== null && buruk !== undefined ? buruk : (menetas !== null && menetas !== undefined ? Math.max(0, diram - menetas) : 0)
  // Menetas/buruk sebulan per RAM — rekod Menetas Bulanan menggantikan jumlah harian
  const hatchByRam = { LPP: { m:0, b:0 }, SFC: { m:0, b:0 } }
  ;(daily||[]).forEach(d => {
    const h = hatchByRam[d.ram]; if (!h) return
    h.m += (d.telur_menetas_bertag||0) + (d.telur_menetas_takbertag||0)
    h.b += burukOf(d.telur_buruk_bertag, d.telur_menetas_bertag, d.jumlah_telur_diram_bertag) + burukOf(d.telur_buruk_takbertag, d.telur_menetas_takbertag, d.jumlah_telur_diram_takbertag)
  })
  ;(nests||[]).forEach(n => { const h = hatchByRam[n.ram]; if (!h) return; h.m += n.telur_menetas||0; h.b += burukOf(n.telur_buruk, n.telur_menetas, n.jumlah_telur_diram) })
  const monthlyOverride = []
  ;(hatchRows||[]).forEach(r => { hatchByRam[r.ram] = { m: r.menetas_bertag + r.menetas_takbertag, b: r.buruk_bertag + r.buruk_takbertag }; monthlyOverride.push(r.ram) })
  const monthMenetas = hatchByRam.LPP.m + hatchByRam.SFC.m
  const monthBuruk = hatchByRam.LPP.b + hatchByRam.SFC.b

  let tab = 'ringkasan'
  const tabsWrap = document.createElement('div')
  tabsWrap.className = 'seg mb-4'
  tabsWrap.innerHTML = `<button id="tabRingkasan" class="active">Ringkasan Harian</button><button id="tabIndividu">Individu Sarang</button>`
  wrap.insertBefore(tabsWrap, bodyHolder)
  tabsWrap.querySelector('#tabRingkasan').onclick = () => { tab='ringkasan'; tabsWrap.querySelector('#tabRingkasan').className='active'; tabsWrap.querySelector('#tabIndividu').className=''; renderTab() }
  tabsWrap.querySelector('#tabIndividu').onclick = () => { tab='individu'; tabsWrap.querySelector('#tabIndividu').className='active'; tabsWrap.querySelector('#tabRingkasan').className=''; renderTab() }

  function renderRingkasan() {
    // Combine LPP + SFC together per day into bertag/tak-bertag totals —
    // matches how the user reads the Excel export at a glance.
    const byDay = {}
    function ensureDay(d) {
      if (!byDay[d]) byDay[d] = { bp_b:0, bp_t:0, td_b:0, td_t:0, tm_b:0, tm_t:0, tb:0, hasMenetas:false }
      return byDay[d]
    }
    ;(daily||[]).forEach(d => {
      const b = ensureDay(d.tarikh)
      b.bp_b += d.bilangan_penyu_bertag; b.bp_t += d.bilangan_penyu_takbertag
      b.td_b += d.jumlah_telur_diram_bertag; b.td_t += d.jumlah_telur_diram_takbertag
      if (d.telur_menetas_bertag !== null) { b.tm_b += d.telur_menetas_bertag||0; b.hasMenetas = true }
      if (d.telur_menetas_takbertag !== null) { b.tm_t += d.telur_menetas_takbertag||0; b.hasMenetas = true }
      const tb = burukOf(d.telur_buruk_bertag, d.telur_menetas_bertag, d.jumlah_telur_diram_bertag) + burukOf(d.telur_buruk_takbertag, d.telur_menetas_takbertag, d.jumlah_telur_diram_takbertag)
      if (tb || d.telur_buruk_bertag !== null || d.telur_buruk_takbertag !== null) { b.tb += tb; b.hasMenetas = true }
    })
    ;(nests||[]).forEach(n => {
      const b = ensureDay(n.tarikh_dijumpai)
      if (n.bertag) { b.bp_b += 1; b.td_b += n.jumlah_telur_diram; if (n.telur_menetas !== null) { b.tm_b += n.telur_menetas||0; b.hasMenetas = true } }
      else { b.bp_t += 1; b.td_t += n.jumlah_telur_diram; if (n.telur_menetas !== null) { b.tm_t += n.telur_menetas||0; b.hasMenetas = true } }
      if (n.telur_menetas !== null || n.telur_buruk !== null) { b.tb += burukOf(n.telur_buruk, n.telur_menetas, n.jumlah_telur_diram); b.hasMenetas = true }
    })

    bodyHolder.innerHTML = ''
    const dayKeys = Object.keys(byDay).sort()
    if (!dayKeys.length) {
      bodyHolder.appendChild(card(`<div class="text-center py-8 opacity-80">Tiada data untuk ${monthLabel} ${year} di ${island} lagi.</div>`))
      return
    }

    const rows = dayKeys.map(d => {
      const v = byDay[d]
      return `
        <tr class="border-b border-white/10">
          <td class="py-2 px-2 whitespace-nowrap">${fmtDate(d)}</td>
          <td class="py-2 px-2 tabular-num">${v.bp_b}</td>
          <td class="py-2 px-2 tabular-num">${v.bp_t}</td>
          <td class="py-2 px-2 tabular-num font-semibold">${v.td_b}</td>
          <td class="py-2 px-2 tabular-num font-semibold">${v.td_t}</td>
          <td class="py-2 px-2 tabular-num">${v.hasMenetas ? (v.tm_b + v.tm_t) : '-'}</td>
          <td class="py-2 px-2 tabular-num">${v.hasMenetas ? v.tb : '-'}</td>
        </tr>`
    }).join('')

    const totals = dayKeys.reduce((acc, d) => {
      const v = byDay[d]
      acc.bp_b += v.bp_b; acc.bp_t += v.bp_t; acc.td_b += v.td_b; acc.td_t += v.td_t
      return acc
    }, { bp_b:0, bp_t:0, td_b:0, td_t:0 })

    const tableCard = flatCard(`
      <div class="eyebrow mb-3">Jadual Harian — ${dayKeys.length} hari ada data</div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm min-w-[580px]">
          <thead><tr class="text-left opacity-60 text-xs">
            <th class="py-1 px-2">Tarikh</th>
            <th class="py-1 px-2">Penyu<br/>Bertag</th>
            <th class="py-1 px-2">Penyu<br/>Tak Bertag</th>
            <th class="py-1 px-2">Telur<br/>Bertag</th>
            <th class="py-1 px-2">Telur<br/>Tak Bertag</th>
            <th class="py-1 px-2">Menetas</th>
            <th class="py-1 px-2">Buruk</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr class="border-t-2 border-white/20 font-bold">
            <td class="py-2 px-2">JUMLAH</td>
            <td class="py-2 px-2 tabular-num">${totals.bp_b}</td>
            <td class="py-2 px-2 tabular-num">${totals.bp_t}</td>
            <td class="py-2 px-2 tabular-num">${totals.td_b}</td>
            <td class="py-2 px-2 tabular-num">${totals.td_t}</td>
            <td class="py-2 px-2"></td>
            <td class="py-2 px-2"></td>
          </tr></tfoot>
        </table>
      </div>
    `, 'mb-4')
    bodyHolder.appendChild(tableCard)
    axisLockScroll(tableCard.querySelector('.overflow-x-auto'))

    bodyHolder.appendChild(flatCard(`
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div><span class="opacity-70">Jumlah Bilangan Penyu</span><div class="font-display text-xl tabular-num">${(totals.bp_b+totals.bp_t).toLocaleString()}</div></div>
        <div><span class="opacity-70">Jumlah Telur</span><div class="font-display text-xl tabular-num">${(totals.td_b+totals.td_t).toLocaleString()}</div></div>
        <div><span class="opacity-70">Telur Menetas</span><div class="font-display text-xl tabular-num">${monthMenetas.toLocaleString()}</div></div>
        <div><span class="opacity-70">Telur Buruk</span><div class="font-display text-xl tabular-num">${monthBuruk.toLocaleString()}</div></div>
        <div class="col-span-2"><span class="opacity-70">Kadar Menetas</span><div class="font-display text-xl tabular-num">${(monthMenetas+monthBuruk) ? Math.round(monthMenetas/(monthMenetas+monthBuruk)*100) + '%' : '—'}</div></div>
      </div>
      ${monthlyOverride.length ? `<p class="text-[11px] opacity-60 mt-2">Menetas/buruk ${monthlyOverride.join(' & ')} ikut rekod Menetas Bulanan (menggantikan angka harian).</p>` : ''}
    `))
  }

  function renderIndividu() {
    bodyHolder.innerHTML = ''
    if (!nests || !nests.length) {
      bodyHolder.appendChild(card(`<div class="text-center py-8 opacity-80">Tiada entri individu (per-sarang) untuk ${monthLabel} ${year} di ${island}. Data harian agregat mungkin masih ada di tab "Ringkasan Harian".</div>`))
      return
    }
    // Group by date, in the order sarang were keyed in that day
    const byDate = {}
    nests.forEach(n => {
      if (!byDate[n.tarikh_dijumpai]) byDate[n.tarikh_dijumpai] = []
      byDate[n.tarikh_dijumpai].push(n)
    })
    const dates = Object.keys(byDate).sort()
    dates.forEach(d => {
      const list = byDate[d]
      const jumlahSemua = list.reduce((s,n) => s + n.jumlah_telur_diram, 0)
      const rows = list.map((n, i) => `
        <tr class="border-b border-white/10">
          <td class="py-1.5 px-2 opacity-70">${i+1}</td>
          <td class="py-1.5 px-2 tabular-num font-semibold">${n.jumlah_telur_diram.toLocaleString()}</td>
          <td class="py-1.5 px-2 text-xs opacity-60">${n.ram} · ${n.bertag ? 'Bertag' : 'Tak Bertag'}</td>
        </tr>`).join('')
      bodyHolder.appendChild(flatCard(`
        <div class="flex items-center justify-between mb-2">
          <span class="font-semibold">${fmtDate(d)}</span>
          <span class="text-xs"><span class="opacity-60">Jumlah semua</span> <span class="font-display text-lg tabular-num ml-1">${jumlahSemua.toLocaleString()}</span></span>
        </div>
        <table class="w-full text-sm">
          <thead><tr class="text-left opacity-60 text-xs"><th class="py-1 px-2">Sarang</th><th class="py-1 px-2">Telur</th><th class="py-1 px-2">Keterangan</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `, 'mb-3'))
    })
  }

  function renderTab() {
    bodyHolder.innerHTML = skeletonBlock(2)
    requestAnimationFrame(() => { tab === 'ringkasan' ? renderRingkasan() : renderIndividu() })
  }
  renderTab()

  return wrap
}


async function screenDashboard() {
  const thisYear = new Date().getFullYear()
  if (!state.viewYear) state.viewYear = thisYear
  const year = state.viewYear
  destroyCharts()
  // Admin & kerani can flip between islands without re-logging in;
  // staff are locked to their own island.
  const canSwitch = state.profile?.role === 'admin' || state.profile?.role === 'kerani'
  if (!state.viewIsland) state.viewIsland = state.island
  const viewIsland = canSwitch ? state.viewIsland : state.island
  const wrap = document.createElement('div')
  const switcherHTML = canSwitch ? `
    <div class="seg mb-4" id="islandSwitcher">
      ${ISLANDS.map(i => `<button data-isl="${i.code}" class="${i.code===viewIsland?'active':''}">${i.code}</button>`).join('')}
    </div>` : `<div class="inline-block rounded px-2.5 py-1 text-xs font-semibold mb-4 bg-teal-900/40">${viewIsland}</div>`
  const yearOptions = Array.from({length:12}, (_,i) => thisYear + 1 - i)
  if (!yearOptions.includes(year)) yearOptions.push(year)
  const yearHTML = `<select id="dashYear" class="!w-auto text-sm !py-1.5 !px-3 font-semibold" aria-label="Pilih tahun">${yearOptions.map(y => `<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}</select>`
  wrap.innerHTML = `<h1 class="font-display text-2xl mb-2">Dashboard</h1><div class="flex items-center gap-3 flex-wrap mb-4">${switcherHTML.replace(/ mb-4/g,'')}${yearHTML}</div><div id="stats" class="stagger">${skeletonBlock(5)}</div>`
  wrap.querySelector('#dashYear').onchange = (e) => {
    state.viewYear = Number(e.target.value)
    go('dashboard')
  }
  if (canSwitch) {
    wrap.querySelectorAll('#islandSwitcher button').forEach(b => b.onclick = () => {
      state.viewIsland = b.dataset.isl
      go('dashboard')
    })
  }
  const { data } = await supabase.rpc('get_dashboard_totals', { p_year: year, p_island: viewIsland })
  const stats = wrap.querySelector('#stats')
  const jumlahTelur = data?.jumlah_telur || 0
  const jumlahMenetas = data?.jumlah_menetas || 0
  const jumlahBuruk = data?.jumlah_buruk || 0
  const jumlahPenyu = data?.jumlah_penyu || 0
  const target = data?.target || 0
  const pct = target ? Math.min(100, Math.round((jumlahTelur/target)*100)) : 0
  const hatchRate = (jumlahMenetas+jumlahBuruk) ? Math.round((jumlahMenetas/(jumlahMenetas+jumlahBuruk))*100) : 0
  const level = Math.floor(pct / 20) + 1

  stats.innerHTML = ''

  stats.appendChild(card(`
    <div class="flex items-center justify-between mb-2">
      <div class="eyebrow">Misi Tahun ${year}</div>
      <div class="text-xs font-bold px-2 py-1 rounded-full bg-emerald-400/20 text-emerald-300">LEVEL ${level}</div>
    </div>
    <div class="font-display text-5xl tabular-num mb-1"><span id="heroCount">0</span> <span class="text-lg opacity-60">/ ${target ? target.toLocaleString() : '—'}</span></div>
    <div class="xp-bar mt-3">
      <div class="xp-fill" id="heroBar" style="width:0%; background:${progressColor(pct)}; box-shadow:${progressGlow(pct)};"></div>
      ${[25,50,75].map(m => `<div class="milestone" style="left:${m}%"></div>`).join('')}
    </div>
    <div class="text-sm mt-3 flex items-center gap-2"><span>🐢</span><span><b class="tabular-num" id="cntPenyu">0</b> <span class="opacity-70">penyu mendarat</span></span></div>
    <div class="text-xs opacity-70 mt-2">${target ? pct + '% menuju sasaran · Baki ' + (target-jumlahTelur).toLocaleString() + ' telur' : 'Sasaran ' + year + ' belum ditetapkan untuk ' + viewIsland + ' (Admin → Sasaran Tahunan)'}</div>
  `, 'mb-4'))

  if (state.profile?.role !== 'staff') {
  stats.appendChild(flatCard(`
    <button id="presentBtn" class="btn btn-primary w-full flex items-center justify-center gap-2">
      <span>🎤</span><span>Jana Pembentangan (PowerPoint)</span>
    </button>
    <p class="text-xs opacity-60 mt-2 text-center">Untuk mesyuarat/bentang dengan pengurusan — boleh dibuka terus di PowerPoint atau diimport ke Google Slides.</p>
    <div id="presentMsg" class="hidden text-xs mt-2 text-emerald-300 text-center"></div>
  `, 'mb-4'))
  stats.querySelector('#presentBtn').onclick = async (e) => {
    const btn = e.currentTarget
    btn.disabled = true; btn.textContent = 'Menjana pembentangan...'
    try {
      await generatePresentation(viewIsland, year, {
        jumlahTelur, target, pct, hatchRate, jumlahBuruk, jumlahPenyu,
        monthly: data?.monthly || [], monthlyPenyu: data?.monthly_penyu || [],
        monthlyTargetMap
      })
      toast('Pembentangan dimuat turun', 'success')
    } catch (err) {
      toast('Gagal jana pembentangan: ' + err.message, 'error')
    }
    btn.disabled = false
    btn.innerHTML = '<span>🎤</span><span>Jana Pembentangan (PowerPoint)</span>'
  }
  }

  // Monthly HP-bar grid — per-month actual vs target, game-style progress
  const { data: monthlyTargetsRows } = await supabase.from('monthly_targets').select('*').eq('year', year).eq('island', viewIsland)
  const monthlyTargetMap = {}
  ;(monthlyTargetsRows||[]).forEach(r => { monthlyTargetMap[r.month] = r.target_value })
  const monthlyActual = data?.monthly || MONTH_LABELS.map(m => ({ month: m, telur: 0 }))

  const hpCells = MONTH_LABELS.map((label, i) => {
    const m = i + 1
    const actual = monthlyActual[i]?.telur || 0
    const mTarget = monthlyTargetMap[m]
    const mPct = mTarget ? Math.round((actual / mTarget) * 100) : 0
    const fillPct = Math.min(100, mPct)
    const achieved = mTarget && mPct >= 100
    return `
      <div class="month-hp ${achieved ? 'achieved' : ''} cursor-pointer" data-month="${m}">
        <div class="month-hp-fill" data-fill="${mTarget ? fillPct : 0}" style="width:0%; background:${progressColor(mPct)};"></div>
        <div class="month-hp-content">
          <span class="month-hp-label">${label}${achieved ? ' 🏆' : ''}</span>
          <span class="month-hp-value tabular-num"><span class="mhp-count" data-count="${actual}">0</span> / ${mTarget ? mTarget.toLocaleString() : '—'}</span>
          <span class="month-hp-pct tabular-num">${mTarget ? mPct + '%' : ''}</span>
        </div>
      </div>
    `
  }).join('')

  const monthGridCard = flatCard(`
    <div class="eyebrow mb-1">Progress Bulanan ${year}</div>
    <p class="text-xs opacity-50 mb-3">Tekan mana-mana bulan untuk lihat jadual harian penuh</p>
    <div class="grid grid-cols-3 gap-2">${hpCells}</div>
  `, 'mb-4')
  stats.appendChild(monthGridCard)
  monthGridCard.querySelectorAll('.month-hp[data-month]').forEach(cell => {
    cell.onclick = () => {
      state.viewMonth = { island: viewIsland, year, month: Number(cell.dataset.month) }
      go('monthdetail')
    }
  })

  // ---- Penetasan: menetas vs buruk, dengan pilihan jenis graf ----
  const hatchCard = flatCard(`
    <div class="flex items-center justify-between mb-3 gap-2">
      <div class="eyebrow">Penetasan ${year}</div>
      <div class="flex items-center gap-2">
        <select id="hatchView" class="!w-auto text-xs !py-1 !px-2" aria-label="Jenis graf penetasan">
          <option value="donut">Peratus (Donut)</option>
          <option value="bulanan">Ikut Bulan (Bar)</option>
          <option value="kadar">Kadar % vs ${year-1}</option>
          <option value="bilangan">Bilangan Menetas vs ${year-1}</option>
        </select>
        <button class="chart-expand-btn" title="Paparan penuh">⤢</button>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-2 mb-3 text-center">
      <div class="frosted-flat p-2"><div class="text-[11px] opacity-70">Telur Menetas</div><div class="font-display text-xl tabular-num" id="cntMenetas">0</div><div class="text-[10px] opacity-70" id="dMenetas">&nbsp;</div></div>
      <div class="frosted-flat p-2"><div class="text-[11px] opacity-70">Telur Buruk</div><div class="font-display text-xl tabular-num" id="cntBuruk">0</div><div class="text-[10px] opacity-70" id="dBuruk">&nbsp;</div></div>
      <div class="frosted-flat p-2"><div class="text-[11px] opacity-70">Kadar Menetas</div><div class="font-display text-xl tabular-num" id="cntHatch">0%</div><div class="text-[10px] opacity-70" id="dHatch">&nbsp;</div></div>
    </div>
    <div class="relative" id="hatchChartWrap">
      <canvas id="chartHatch" height="210"></canvas>
      <div id="hatchCenter" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none" style="padding-bottom:34px"></div>
    </div>
    <p class="text-[11px] opacity-60 mt-2" id="hatchNote">Kadar menetas = menetas ÷ (menetas + buruk). Dikira ikut bulan telur diram.</p>
  `, 'mb-4')

  const barCard = flatCard(`
    <div class="flex items-center justify-between mb-3">
      <div class="eyebrow">Trend Bulanan ${year}</div>
      <div class="flex items-center gap-2">
        <select id="metricSelect" class="!w-auto text-xs !py-1 !px-2">
          <option value="telur">Jumlah Telur</option>
          <option value="penyu">Bilangan Penyu</option>
        </select>
        <button class="chart-expand-btn" title="Paparan penuh">⤢</button>
      </div>
    </div>
    <canvas id="chartBar" height="180"></canvas>
  `, 'mb-4')
  stats.appendChild(barCard)
  const lineCard = flatCard(`
    <div class="flex items-center justify-between mb-3">
      <div class="eyebrow" id="cumulativeLabel">Kumulatif Sepanjang Tahun (Telur)</div>
      <button class="chart-expand-btn" title="Paparan penuh">⤢</button>
    </div>
    <canvas id="chartLine" height="180"></canvas>
  `, 'mb-4')
  stats.appendChild(lineCard)
  const compareCard = flatCard(`
    <div class="flex items-center justify-between mb-3">
      <div class="eyebrow">Perbandingan Tahun</div>
      <div class="flex items-center gap-2">
        <select id="compareYears" class="!w-auto text-xs !py-1 !px-2">
          <option value="2">2 tahun</option>
          <option value="3">3 tahun</option>
          <option value="5">5 tahun</option>
        </select>
        <button class="chart-expand-btn" title="Paparan penuh">⤢</button>
      </div>
    </div>
    <canvas id="chartCompare" height="200"></canvas>
  `, 'mb-4')
  stats.appendChild(compareCard)
  stats.appendChild(hatchCard) // Penetasan paling bawah


  // Trigger counting animations now that elements are in the DOM
  requestAnimationFrame(() => {
    const hero = stats.querySelector('#heroCount')
    if (hero) animateCount(hero, jumlahTelur)
    const cp = stats.querySelector('#cntPenyu'); if (cp) animateCount(cp, jumlahPenyu)
    const ch = stats.querySelector('#cntHatch'); if (ch) animateCount(ch, hatchRate, { suffix: '%' })
    const cb = stats.querySelector('#cntBuruk'); if (cb) animateCount(cb, jumlahBuruk)
    const cm = stats.querySelector('#cntMenetas'); if (cm) animateCount(cm, jumlahMenetas)
    // Bars fill from 0 → actual value (double rAF so the browser paints
    // the 0% state first, letting the CSS width transition actually run)
    requestAnimationFrame(() => {
      const heroBar = stats.querySelector('#heroBar')
      if (heroBar) heroBar.style.width = pct + '%'
      stats.querySelectorAll('.month-hp-fill').forEach(f => { f.style.width = f.dataset.fill + '%' })
      stats.querySelectorAll('.mhp-count').forEach(el => animateCount(el, Number(el.dataset.count)))
    })
  })

  const monthly = data?.monthly || MONTH_LABELS.map(m => ({ month: m, telur: 0 }))
  const monthlyPenyu = data?.monthly_penyu || MONTH_LABELS.map(m => ({ month: m, penyu: 0 }))
  let currentMetric = 'telur'

  const barCtx = stats.querySelector('#chartBar').getContext('2d')
  const barChart = new Chart(barCtx, {
    type: 'bar',
    data: { labels: MONTH_LABELS, datasets: [{ label:'Telur', data: monthly.map(m=>m.telur), backgroundColor:'#2E9099', borderRadius:6 }] },
    options: { interaction: CHART_INTERACTION, plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'#9ca3af', precision:0} }, x:{ grid:{display:false}, ticks:{color:'#9ca3af'} } } }
  })
  chartInstances.push(barChart)
  attachChartExpand(barCard, () => `Trend Bulanan ${year} — ${currentMetric === 'telur' ? 'Jumlah Telur' : 'Bilangan Penyu'}`, () => barChart)

  function cumulativeChart(metric) {
    const src = metric === 'telur' ? monthly.map(m=>m.telur) : monthlyPenyu.map(m=>m.penyu)
    let c = 0
    return src.map(v => (c += v))
  }
  const lineCtx = stats.querySelector('#chartLine').getContext('2d')
  const lineChart = new Chart(lineCtx, {
    type: 'line',
    data: { labels: MONTH_LABELS, datasets: [{ label:'Kumulatif', data: cumulativeChart('telur'), borderColor:'#6EE7B7', backgroundColor:'rgba(110,231,183,.15)', fill:true, tension:.35 }] },
    options: { interaction: CHART_INTERACTION, plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'#9ca3af', precision:0} }, x:{ grid:{display:false}, ticks:{color:'#9ca3af'} } } }
  })
  chartInstances.push(lineChart)
  attachChartExpand(lineCard, () => stats.querySelector('#cumulativeLabel').textContent, () => lineChart)

  stats.querySelector('#metricSelect').onchange = (e) => {
    currentMetric = e.target.value
    const isEggs = currentMetric === 'telur'
    barChart.data.datasets[0].label = isEggs ? 'Telur' : 'Penyu'
    barChart.data.datasets[0].data = isEggs ? monthly.map(m=>m.telur) : monthlyPenyu.map(m=>m.penyu)
    barChart.update()
    lineChart.data.datasets[0].data = cumulativeChart(currentMetric)
    lineChart.update()
    stats.querySelector('#cumulativeLabel').textContent = isEggs ? 'Kumulatif Sepanjang Tahun (Telur)' : 'Kumulatif Sepanjang Tahun (Penyu)'
  }

  let compareChart = null
  async function renderCompare(nYears) {
    if (compareChart) { compareChart.destroy(); chartInstances = chartInstances.filter(c => c !== compareChart); compareChart = null }
    const years = Array.from({length:nYears}, (_,i) => year - i).reverse()
    const { data: multi } = await supabase.rpc('get_multi_year_monthly', { p_years: years, p_island: viewIsland })
    const colors = ['#2E9099','#6EE7B7','#E0A458','#E1604C','#9AB18F']
    const datasets = years.map((y,i) => ({
      label: String(y),
      data: (multi?.[y] || monthly.map(m=>({month:m.month,telur:0}))).map(m=>m.telur),
      borderColor: colors[i % colors.length], backgroundColor:'transparent', tension:.35
    }))
    const compareCtx = stats.querySelector('#chartCompare').getContext('2d')
    compareChart = new Chart(compareCtx, {
      type: 'line',
      data: { labels: MONTH_LABELS, datasets },
      options: { interaction: CHART_INTERACTION, plugins:{legend:{labels:{color:'#9ca3af'}}}, scales:{ y:{ grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'#9ca3af'} }, x:{ grid:{display:false}, ticks:{color:'#9ca3af'} } } }
    })
    chartInstances.push(compareChart)
  }
  renderCompare(2)
  attachChartExpand(compareCard, () => 'Perbandingan Tahun', () => compareChart)
  stats.querySelector('#compareYears').onchange = (e) => renderCompare(Number(e.target.value))

  // ---- Penetasan chart ----
  const emptyHatch = () => Array.from({length:12}, (_,i) => ({ month: i+1, telur: 0, menetas: 0, buruk: 0 }))
  const hatchNow = (data?.monthly_hatch && data.monthly_hatch.length === 12) ? data.monthly_hatch : emptyHatch()
  let hatchPrev = emptyHatch()
  const rateOf = (m, b) => (m + b) ? Math.round(m / (m + b) * 1000) / 10 : null
  const sumOf = (arr, k) => arr.reduce((s, r) => s + (Number(r[k]) || 0), 0)
  const axisOpts = (extra = {}) => ({ y:{ grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'#9ca3af', precision:0}, ...(extra.y||{}) }, x:{ grid:{display:false}, ticks:{color:'#9ca3af'}, ...(extra.x||{}) } })
  let hatchChart = null
  let hatchView = localStorage.getItem('penyu-hatchview') || 'donut'
  const hatchSel = stats.querySelector('#hatchView')
  if (![...hatchSel.options].some(o => o.value === hatchView)) hatchView = 'donut'
  hatchSel.value = hatchView

  function renderHatchDeltas() {
    const pm = sumOf(hatchPrev, 'menetas'), pb = sumOf(hatchPrev, 'buruk')
    const pr = rateOf(pm, pb), nr = rateOf(jumlahMenetas, jumlahBuruk)
    const arrow = (d, goodUp = true) => d === 0 ? '＝' : ((d > 0) === goodUp ? '<span class="text-emerald-300">▲</span>' : '<span class="text-orange-300">▼</span>')
    const set = (id, html) => { const el = stats.querySelector(id); if (el) el.innerHTML = html }
    if (!pm && !pb) { ['#dMenetas','#dBuruk','#dHatch'].forEach(id => set(id, `tiada data ${year-1}`)); return }
    set('#dMenetas', `${arrow(jumlahMenetas - pm)} ${pm.toLocaleString()} pada ${year-1}`)
    set('#dBuruk', `${arrow(jumlahBuruk - pb, false)} ${pb.toLocaleString()} pada ${year-1}`)
    set('#dHatch', nr === null || pr === null ? `${pr ?? '—'}% pada ${year-1}` : `${arrow(nr - pr)} ${Math.abs(Math.round((nr - pr) * 10) / 10)} mata vs ${year-1}`)
  }

  function renderHatchChart() {
    if (hatchChart) { hatchChart.destroy(); chartInstances = chartInstances.filter(c => c !== hatchChart); hatchChart = null }
    const center = stats.querySelector('#hatchCenter')
    center.innerHTML = ''
    const ctx = stats.querySelector('#chartHatch').getContext('2d')
    const legend = { labels: { color:'#9ca3af', usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8 } }
    let cfg
    if (hatchView === 'donut') {
      const belum = Math.max(0, jumlahTelur - jumlahMenetas - jumlahBuruk)
      const rate = rateOf(jumlahMenetas, jumlahBuruk)
      const pctOfTotal = (v) => jumlahTelur ? (Math.round(v / jumlahTelur * 1000) / 10) + '%' : '—'
      cfg = {
        type: 'doughnut',
        data: { labels: ['Menetas', 'Buruk', 'Belum direkod'], datasets: [{ data: [jumlahMenetas, jumlahBuruk, belum], backgroundColor: [HATCH_COLORS.menetas, HATCH_COLORS.buruk, HATCH_COLORS.belum], borderColor: 'rgba(15,42,56,.9)', borderWidth: 2, hoverOffset: 6 }] },
        options: { cutout: '68%', plugins: { legend: { ...legend, position: 'bottom' }, tooltip: { callbacks: { label: (c) => ` ${c.label}: ${Number(c.raw).toLocaleString()} (${pctOfTotal(c.raw)} daripada ${jumlahTelur.toLocaleString()} telur)` } } } }
      }
      center.innerHTML = rate === null
        ? '<div class="text-xs opacity-60 text-center">Belum ada data<br/>menetas / buruk</div>'
        : `<div class="font-display text-3xl tabular-num">${rate}%</div><div class="text-[11px] opacity-70">kadar menetas</div>`
    } else if (hatchView === 'bulanan') {
      const belum = hatchNow.map(r => Math.max(0, (r.telur||0) - (r.menetas||0) - (r.buruk||0)))
      cfg = {
        type: 'bar',
        data: { labels: MONTH_LABELS, datasets: [
          { label: 'Menetas', data: hatchNow.map(r => r.menetas||0), backgroundColor: HATCH_COLORS.menetas, borderRadius: 4, stack: 's' },
          { label: 'Buruk', data: hatchNow.map(r => r.buruk||0), backgroundColor: HATCH_COLORS.buruk, borderRadius: 4, stack: 's' },
          { label: 'Belum direkod', data: belum, backgroundColor: HATCH_COLORS.belum, borderRadius: 4, stack: 's' }
        ] },
        options: { interaction: CHART_INTERACTION, plugins: { legend, tooltip: { callbacks: { footer: (items) => { const r = hatchNow[items[0].dataIndex]; const k = rateOf(r.menetas||0, r.buruk||0); return `Diram ${(r.telur||0).toLocaleString()}${k === null ? '' : ` · Kadar ${k}%`}` } } } }, scales: { ...axisOpts(), x: { stacked: true, grid:{display:false}, ticks:{color:'#9ca3af'} }, y: { stacked: true, grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'#9ca3af', precision:0} } } }
      }
    } else if (hatchView === 'kadar') {
      cfg = {
        type: 'line',
        data: { labels: MONTH_LABELS, datasets: [
          { label: String(year), data: hatchNow.map(r => rateOf(r.menetas||0, r.buruk||0)), borderColor: HATCH_COLORS.menetas, backgroundColor: HATCH_COLORS.menetas, borderWidth: 2, pointRadius: 4, tension: .3, spanGaps: true },
          { label: String(year-1), data: hatchPrev.map(r => rateOf(r.menetas||0, r.buruk||0)), borderColor: 'rgba(148,163,184,.8)', backgroundColor: 'rgba(148,163,184,.8)', borderDash: [5,4], borderWidth: 2, pointRadius: 3, tension: .3, spanGaps: true }
        ] },
        options: { interaction: CHART_INTERACTION, plugins: { legend, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${c.raw === null ? 'tiada data' : c.raw + '%'}` } } }, scales: axisOpts({ y: { min: 0, max: 100, ticks: { color:'#9ca3af', callback: (v) => v + '%' } } }) }
      }
    } else {
      cfg = {
        type: 'bar',
        data: { labels: MONTH_LABELS, datasets: [
          { label: String(year), data: hatchNow.map(r => r.menetas||0), backgroundColor: HATCH_COLORS.menetas, borderRadius: 4 },
          { label: String(year-1), data: hatchPrev.map(r => r.menetas||0), backgroundColor: 'rgba(148,163,184,.55)', borderRadius: 4 }
        ] },
        options: { interaction: CHART_INTERACTION, plugins: { legend }, scales: axisOpts() }
      }
    }
    hatchChart = new Chart(ctx, cfg)
    chartInstances.push(hatchChart)
  }
  hatchSel.onchange = (e) => { hatchView = e.target.value; localStorage.setItem('penyu-hatchview', hatchView); renderHatchChart() }
  attachChartExpand(hatchCard, () => `Penetasan ${year} — ${hatchSel.options[hatchSel.selectedIndex].text}`, () => hatchChart)
  renderHatchChart()
  supabase.rpc('get_multi_year_monthly', { p_years: [year-1], p_island: viewIsland }).then(({ data: prev }) => {
    const arr = prev?.[String(year-1)]
    if (Array.isArray(arr) && arr.length === 12) hatchPrev = arr.map((r, i) => ({ month: i+1, telur: r.telur||0, menetas: r.menetas||0, buruk: r.buruk||0 }))
    renderHatchDeltas()
    if (hatchView === 'kadar' || hatchView === 'bilangan') renderHatchChart()
  })

  return wrap
}

// =========================================================================
// ADMIN
// =========================================================================
async function screenAdmin() {
  const isKerani = state.profile?.role === 'kerani'
  if (state.profile?.role !== 'admin' && !isKerani) return card('Akses admin sahaja.')
  const year = new Date().getFullYear()
  const { data: t } = await supabase.from('targets').select('*').eq('year', year).eq('island', state.island).maybeSingle()
  const { data: mt } = await supabase.from('monthly_targets').select('*').eq('year', year).eq('island', state.island)
  const { data: logins } = await supabase.from('login_log').select('*, staff_profiles(full_name, island)').order('logged_in_at', { ascending: false }).limit(20)

  const wrap = document.createElement('div')
  wrap.innerHTML = `

  function parseImportFile(wb, island, yr) {
    const rows = []
    MONTH_SHEET_NAMES.forEach((sheetName, mi) => {
      const ws = wb.Sheets[sheetName]
      if (!ws) return
      const daysInMonth = new Date(yr, mi+1, 0).getDate()
      const num = (ref) => { const c = ws[ref]; const v = c ? Number(c.v) : 0; return isNaN(v) ? 0 : v }
      const txt = (ref) => { const c = ws[ref]; return c && c.v != null && String(c.v).trim() !== '' ? String(c.v) : null }
      // Buruk (O-R): formula template (diram − menetas) diabaikan; hanya angka ditaip terus diambil
      const bur = (ref) => { const c = ws[ref]; if (!c || c.f || c.v === '' || c.v == null) return null; const v = Number(c.v); return isNaN(v) ? null : Math.max(0, v) }
      for (let day = 1; day <= daysInMonth; day++) {
        const r = 7 + day
        const dateStr = `${yr}-${String(mi+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`
        const lpp = { bp_b:num(`C${r}`), bp_t:num(`D${r}`), td_b:num(`G${r}`), td_t:num(`H${r}`), tm_b:num(`K${r}`), tm_t:num(`L${r}`), tb_b:bur(`O${r}`), tb_t:bur(`P${r}`), dk:num(`S${r}`) }
        const sfc = { bp_b:num(`E${r}`), bp_t:num(`F${r}`), td_b:num(`I${r}`), td_t:num(`J${r}`), tm_b:num(`M${r}`), tm_t:num(`N${r}`), tb_b:bur(`Q${r}`), tb_t:bur(`R${r}`), dk:0 }
        const cat = txt(`T${r}`)
        const build = (ram, v) => {
          const hasMenetas = !!(v.tm_b || v.tm_t)
          const hasBuruk = !!(v.tb_b || v.tb_t) || (hasMenetas && (v.tb_b !== null || v.tb_t !== null))
          if (!(v.bp_b || v.bp_t || v.td_b || v.td_t || hasMenetas || hasBuruk || v.dk)) return null
          return {
            island, tarikh: dateStr, ram,
            bilangan_penyu_bertag: v.bp_b, bilangan_penyu_takbertag: v.bp_t,
            jumlah_telur_diram_bertag: v.td_b, jumlah_telur_diram_takbertag: v.td_t,
            telur_menetas_bertag: hasMenetas ? v.tm_b : null, telur_menetas_takbertag: hasMenetas ? v.tm_t : null,
            telur_buruk_bertag: hasBuruk ? (v.tb_b ?? 0) : null, telur_buruk_takbertag: hasBuruk ? (v.tb_t ?? 0) : null,
            jumlah_telur_dikeluarkan: v.dk || null,
            catatan: cat, created_by: state.profile.id
          }
        }
        const a = build('LPP', lpp); if (a) rows.push(a)
        const b = build('SFC', sfc); if (b) rows.push(b)
      }
    })
    return rows
  }

  function buildImportPlan(rows, app) {
    const plan = { baru: [], sama: [], lengkap: [], canggah: [], appOnly: 0 }
    const fileKeys = new Set()
    rows.forEach(fr => {
      const key = `${fr.tarikh}|${fr.ram}`
      fileKeys.add(key)
      const g = app[key]
      if (!g) { plan.baru.push({ key, file: fr }); return }
      const agg = aggregateDayRam(g.daily, g.nests)
      const nestOnly = !g.daily.length
      const fills = {}, diffs = []
      DAY_FIELDS.forEach(([f, , optional]) => {
        const fv = fr[f] ?? (optional ? null : 0)
        const av = agg[f] ?? (optional ? null : 0)
        if (optional) {
          if (fv === null) return
          if (nestOnly) return // menetas/buruk sarang individu diurus per sarang
          if (av === null) { fills[f] = fv; return }
        }
        if (fv !== av) diffs.push(f)
      })
      const item = { key, file: fr, agg, daily: g.daily, nests: g.nests, fills, diffs, appDup: g.daily.length > 1 || (g.daily.length && g.nests.length) }
      if (diffs.length) plan.canggah.push(item)
      else if (Object.keys(fills).length) plan.lengkap.push(item)
      else plan.sama.push(item)
    })
    plan.appOnly = Object.keys(app).filter(k => !fileKeys.has(k)).length
    return plan
  }

    const pc = card(`

      <div class="grid grid-cols-4 gap-2 mb-3">
        ${chip(plan.baru.length, 'Baharu', 'text-emerald-300')}
        ${chip(plan.sama.length, 'Sama', '')}
        ${chip(plan.lengkap.length, 'Lengkapkan', 'text-sky-300')}
        ${chip(plan.canggah.length, 'Bercanggah', plan.canggah.length ? 'text-amber-300' : '')}
      </div>

      ${listDetails(plan.baru, '🟢 Baharu — akan dimasukkan', p => `<div>${fmtDate(p.file.tarikh)} · ${p.file.ram} · ${p.file.jumlah_telur_diram_bertag + p.file.jumlah_telur_diram_takbertag} telur</div>`)}
      ${listDetails(plan.lengkap, '🔵 Lengkapkan — app kosong, fail ada nilai (diisi)', p => `<div>${fmtDate(p.file.tarikh)} · ${p.file.ram} · ${Object.keys(p.fills).map(f => DAY_FIELD_LABEL[f] + ' ' + p.fills[f]).join(', ')}</div>`)}
      ${listDetails(plan.sama, '⚪ Sama — dilangkau', p => `<div>${fmtDate(p.file.tarikh)} · ${p.file.ram}</div>`)}
      ${plan.canggah.length ? `

  async function applyImportPlan(plan, decisions, ctx) {
    const batch = newBatchId()
    const { error: logErr } = await supabase.from('import_log').insert({ batch, island: ctx.island, year: ctx.yr, file_name: ctx.fileName, created_by: state.profile.id })
    if (logErr) throw new Error('Jadual import_log tiada — run migration-anti-pendua.sql dalam Supabase dulu. (' + logErr.message + ')')
    const inserts = plan.baru.map(p => ({ ...p.file, import_batch: batch }))
    const updates = [], delDaily = [], delNests = []
    plan.lengkap.forEach(p => updates.push({ row: p.daily[0], patch: { ...p.fills, updated_by: state.profile.id } }))
    let keptApp = 0
    plan.canggah.forEach(p => {
      if (decisions[p.key] !== 'fail') { keptApp++; return }
      if (p.daily.length) {
        const patch = { updated_by: state.profile.id }
        DAY_FIELDS.forEach(([f, , optional]) => { const v = p.file[f]; if (!optional || v !== null) patch[f] = optional ? v : (v ?? 0) })
        if (p.file.catatan && !p.daily[0].catatan) patch.catatan = p.file.catatan
        updates.push({ row: p.daily[0], patch })
        p.daily.slice(1).forEach(d => delDaily.push(d))
      } else {
        inserts.push({ ...p.file, import_batch: batch })
      }
      p.nests.forEach(n => delNests.push(n))
    })
    // 1) salinan sebelum ubah/padam (untuk undo)
    await saveUndo(batch, [
      ...updates.map(u => ({ table: 'daily_entries', row: u.row, action: 'update' })),
      ...delDaily.map(r => ({ table: 'daily_entries', row: r, action: 'delete' })),
      ...delNests.map(r => ({ table: 'nest_records', row: r, action: 'delete' }))
    ])
    // 2) padam pendua dulu (elak langgar kunci satu-harian-satu-RAM), kemudian kemaskini, kemudian masuk baharu
    if (delDaily.length) { const { error } = await supabase.from('daily_entries').delete().in('id', delDaily.map(r => r.id)); if (error) throw error }
    if (delNests.length) { const { error } = await supabase.from('nest_records').delete().in('id', delNests.map(r => r.id)); if (error) throw error }
    for (const u of updates) { const { error } = await supabase.from('daily_entries').update(u.patch).eq('id', u.row.id); if (error) throw error }
    for (let i = 0; i < inserts.length; i += 100) { const { error } = await supabase.from('daily_entries').insert(inserts.slice(i, i+100)); if (error) throw error }
    const res = { inserted: inserts.length, updated: updates.length, deleted: delDaily.length + delNests.length, keptApp }
    await supabase.from('import_log').update({ inserted: res.inserted, updated: res.updated, deleted: res.deleted }).eq('batch', batch)
    return res
  }

// ---------- Presentation generator (PptxGenJS) ----------
async function generatePresentation(island, year, s) {
  const pptx = new PptxGenJS()
  pptx.layout = 'LAYOUT_WIDE'
  const NAVY='0A1F2B', PANEL='123244', PANEL2='0F2A38', TEAL='1F6F78', GLOW='6EE7B7',
        SAND='F7F2E7', GOLD='E0A458', CORAL='E1604C', MUTED='9CA3AF'

  let slideNum = 0
  function baseSlide(title) {
    slideNum++
    const sl = pptx.addSlide()
    sl.background = { color: NAVY }
    sl.addText(title, { x:0.67, y:0.43, w:12, h:0.73, fontSize:24, bold:true, color:SAND })
    sl.addShape(pptx.ShapeType.rect, { x:0.67, y:1.16, w:1.47, h:0.06, fill:{ color:GLOW }, line:{ type:'none' } })
    sl.addText(`${island} · Penyu Tracker · ${year}`, { x:0.67, y:7.07, w:8, h:0.4, fontSize:9, color:MUTED })
    sl.addText(String(slideNum), { x:12.13, y:7.07, w:0.53, h:0.4, fontSize:9, color:MUTED, align:'right' })
    return sl
  }

  // Slide 1 — Title
  const s1 = pptx.addSlide()
  s1.background = { color: NAVY }
  s1.addShape(pptx.ShapeType.rect, { x:0, y:0, w:0.19, h:7.5, fill:{ color:GLOW }, line:{ type:'none' } })
  s1.addText('Penyu Tracker', { x:0.93, y:2.47, w:11.33, h:1.2, fontSize:40, bold:true, color:SAND, fontFace:'Georgia' })
  s1.addText(`Laporan Prestasi — ${island} · ${year}`, { x:0.93, y:3.53, w:11.33, h:0.8, fontSize:20, color:GLOW })
  s1.addText(`Dijana ${new Date().toLocaleDateString('ms-MY')}`, { x:0.93, y:6.6, w:11.33, h:0.53, fontSize:11, color:MUTED })

  // Slide 2 — Key numbers
  slideNum++
  const s2 = pptx.addSlide()
  s2.background = { color: NAVY }
  s2.addText('Pencapaian Sasaran', { x:0.67, y:0.43, w:12, h:0.73, fontSize:24, bold:true, color:SAND })
  s2.addShape(pptx.ShapeType.rect, { x:0.67, y:1.16, w:1.47, h:0.06, fill:{ color:GLOW }, line:{ type:'none' } })
  const kpis = [
    [`${s.jumlahTelur.toLocaleString()}`, 'Jumlah Telur', GLOW],
    [s.target ? `${s.pct}%` : '—', 'Peratus Sasaran', GOLD],
    [`${s.jumlahPenyu.toLocaleString()}`, 'Bilangan Penyu', SAND],
    [`${s.hatchRate}%`, 'Kadar Menetas', GLOW],
    [`${s.jumlahBuruk.toLocaleString()}`, 'Telur Buruk', CORAL],
    [s.target ? s.target.toLocaleString() : '—', 'Sasaran Tahunan', SAND],
  ]
  kpis.forEach((k, i) => {
    const col = i % 3, row = Math.floor(i / 3)
    const x = 0.67 + col * 4.13, y = 1.6 + row * 2.53
    s2.addShape(pptx.ShapeType.roundRect, { x, y, w:3.8, h:2.13, fill:{ color:PANEL }, line:{ color:TEAL, width:1 }, rectRadius:0.08 })
    s2.addText(k[0], { x, y:y+0.2, w:3.8, h:1.07, align:'center', fontSize:28, bold:true, color:k[2] })
    s2.addText(k[1], { x, y:y+1.27, w:3.8, h:0.53, align:'center', fontSize:12, color:MUTED })
  })
  s2.addText(`${island} · Penyu Tracker · ${year}`, { x:0.67, y:7.07, w:8, h:0.4, fontSize:9, color:MUTED })
  s2.addText(String(slideNum), { x:12.13, y:7.07, w:0.53, h:0.4, fontSize:9, color:MUTED, align:'right' })

  // Slide 3 — Monthly breakdown table (penyu, telur, sasaran, % capaian per month)
  const s3 = baseSlide('Data Bulanan Terperinci')
  const monthlyTarget = s.monthlyTargetMap || {}
  let bestIdx = 0
  s.monthly.forEach((m, i) => { if ((m.telur||0) > (s.monthly[bestIdx]?.telur||0)) bestIdx = i })
  const headerRow = ['Bulan', 'Penyu', 'Telur', 'Sasaran', '% Capaian'].map(t => ({
    text: t, options: { bold:true, color:SAND, fill:{ color:TEAL }, align: t==='Bulan' ? 'left' : 'right', fontSize:11 }
  }))
  const dataRows = MONTH_LABELS.map((label, i) => {
    const m = i + 1
    const telur = s.monthly[i]?.telur || 0
    const penyu = s.monthlyPenyu[i]?.penyu || 0
    const mTarget = monthlyTarget[m]
    const mPct = mTarget ? Math.round((telur / mTarget) * 100) : null
    const achieved = mTarget && mPct >= 100
    const rowFill = i % 2 === 0 ? PANEL2 : PANEL
    const isBest = i === bestIdx && telur > 0
    return [
      { text: label + (isBest ? '  🏆' : ''), options: { color:SAND, fill:{ color:rowFill }, fontSize:11 } },
      { text: String(penyu), options: { color:SAND, fill:{ color:rowFill }, align:'right', fontSize:11 } },
      { text: telur.toLocaleString(), options: { color: isBest ? GOLD : GLOW, bold:true, fill:{ color:rowFill }, align:'right', fontSize:11 } },
      { text: mTarget ? mTarget.toLocaleString() : '—', options: { color:MUTED, fill:{ color:rowFill }, align:'right', fontSize:11 } },
      { text: mTarget ? mPct + '%' : '—', options: { color: achieved ? GOLD : MUTED, bold: achieved, fill:{ color:rowFill }, align:'right', fontSize:11 } },
    ]
  })
  s3.addTable([headerRow, ...dataRows], {
    x:0.67, y:1.4, w:12, colW:[2.76, 2.58, 2.58, 2.58, 1.5],
    border: { type:'solid', color:'0A1F2B', pt:0.5 },
    autoPage: false, valign:'middle', margin:0.04
  })

  // Slide 4 — Monthly eggs bar chart
  const s4 = baseSlide('Trend Bulanan — Jumlah Telur')
  s4.addChart(pptx.ChartType.bar, [{
    name: 'Telur', labels: s.monthly.map(m=>m.month), values: s.monthly.map(m=>m.telur)
  }], {
    x:0.67, y:1.47, w:12, h:5.4,
    chartColors:[TEAL], catAxisLabelColor:SAND, valAxisLabelColor:SAND,
    dataLabelColor:SAND, showLegend:false, showTitle:false,
    catAxisLineColor:'444444', valAxisLineColor:'444444'
  })

  // Slide 5 — Monthly turtle count bar chart
  const s5 = baseSlide('Trend Bulanan — Bilangan Penyu')
  s5.addChart(pptx.ChartType.bar, [{
    name: 'Penyu', labels: s.monthlyPenyu.map(m=>m.month), values: s.monthlyPenyu.map(m=>m.penyu)
  }], {
    x:0.67, y:1.47, w:12, h:5.4,
    chartColors:[GLOW], catAxisLabelColor:SAND, valAxisLabelColor:SAND,
    dataLabelColor:SAND, showLegend:false, showTitle:false,
    catAxisLineColor:'444444', valAxisLineColor:'444444'
  })

  // Slide 6 — Closing
  const s6 = pptx.addSlide()
  s6.background = { color: NAVY }
  s6.addShape(pptx.ShapeType.rect, { x:0, y:0, w:0.19, h:7.5, fill:{ color:GLOW }, line:{ type:'none' } })
  s6.addText('Terima Kasih', { x:0.93, y:2.87, w:11.33, h:1.2, fontSize:34, bold:true, color:SAND, fontFace:'Georgia' })
  s6.addText(`${island} · Penyu Tracker`, { x:0.93, y:3.87, w:11.33, h:0.67, fontSize:16, color:GLOW })

  pptx.writeFile({ fileName: `Pembentangan-${island}-${year}.pptx` })
}

// Export ditulis TERUS ke dalam XML template (bukan melalui SheetJS) supaya
// warna, border, lebar lajur & formula JUMLAH template kekal 100%.
async function loadJSZip() {
  if (window.JSZip) return window.JSZip
  await new Promise((resolve, reject) => {
    const s = document.createElement('script')
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
    s.onload = resolve
    s.onerror = () => reject(new Error('Gagal muat JSZip — semak internet'))
    document.head.appendChild(s)
  })
  return window.JSZip
}

const xmlEsc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')

// Ganti nilai sel dalam satu sheet XML sekali lalu. updates: Map(ref -> number | string | null)
// null = kosongkan sel (buang formula). Gaya sel (s="..") dikekalkan.
function patchSheetXml(xml, updates) {
  return xml.replace(/<c r="([A-Z]+\d+)"([^>]*?)(\/>|>[\s\S]*?<\/c>)/g, (m, ref, attrs) => {
    if (!updates.has(ref)) return m
    const v = updates.get(ref)
    const s = (attrs.match(/\ss="\d+"/) || [''])[0]
    if (v === null || v === undefined || v === '') return `<c r="${ref}"${s}/>`
    if (typeof v === 'number') return `<c r="${ref}"${s} t="n"><v>${v}</v></c>`
    return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`
  })
}

async function exportToExcel(island, year) {
  const templateUrl = `assets/template-${island}.xlsx`
  const res = await fetch(templateUrl)
  if (!res.ok) throw new Error(`Template ${templateUrl} tidak dijumpai`)
  const JSZip = await loadJSZip()
  const zip = await JSZip.loadAsync(await res.arrayBuffer())

  const yearStart = `${year}-01-01`, yearEnd = `${year}-12-31`
  const [{ data: dailyRows }, { data: nestRows }, { data: hatchRows }] = await Promise.all([
    supabase.from('daily_entries').select('*').eq('island', island).gte('tarikh', yearStart).lte('tarikh', yearEnd).limit(10000),
    supabase.from('nest_records').select('*').eq('island', island).gte('tarikh_dijumpai', yearStart).lte('tarikh_dijumpai', yearEnd).limit(10000),
    supabase.from('monthly_hatch').select('*').eq('island', island).eq('year', year)
  ])

  // Kumpul ikut tarikh + RAM
  const buckets = {}
  const B = (date, ram) => buckets[`${date}|${ram}`] ||= { bp_b:0, bp_t:0, td_b:0, td_t:0, tm_b:0, tm_t:0, tm_has:false, tb_b:null, tb_t:null, dk:0, cat:[] }
  const addBuruk = (b, side, v) => { if (v === null || v === undefined) return; b[side] = (b[side] ?? 0) + v }
  ;(dailyRows||[]).forEach(d => {
    const b = B(d.tarikh, d.ram)
    b.bp_b += d.bilangan_penyu_bertag; b.bp_t += d.bilangan_penyu_takbertag
    b.td_b += d.jumlah_telur_diram_bertag; b.td_t += d.jumlah_telur_diram_takbertag
    if (d.telur_menetas_bertag != null) { b.tm_b += d.telur_menetas_bertag; b.tm_has = true }
    if (d.telur_menetas_takbertag != null) { b.tm_t += d.telur_menetas_takbertag; b.tm_has = true }
    addBuruk(b, 'tb_b', d.telur_buruk_bertag); addBuruk(b, 'tb_t', d.telur_buruk_takbertag)
    if (d.jumlah_telur_dikeluarkan) b.dk += d.jumlah_telur_dikeluarkan
    if (d.catatan) b.cat.push(d.catatan)
  })
  ;(nestRows||[]).forEach(n => {
    const b = B(n.tarikh_dijumpai, n.ram)
    const side = n.bertag ? 'b' : 't'
    b[`bp_${side}`] += 1; b[`td_${side}`] += n.jumlah_telur_diram
    if (n.telur_menetas != null) { b[`tm_${side}`] += n.telur_menetas; b.tm_has = true }
    addBuruk(b, `tb_${side}`, n.telur_buruk)
    if (n.jumlah_dikeluarkan) b.dk += n.jumlah_dikeluarkan
    if (n.catatan) b.cat.push(n.catatan)
  })
  // Telur buruk = angka sebenar kalau direkod; kalau menetas direkod tanpa buruk → diram − menetas;
  // kalau menetas belum direkod → 0 (BUKAN semua telur dikira buruk macam formula template)
  const buruk = (b, side) => {
    const explicit = b[`tb_${side}`]
    if (explicit !== null) return explicit
    return b.tm_has ? Math.max(0, b[`td_${side}`] - b[`tm_${side}`]) : 0
  }

  // Peta nama sheet → fail XML
  const wbXml = await zip.file('xl/workbook.xml').async('string')
  const relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('string')
  const relTarget = {}
  relsXml.replace(/<Relationship\b[^>]*>/g, tag => {
    const id = (tag.match(/Id="([^"]+)"/) || [])[1], tgt = (tag.match(/Target="([^"]+)"/) || [])[1]
    if (id && tgt) relTarget[id] = tgt.replace(/^\//, '').replace(/^(?!xl\/)/, 'xl/')
    return tag
  })
  const sheetFile = {}
  wbXml.replace(/<sheet\b[^>]*>/g, tag => {
    const name = (tag.match(/name="([^"]+)"/) || [])[1], rid = (tag.match(/r:id="([^"]+)"/) || [])[1]
    if (name && rid) sheetFile[name] = relTarget[rid]
    return tag
  })
  const fixYearTitle = (xml) => xml.replace(/(<c r="A[12]"[^>]*><is><t[^>]*>)([^<]*)/g, (m, a, t) => a + xmlEsc(t.replace(/&amp;/g, '&').replace(/20\d\d/, String(year))))

  for (let mi = 0; mi < 12; mi++) {
    const path = sheetFile[MONTH_SHEET_NAMES[mi]]
    if (!path || !zip.file(path)) continue
    const daysInMonth = new Date(year, mi + 1, 0).getDate()
    const up = new Map()
    for (let day = 1; day <= 31; day++) {
      const row = 7 + day
      const dateStr = `${year}-${String(mi+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`
      const lpp = day <= daysInMonth ? buckets[`${dateStr}|LPP`] : null
      const sfc = day <= daysInMonth ? buckets[`${dateStr}|SFC`] : null
      const nz = (v) => v ? v : null // sel kosong untuk 0, macam borang asal
      // Lajur buruk O-R: sentiasa nombor (ganti formula diram − menetas)
      up.set(`O${row}`, lpp ? buruk(lpp, 'b') : 0); up.set(`P${row}`, lpp ? buruk(lpp, 't') : 0)
      up.set(`Q${row}`, sfc ? buruk(sfc, 'b') : 0); up.set(`R${row}`, sfc ? buruk(sfc, 't') : 0)
      if (lpp) {
        up.set(`C${row}`, nz(lpp.bp_b)); up.set(`D${row}`, nz(lpp.bp_t)); up.set(`G${row}`, nz(lpp.td_b)); up.set(`H${row}`, nz(lpp.td_t))
        if (lpp.tm_has) { up.set(`K${row}`, lpp.tm_b); up.set(`L${row}`, lpp.tm_t) }
      }
      if (sfc) {
        up.set(`E${row}`, nz(sfc.bp_b)); up.set(`F${row}`, nz(sfc.bp_t)); up.set(`I${row}`, nz(sfc.td_b)); up.set(`J${row}`, nz(sfc.td_t))
        if (sfc.tm_has) { up.set(`M${row}`, sfc.tm_b); up.set(`N${row}`, sfc.tm_t) }
      }
      const dk = (lpp?.dk || 0) + (sfc?.dk || 0)
      if (dk) up.set(`S${row}`, dk)
      const notes = [...(lpp?.cat || []), ...(sfc?.cat || [])].join('; ')
      if (notes) up.set(`T${row}`, notes)
    }
    // Rekod Menetas Bulanan (tiada tarikh) → baris JUMLAH (39) sheet bulan ini.
    // Sheet JUMLAH tahunan ambil dari sini melalui formula =SUM(FEB!K39) dsb.
    ;(hatchRows||[]).filter(h => h.month === mi + 1).forEach(h => {
      const cols = h.ram === 'LPP' ? ['K','L','O','P'] : ['M','N','Q','R']
      ;[h.menetas_bertag, h.menetas_takbertag, h.buruk_bertag, h.buruk_takbertag].forEach((v, i) => up.set(`${cols[i]}39`, Number(v) || 0))
    })
    const xml = await zip.file(path).async('string')
    zip.file(path, fixYearTitle(patchSheetXml(xml, up)))
  }

  // Sheet JUMLAH: formula asal dikekalkan (ia jumlahkan baris 39 setiap sheet bulan)
  const sumName = Object.keys(sheetFile).find(n => /^JUMLAH/i.test(n))
  if (sumName) {
    const up = new Map()
    const path = sheetFile[sumName]
    const xml = await zip.file(path).async('string')
    zip.file(path, fixYearTitle(patchSheetXml(xml, up)))
    // Nama sheet ikut tahun
    zip.file('xl/workbook.xml', wbXml.replace(`name="${sumName}"`, `name="JUMLAH ${year}"`))
  }
  // Paksa Excel kira semula semua formula bila dibuka
  let wb2 = await zip.file('xl/workbook.xml').async('string')
  if (!/fullCalcOnLoad/.test(wb2)) wb2 = /<calcPr\b/.test(wb2) ? wb2.replace(/<calcPr\b/, '<calcPr fullCalcOnLoad="1"') : wb2.replace('</workbook>', '<calcPr fullCalcOnLoad="1"/></workbook>')
  zip.file('xl/workbook.xml', wb2)
  if (zip.file('xl/calcChain.xml')) zip.remove('xl/calcChain.xml')

  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = `Penyu-${island}-${year}.xlsx`
  document.body.appendChild(a); a.click(); a.remove()
  setTimeout(() => URL.revokeObjectURL(a.href), 4000)
}

render(location.hash.slice(1) || 'splash')

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {})
  })
}
