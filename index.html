<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Portal LPP</title>
<meta name="description" content="Portal aplikasi staf Lembaga Pengurusan Penyu." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<meta name="theme-color" content="#0A1F2B" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>
  // Pautan reset kata laluan lama (sebelum portal) datang ke alamat ini; hantar ke login.
  if (/[#&](type=recovery|error(_code)?=)/.test(location.hash)) location.replace('login.html' + location.hash)
  try { document.documentElement.classList.add(localStorage.getItem('penyu-theme') || 'dark') } catch { document.documentElement.classList.add('dark') }
</script>
<link rel="stylesheet" href="shared/portal.css" />
<style>
  body { overflow-x: hidden; }
  .stage {
    min-height: 100vh; min-height: 100svh;
    display: grid; grid-template-rows: 1fr auto;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  }
  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px; }

  .crest { position: relative; width: clamp(128px, 34vw, 168px); aspect-ratio: 1; display: grid; place-items: center; }
  .crest::before, .crest::after {
    content: ''; position: absolute; inset: -14px; border-radius: 44px;
    border: 1.5px solid rgba(110, 231, 183, .45); animation: ring 3.2s ease-out infinite;
  }
  .crest::after { animation-delay: 1.6s; }
  .crest img {
    position: relative; width: 100%; height: 100%; object-fit: contain; border-radius: 36px;
    background: #fff; box-shadow: 0 20px 60px rgba(0, 0, 0, .5), 0 0 80px rgba(110, 231, 183, .18);
  }
  @keyframes ring { from { transform: scale(.92); opacity: .8; } to { transform: scale(1.35); opacity: 0; } }

  .eyebrow { font-size: clamp(11px, 2.8vw, 13px); font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--accent); margin-top: 10px; }
  .title { font-size: clamp(56px, 16vw, 104px); line-height: .95; font-weight: 700; letter-spacing: -.035em; text-shadow: 0 6px 40px rgba(0, 0, 0, .45); }
  .lead { font-size: clamp(16px, 4.2vw, 19px); color: var(--muted); max-width: 30ch; margin: 0; }

  .cta {
    margin-top: 10px; width: min(100%, 340px); min-height: 60px; border-radius: 18px;
    font-size: 18px; font-weight: 700; letter-spacing: -.01em;
    box-shadow: 0 14px 40px rgba(110, 231, 183, .28);
  }
  .cta .arrow { transition: transform .2s ease; }
  .cta:hover .arrow { transform: translateX(4px); }

  .foot { text-align: center; font-size: 12px; color: var(--muted); opacity: .8; }

  /* Video latar ada teks terbakar; gelapkan dan kaburkan sedikit supaya tak bersaing dengan tajuk. */
  .bg-video { filter: blur(3px) saturate(1.1); transform: scale(1.04); }
  .bg-tint { background: radial-gradient(ellipse at 50% 40%, rgba(10, 31, 43, .55), rgba(10, 31, 43, .92) 75%); }
  html.light .bg-tint { background: radial-gradient(ellipse at 50% 40%, rgba(237, 227, 207, .6), rgba(237, 227, 207, .94) 75%); }

  .hero > * { animation: rise .7s cubic-bezier(.16, 1, .3, 1) both; }
  .hero > :nth-child(2) { animation-delay: .12s; }
  .hero > :nth-child(3) { animation-delay: .2s; }
  .hero > :nth-child(4) { animation-delay: .28s; }
  .hero > :nth-child(5) { animation-delay: .36s; }
  @media (prefers-reduced-motion: reduce) { .crest::before, .crest::after { animation: none; opacity: 0; } }
</style>
</head>
<body>
<video class="bg-video" src="assets/background.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
<div class="bg-tint"></div>

<div class="stage">
  <main class="hero">
    <div class="crest"><img src="assets/logo.png" alt="Logo Lembaga Pengurusan Penyu" /></div>
    <div class="eyebrow">Lembaga Pengurusan Penyu</div>
    <h1 class="title">Portal LPP</h1>
    <p class="lead">Satu akaun untuk semua aplikasi staf.</p>
    <a class="btn btn-primary cta" id="cta" href="login.html"><span id="ctaText">Log Masuk</span> <span class="arrow">→</span></a>
  </main>
  <footer class="foot">Untuk kegunaan staf sahaja</footer>
</div>

<script type="module">
import { supabase } from './shared/auth.js'

// Sudah log masuk? Butang terus ke portal.
const { data } = await supabase.auth.getSession()
if (data?.session) {
  document.getElementById('cta').href = 'portal.html'
  document.getElementById('ctaText').textContent = 'Masuk Portal'
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
</script>
</body>
</html>
