<style>
  :root { --text-color:#F7F2E7; --text-outline:#061319; }
  html.dark { color-scheme: dark; }
  html.light { color-scheme: light; }
  html.dark select option { background-color:#123244; color:#F7F2E7; }
  html.light select option { background-color:#F7F2E7; color:#0A1F2B; }
  html.light { --text-color:#0A1F2B; --text-outline:#F7F2E7; }
  * { transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease, color .25s ease; }
  body { font-family:'Inter',sans-serif; background:#0A1F2B; min-height:100vh; letter-spacing:-.01em; }
  html.light body { background:#EDE3CF; }
  body, h1,h2,h3,p,span,label,button,input,select,textarea,li,td,th,dt,dd {
    color: var(--text-color);
    text-shadow: -1px -1px 0 var(--text-outline), 1px -1px 0 var(--text-outline),
                 -1px 1px 0 var(--text-outline), 1px 1px 0 var(--text-outline);
  }
  .font-display { font-family:'Fraunces',serif; letter-spacing:-.02em; }
  .tabular-num { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
  .eyebrow { font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; opacity:.6; font-weight:600; }

  .frosted {
    position:relative; border-radius:1.5rem;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 8px 30px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.04) inset;
    backdrop-filter:blur(10px); background:rgba(10,31,43,.94);
    transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, background-color .25s ease, border-color .25s ease;
  }
  html.light .frosted { background:rgba(247,242,231,.96); border:1px solid rgba(10,31,43,.08); }
  .frosted:hover { transform: translateY(-2px); box-shadow:0 14px 40px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.06) inset; }
  .frosted::before {
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg, rgba(110,231,183,.25), transparent 40%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }
  .frosted-flat { position:relative; border-radius:1.25rem; border:1px solid rgba(255,255,255,.08); background:rgba(10,31,43,.85); backdrop-filter:blur(8px); }
  html.light .frosted-flat { background:rgba(247,242,231,.9); border:1px solid rgba(10,31,43,.08); }

  input,select,textarea {
    background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.1);
    border-radius:.75rem; padding:.75rem 1rem; width:100%;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  html.light input, html.light select, html.light textarea { background:rgba(0,0,0,.05); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#2E9099; box-shadow:0 0 0 3px rgba(46,144,153,.25); }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
    -webkit-text-fill-color: var(--text-color) !important;
    -webkit-box-shadow: 0 0 0px 1000px rgba(0,0,0,.3) inset !important;
    caret-color: var(--text-color); transition: background-color 9999s ease-in-out 0s;
  }
  html.light input:-webkit-autofill, html.light input:-webkit-autofill:hover,
  html.light input:-webkit-autofill:focus, html.light input:-webkit-autofill:active {
    -webkit-box-shadow: 0 0 0px 1000px rgba(0,0,0,.06) inset !important;
  }

  .btn { border-radius:.75rem 1.1rem .75rem 1.1rem; padding:.8rem 1.3rem; font-weight:600; transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, filter .2s ease; position:relative; }
  .btn:active { transform:scale(.94); }
  .btn:hover { filter:brightness(1.08); }
  .btn-primary { background:linear-gradient(135deg, #1F6F78, #164e54); border:1px solid #2E9099; box-shadow:0 4px 20px -4px rgba(46,144,153,.5); }
  .btn-primary:hover { box-shadow:0 6px 26px -4px rgba(46,144,153,.7); }
  .btn-ghost { background:transparent; border:1px solid rgba(255,255,255,.15); }
  .btn-ghost:hover { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.3); }
  .btn-sm { padding:.5rem .9rem; font-size:.8rem; }
  .btn:disabled { opacity:.4; pointer-events:none; }
  .btn-back { display:inline-flex; align-items:center; gap:.4rem; font-size:.875rem; opacity:.75; padding:.4rem .2rem; margin-bottom:.75rem; }
  .btn-back:hover { opacity:1; transform:translateX(-2px); }

  .screen { animation:screenIn .4s cubic-bezier(.16,1,.3,1) both; }
  @keyframes screenIn { from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  #app { animation:appIn .35s cubic-bezier(.16,1,.3,1); }
  @keyframes appIn { from{opacity:0;} to{opacity:1;} }

  @keyframes splashPop { 0%{opacity:0; transform:scale(.55) rotate(-10deg);} 60%{opacity:1; transform:scale(1.08) rotate(2deg);} 100%{opacity:1; transform:scale(1) rotate(0);} }
  @keyframes splashFade { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes splashRing { 0%{transform:scale(.9); opacity:.5;} 100%{transform:scale(1.6); opacity:0;} }
  .splash-ring { position:absolute; inset:0; border-radius:2rem; border:2px solid #6EE7B7; animation:splashRing 1.8s ease-out infinite; }
  .splash-logo-wrap { position:relative; width:112px; height:112px; display:flex; align-items:center; justify-content:center; }

  #bgvideo { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2; filter:brightness(1.2); }
  #bgtint { position:fixed; inset:0; z-index:-1; background:rgba(6,19,25,.2); }
  html.light #bgtint { background:rgba(247,242,231,.2); }

  .ambient-orb { position:fixed; border-radius:50%; filter:blur(90px); z-index:-1; opacity:.28; pointer-events:none; }
  #orb1 { width:420px; height:420px; top:-100px; left:-100px; background:#1F6F78; }
  #orb2 { width:380px; height:380px; bottom:-120px; right:-80px; background:#7C9473; }

  nav .frosted { border-radius:1.75rem; }
  nav button, nav a { transition: transform .15s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; border-radius:.75rem; }
  nav button:active { transform:scale(.88); }

  .seg { display:flex; gap:.4rem; padding:.3rem; border-radius:1rem; background:rgba(0,0,0,.18); }
  html.light .seg { background:rgba(0,0,0,.05); }
  .seg button { flex:1; padding:.6rem .5rem; border-radius:.7rem; font-size:.85rem; font-weight:600; transition: all .2s ease; }
  .seg button.active { background:linear-gradient(135deg,#1F6F78,#164e54); box-shadow:0 2px 10px -2px rgba(46,144,153,.5); }

  .xp-bar { height:14px; border-radius:999px; background:rgba(0,0,0,.25); overflow:hidden; position:relative; }
  .xp-fill { height:100%; background:linear-gradient(90deg,#1F6F78,#6EE7B7); border-radius:999px; transition:width 1s cubic-bezier(.16,1,.3,1); box-shadow:0 0 16px rgba(110,231,183,.6); }
  .milestone { position:absolute; top:-4px; width:2px; height:22px; background:rgba(255,255,255,.35); }

  .month-hp { position:relative; border-radius:.9rem; overflow:hidden; height:70px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.08); }
  .month-hp-fill { position:absolute; inset:0 auto 0 0; width:0%; background:linear-gradient(90deg,#164e54,#6EE7B7); transition:width 1.1s cubic-bezier(.16,1,.3,1); }
  .month-hp-fill.over { background:linear-gradient(90deg,#7C4B1F,#E0A458); }
  .month-hp-content { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0 .25rem; }
  .month-hp-label { font-size:.6rem; text-transform:uppercase; letter-spacing:.06em; opacity:.85; }
  .month-hp-value { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:.68rem; line-height:1.15; text-align:center; }
  .month-hp-pct { font-size:.58rem; opacity:.75; }
  .month-hp.achieved { border:2px solid #FFD700; animation: achievedPulse 2.2s ease-in-out infinite; }
  @keyframes achievedPulse { 0%,100%{ box-shadow:0 0 8px rgba(255,215,0,.3);} 50%{ box-shadow:0 0 22px rgba(255,215,0,.75);} }
  .month-hp.cursor-pointer { transition: transform .15s cubic-bezier(.34,1.56,.64,1); }
  .month-hp.cursor-pointer:hover { transform: translateY(-2px); }
  .month-hp.cursor-pointer:active { transform: scale(.95); }

  .list-row { display:flex; align-items:center; gap:.75rem; padding:.85rem; border-radius:1rem; }
  .list-row:hover { background:rgba(255,255,255,.03); }
  .avatar-badge { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; flex-shrink:0; background:linear-gradient(135deg,#1F6F78,#164e54); }

  .type-pill { font-size:.65rem; font-weight:700; padding:.15rem .5rem; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; }
  .type-harian { background:rgba(124,148,115,.25); color:#9AB18F; }
  .type-individu { background:rgba(46,144,153,.25); color:#6EE7B7; }

  /* ---------- Toast notifications (replaces browser alert) ---------- */
  #toastHost { position:fixed; top:1rem; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:.5rem; width:min(92vw, 380px); pointer-events:none; }
  .toast {
    display:flex; align-items:center; gap:.6rem; padding:.8rem 1rem;
    border-radius:1rem; font-size:.85rem; font-weight:600;
    backdrop-filter:blur(10px); pointer-events:auto;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    animation: toastIn .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  .toast.leaving { animation: toastOut .3s ease both; }
  @keyframes toastIn { from{opacity:0; transform:translateY(-16px) scale(.92);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes toastOut { from{opacity:1; transform:translateY(0) scale(1);} to{opacity:0; transform:translateY(-10px) scale(.95);} }
  .toast-success { background:rgba(16,74,58,.92); border:1px solid rgba(110,231,183,.45); }
  .toast-error { background:rgba(80,24,18,.92); border:1px solid rgba(225,96,76,.5); }
  .toast-info { background:rgba(10,31,43,.94); border:1px solid rgba(46,144,153,.45); }
  html.light .toast-success { background:rgba(209,250,229,.96); }
  html.light .toast-error { background:rgba(254,226,221,.96); }
  html.light .toast-info { background:rgba(247,242,231,.96); }

  /* ---------- Chart fullscreen expand (double-click / double-tap) ---------- */
  .chart-expand-btn { width:26px; height:26px; border-radius:.6rem; display:flex; align-items:center; justify-content:center; font-size:.85rem; opacity:.55; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); flex-shrink:0; cursor:pointer; }
  .chart-expand-btn:hover { opacity:1; }
  .chart-expand-overlay {
    position:fixed; inset:0; z-index:200; padding:1rem;
    display:flex; align-items:center; justify-content:center;
    background:rgba(6,19,25,.75);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .chart-expand-overlay.show { opacity:1; pointer-events:auto; }
  html.light .chart-expand-overlay { background:rgba(237,227,207,.8); }
  .chart-expand-panel { width:100%; max-width:900px; padding:1.25rem; }
  .chart-expand-canvas-wrap { position:relative; height:70vh; }

  /* ---------- Skeleton shimmer loading ---------- */
  .skel { position:relative; overflow:hidden; border-radius:.75rem; background:rgba(255,255,255,.06); }
  html.light .skel { background:rgba(0,0,0,.07); }
  .skel::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.09), transparent);
    animation: shimmer 1.4s ease-in-out infinite;
  }
  html.light .skel::after { background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }
  @keyframes shimmer { from{transform:translateX(-100%);} to{transform:translateX(100%);} }

  /* ---------- Staggered card entrances ---------- */
  .stagger > .screen, .stagger > .frosted, .stagger > .frosted-flat { animation:screenIn .5s cubic-bezier(.16,1,.3,1) both; }
  .stagger > *:nth-child(1) { animation-delay:.03s; }
  .stagger > *:nth-child(2) { animation-delay:.09s; }
  .stagger > *:nth-child(3) { animation-delay:.15s; }
  .stagger > *:nth-child(4) { animation-delay:.21s; }
  .stagger > *:nth-child(5) { animation-delay:.27s; }
  .stagger > *:nth-child(6) { animation-delay:.33s; }
  .stagger > *:nth-child(7) { animation-delay:.39s; }
  .stagger > *:nth-child(8) { animation-delay:.45s; }
</style>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://oatbghgoxedccxdjwalt.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_gQIBBbRniU3ixnV8eCDuYw_LeWpu0jK'

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const app = document.getElementById('app')
const ISLANDS = [
  { code:'PTB', name:'Pulau Talang Besar' },
  { code:'PTK', name:'Pulau Talang Kechil' },
  { code:'PSB', name:'Pulau Satang Besar' }
]
const SPECIES = ['Penyu Agar (Green Turtle)','Penyu Karah (Hawksbill)','Lain-lain']
const MONTH_LABELS = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis']
const MONTH_SHEET_NAMES = ['JAN','FEB','MAC','APRIL','MEI','JUN','JULAI','OGOS','SEPT','OKTO','NOV','DIS']

let state = { island: sessionStorage.getItem('penyu-island') || null, profile: null, editTarget: null, entriesTab: 'saya' }

// ---------- Theme ----------
function toggleTheme() {
  const html = document.documentElement
  const isDark = html.classList.contains('dark')
  html.classList.toggle('dark', !isDark)
  html.classList.toggle('light', isDark)
  document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙'
  localStorage.setItem('penyu-theme', isDark ? 'light' : 'dark')
}
window.toggleTheme = toggleTheme

async function logout() {
  await supabase.auth.signOut()
  state.profile = null
  state.island = null
  sessionStorage.removeItem('penyu-island')
  go('splash')
}
window.logout = logout
const savedTheme = localStorage.getItem('penyu-theme') || 'dark'
document.documentElement.classList.remove('dark','light')
document.documentElement.classList.add(savedTheme)
document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? '🌙' : '☀️'

// ---------- Background video (repo file) ----------
const bgVideoEl = document.getElementById('bgvideo')
bgVideoEl.src = 'assets/background.mp4'
bgVideoEl.onerror = () => { bgVideoEl.style.display = 'none' }

// ---------- Offline queue ----------
function queueWrite(write) {
  const q = JSON.parse(localStorage.getItem('penyu-queue') || '[]')
  q.push(write)
  localStorage.setItem('penyu-queue', JSON.stringify(q))
}
async function flushQueue() {
  if (!navigator.onLine) return
  let q = JSON.parse(localStorage.getItem('penyu-queue') || '[]')
  const failed = JSON.parse(localStorage.getItem('penyu-queue-failed') || '[]')
  let newFails = 0
  while (q.length) {
    const w = q[0]
    try {
      let res
      if (w.op === 'insert') res = await supabase.from(w.table).insert(w.payload)
      else if (w.op === 'upsert') res = await supabase.from(w.table).upsert(w.payload, { onConflict: w.onConflict })
      else res = await supabase.from(w.table).update(w.payload).eq('id', w.id)
      // Ditolak server (cth pendua) → simpan untuk disemak, jangan hilang senyap
      if (res?.error) { failed.push({ ...w, error: res.error.message, code: res.error.code, at: new Date().toISOString() }); newFails++ }
      q.shift()
    } catch (e) { break }
  }
  localStorage.setItem('penyu-queue', JSON.stringify(q))
  localStorage.setItem('penyu-queue-failed', JSON.stringify(failed))
  if (newFails) toast(`${newFails} entri offline tidak dapat disimpan (mungkin pendua) — semak di tab Log.`, 'error')
}
window.addEventListener('online', flushQueue)
flushQueue()

// ---------- Draft persistence (anti-frustration: survive accidental back/refresh) ----------
function saveDraft(key, data) { localStorage.setItem('draft-' + key, JSON.stringify(data)) }
function loadDraft(key) { try { return JSON.parse(localStorage.getItem('draft-' + key)) } catch { return null } }
function clearDraft(key) { localStorage.removeItem('draft-' + key) }

// ---------- Toast notifications ----------
function toast(message, type = 'info') {
  const host = document.getElementById('toastHost')
  const icons = { success:'✅', error:'⚠️', info:'💬' }
  const el = document.createElement('div')
  el.className = `toast toast-${type}`
  el.innerHTML = `<span>${icons[type] || icons.info}</span><span>${message}</span>`
  host.appendChild(el)
  const dismiss = () => {
    el.classList.add('leaving')
    setTimeout(() => el.remove(), 320)
  }
  el.onclick = dismiss
  setTimeout(dismiss, type === 'error' ? 4500 : 2800)
}

// ---------- Counting number animation ----------
function animateCount(el, target, { duration = 1100, suffix = '' } = {}) {
  const start = performance.now()
  function frame(now) {
    const t = Math.min(1, (now - start) / duration)
    const eased = 1 - Math.pow(1 - t, 3) // ease-out cubic
    el.textContent = Math.round(target * eased).toLocaleString() + suffix
    if (t < 1) requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
}

// ---------- Skeleton loading blocks ----------
function skeletonBlock(lines = 3) {
  const heights = ['h-8 w-2/5', 'h-24 w-full', 'h-24 w-full', 'h-16 w-full', 'h-16 w-3/4']
  return `<div class="space-y-3">${Array.from({length:lines},(_,i)=>`<div class="skel ${heights[i % heights.length]}"></div>`).join('')}</div>`
}

// ---------- Progress bar color by percentage ----------
// <25% merah, 25-50% oren-merah, 50-75% oren-amber, 75%+ kuning gold
function progressColor(pct) {
  if (pct >= 75) return 'linear-gradient(90deg,#B8860B,#FFD700)'
  if (pct >= 50) return 'linear-gradient(90deg,#C2410C,#F59E0B)'
  if (pct >= 25) return 'linear-gradient(90deg,#B91C1C,#EA580C)'
  return 'linear-gradient(90deg,#7F1D1D,#DC2626)'
}
function progressGlow(pct) {
  if (pct >= 75) return '0 0 16px rgba(255,215,0,.55)'
  if (pct >= 50) return '0 0 16px rgba(245,158,11,.5)'
  if (pct >= 25) return '0 0 16px rgba(234,88,12,.45)'
  return '0 0 16px rgba(220,38,38,.45)'
}

// ---------- Date formatter dd-mm-yyyy ----------
function fmtDate(iso) {
  if (!iso) return '-'
  const [y, m, d] = iso.split('-')
  return `${d}/${m}/${y}`
}

function fmtDateTime(ts) {
  if (!ts) return '-'
  const d = new Date(ts)
  const p = (n) => String(n).padStart(2, '0')
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`
}

// ---------- Data integrity helpers (anti-pendua, import, undo) ----------
// [lajur daily_entries, label, pilihan (null = tidak direkod)]
const DAY_FIELDS = [
  ['bilangan_penyu_bertag', 'Penyu Bertag', false],
  ['bilangan_penyu_takbertag', 'Penyu Tak Bertag', false],
  ['jumlah_telur_diram_bertag', 'Telur Diram Bertag', false],
  ['jumlah_telur_diram_takbertag', 'Telur Diram Tak Bertag', false],
  ['telur_menetas_bertag', 'Menetas Bertag', true],
  ['telur_menetas_takbertag', 'Menetas Tak Bertag', true],
  ['telur_buruk_bertag', 'Buruk Bertag', true],
  ['telur_buruk_takbertag', 'Buruk Tak Bertag', true],
  ['jumlah_telur_dikeluarkan', 'Telur Dikeluarkan', true]
]
const DAY_FIELD_LABEL = Object.fromEntries(DAY_FIELDS.map(([f, l]) => [f, l]))

// Jumlahkan semua sumber (Harian + Individu) untuk satu tarikh + RAM ke bentuk lajur daily_entries
function aggregateDayRam(daily, nests) {
  const out = {}
  DAY_FIELDS.forEach(([f, , optional]) => out[f] = optional ? null : 0)
  const add = (f, v) => { if (v === null || v === undefined) return; out[f] = (out[f] ?? 0) + Number(v) }
  daily.forEach(d => DAY_FIELDS.forEach(([f]) => add(f, d[f])))
  nests.forEach(n => {
    const s = n.bertag ? 'bertag' : 'takbertag'
    add(`bilangan_penyu_${s}`, 1)
    add(`jumlah_telur_diram_${s}`, n.jumlah_telur_diram)
    add(`telur_menetas_${s}`, n.telur_menetas)
    add(`telur_buruk_${s}`, n.telur_buruk)
    add('jumlah_telur_dikeluarkan', n.jumlah_dikeluarkan)
  })
  return out
}

// Semua rekod satu pulau + tahun, dikumpul ikut "tarikh|RAM"
async function loadDayRamIndex(island, yr) {
  const [dRes, nRes] = await Promise.all([
    supabase.from('daily_entries').select('*, staff_profiles!created_by(full_name)').eq('island', island).gte('tarikh', `${yr}-01-01`).lte('tarikh', `${yr}-12-31`).order('created_at').limit(10000),
    supabase.from('nest_records').select('*, staff_profiles!created_by(full_name)').eq('island', island).gte('tarikh_dijumpai', `${yr}-01-01`).lte('tarikh_dijumpai', `${yr}-12-31`).order('created_at').limit(10000)
  ])
  if (dRes.error) throw dRes.error
  if (nRes.error) throw nRes.error
  const idx = {}
  const g = (k) => idx[k] ||= { daily: [], nests: [] }
  ;(dRes.data||[]).forEach(d => g(`${d.tarikh}|${d.ram}`).daily.push(d))
  ;(nRes.data||[]).forEach(n => g(`${n.tarikh_dijumpai}|${n.ram}`).nests.push(n))
  return idx
}

function newBatchId() {
  return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&0x3|0x8)).toString(16) })
}

// Simpan salinan rekod SEBELUM diubah/dipadam, supaya boleh dipulihkan (undo_import)
async function saveUndo(batch, items) {
  if (!items.length) return
  const clean = (row) => { const { staff_profiles, ...rest } = row; return rest }
  const rows = items.map(it => ({ batch, table_name: it.table, row_id: it.row.id, action: it.action, before: clean(it.row) }))
  for (let i = 0; i < rows.length; i += 200) {
    const { error } = await supabase.from('import_undo').insert(rows.slice(i, i+200))
    if (error) throw new Error('Gagal simpan salinan keselamatan — run migration-anti-pendua.sql dulu. (' + error.message + ')')
  }
}

// Padam rekod dengan salinan keselamatan (muncul di Sejarah Import, boleh dipulihkan)
async function deleteWithBackup(items, island, yr, note) {
  const batch = newBatchId()
  const { error: logErr } = await supabase.from('import_log').insert({ batch, island, year: yr, file_name: note, deleted: items.length, created_by: state.profile.id })
  if (logErr) throw new Error('Jadual import_log tiada — run migration-anti-pendua.sql dulu. (' + logErr.message + ')')
  await saveUndo(batch, items.map(it => ({ ...it, action: 'delete' })))
  for (const table of ['daily_entries', 'nest_records']) {
    const ids = items.filter(it => it.table === table).map(it => it.row.id)
    if (ids.length) { const { error } = await supabase.from(table).delete().in('id', ids); if (error) throw error }
  }
}

// ---------- Router ----------
function go(route) {
  if (location.hash.slice(1) === route) render(route)
  else location.hash = route
}
window.go = go
window.addEventListener('hashchange', () => render(location.hash.slice(1) || 'island'))

// ---------- Back (Esc on PC) ----------
// Screens inside the app, in the order visited. Going to the screen just
// before the current one counts as "back" (pop), so Esc and the browser /
// Android back button stay in sync.
const IN_APP_ROUTES = ['entry','entries','editentry','monthdetail','dashboard','admin']
const routeTrail = []
function trackRoute(route) {
  if (!IN_APP_ROUTES.includes(route)) { routeTrail.length = 0; return }
  if (routeTrail[routeTrail.length - 1] === route) return
  if (routeTrail[routeTrail.length - 2] === route) routeTrail.pop()
  else routeTrail.push(route)
  if (routeTrail.length > 30) routeTrail.shift()
}
function goBack() {
  // 1) a back button on the current screen (e.g. "← Betulkan", "← Balik ke Dashboard")
  const btn = app.querySelector('[data-esc]') || app.querySelector('.btn-back')
  if (btn && btn.offsetParent !== null) { btn.click(); return true }
  // 2) previous in-app screen
  if (routeTrail.length >= 2) { go(routeTrail[routeTrail.length - 2]); return true }
  return false
}
window.goBack = goBack
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || e.defaultPrevented) return
  if (document.querySelector('.chart-expand-overlay')) return // chart fullscreen closes itself
  const a = document.activeElement
  if (a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName)) { a.blur(); return } // 1st Esc: leave the field
  if (goBack()) e.preventDefault()
})

async function render(route) {
  trackRoute(route)
  document.getElementById('navbar').classList.toggle('hidden', !['entry','entries','dashboard','admin'].includes(route))
  if (['entry','entries','monthdetail','dashboard','admin'].includes(route) && !state.profile) {
    const { data } = await supabase.auth.getUser()
    if (!data.user) { route = 'island'; location.hash = 'island' }
    else {
      await loadProfile(data.user.id)
      const ok = await enforceIslandGate()
      if (!ok) return
    }
  }
  if (state.profile) {
    const showAdminTab = state.profile.role === 'admin' || state.profile.role === 'kerani'
    document.getElementById('navAdmin').classList.toggle('hidden', !showAdminTab)
    document.getElementById('navAdmin').classList.toggle('flex', showAdminTab)
    const badge = document.getElementById('islandBadge')
    if (badge) badge.textContent = state.island
  }
  const screens = { splash: screenSplash, island: screenIsland, login: screenLogin, entry: screenEntry,
    entries: screenEntries, editentry: screenEditEntry, monthdetail: screenMonthDetail, dashboard: screenDashboard, admin: screenAdmin }
  app.innerHTML = ''
  const el = await (screens[route] || screenIsland)()
  app.appendChild(el)
}

async function loadProfile(userId) {
  const { data } = await supabase.from('staff_profiles').select('*').eq('id', userId).single()
  state.profile = data
  return data
}

async function enforceIslandGate() {
  if (!state.profile) return false
  if (state.profile.role === 'admin' || state.profile.role === 'kerani') return true
  if (!state.island || state.profile.island !== state.island) {
    await supabase.auth.signOut()
    state.profile = null
    sessionStorage.removeItem('penyu-island')
    state.island = null
    toast(`Akaun ini ditugaskan ke ${state.profile?.island || 'pulau lain'}. Log masuk dari pulau anda sendiri.`, 'error')
    location.hash = 'island'
    return false
  }
  return true
}

function card(innerHTML, extraClass = '') {
  const d = document.createElement('div')
  d.className = `frosted p-5 screen ${extraClass}`
  d.innerHTML = innerHTML

}
function flatCard(innerHTML, extraClass = '') {
  const d = document.createElement('div')
  d.className = `frosted-flat p-4 screen ${extraClass}`
  d.innerHTML = innerHTML
  return d
}

    const email = c.querySelector('#email').value

// ENTRY — two modes: Harian (daily aggregate) and Individu (per-turtle)
// =========================================================================
function screenEntry() {
  if (state.profile?.role === 'kerani') {
    return card('Akaun Kerani adalah lihat-sahaja. Anda boleh semak data di tab Entri dan Dashboard, atau eksport Excel di tab Admin.')
  }
  const wrap = document.createElement('div')
  let mode = localStorage.getItem('penyu-lastmode') || 'harian'
  wrap.innerHTML = `
    <div class="flex items-center gap-2 mb-4">
      <h1 class="font-display text-2xl">Entri</h1>
      <span class="rounded px-2.5 py-1 text-xs font-semibold bg-teal-900/40">${state.island}</span>
    </div>
    <div class="seg mb-6">
      <button id="modeHarian" class="${mode==='harian'?'active':''}">Harian</button>
      <button id="modeIndividu" class="${mode==='individu'?'active':''}">Individu</button>
      <button id="modeMenetas" class="${mode==='menetas'?'active':''}">Menetas Bulanan</button>
    </div>
    <div id="failedBox"></div>
    <div id="entryBody"></div>
  `
  const body = wrap.querySelector('#entryBody')
  function renderFailed() {
    const box = wrap.querySelector('#failedBox')
    const failed = JSON.parse(localStorage.getItem('penyu-queue-failed') || '[]')
    if (!failed.length) { box.innerHTML = ''; return }
    box.innerHTML = ''
    const fc = flatCard(`
      <div class="font-semibold text-sm mb-1">⚠️ ${failed.length} entri offline tidak tersimpan</div>
      <p class="text-xs opacity-70 mb-2">Biasanya kerana tarikh + RAM itu sudah ada Entri Harian. Masukkan semula ke borang untuk pilih Ganti / Campur, atau buang.</p>
      ${failed.map((f, i) => `
        <div class="flex items-center justify-between gap-2 border-t border-white/10 py-2 text-xs">
          <div class="tabular-num">${f.payload?.tarikh ? fmtDate(f.payload.tarikh) : ''} · ${f.payload?.ram || ''} · ${f.table === 'daily_entries' ? `${(f.payload.jumlah_telur_diram_bertag||0) + (f.payload.jumlah_telur_diram_takbertag||0)} telur` : f.table}<div class="opacity-60">${f.code === '23505' ? 'Sudah ada Entri Harian untuk tarikh + RAM ini' : f.error}</div></div>
          <div class="flex gap-1 flex-shrink-0">
            ${f.table === 'daily_entries' && f.op === 'insert' ? `<button class="btn btn-ghost btn-sm" data-retry="${i}">Ke borang</button>` : ''}
            <button class="btn btn-sm" data-drop="${i}" style="background:rgba(225,96,76,.15); border:1px solid rgba(225,96,76,.4); color:#E1604C;">Buang</button>
          </div>
        </div>`).join('')}
    `, 'mb-4 border border-red-500/40')
    box.appendChild(fc)
    const save = (arr) => localStorage.setItem('penyu-queue-failed', JSON.stringify(arr))
    fc.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => { const arr = failed.filter((_, i) => i !== Number(b.dataset.drop)); save(arr); renderFailed() })
    fc.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => {
      const f = failed[Number(b.dataset.retry)], p = f.payload
      saveDraft('harian', { tarikh: p.tarikh, ram: p.ram, bp_bertag: p.bilangan_penyu_bertag, bp_takbertag: p.bilangan_penyu_takbertag, telur_bertag: p.jumlah_telur_diram_bertag, telur_takbertag: p.jumlah_telur_diram_takbertag, catatan: p.catatan || '' })
      save(failed.filter((_, i) => i !== Number(b.dataset.retry)))
      renderFailed(); setMode('harian')
      toast('Dimasukkan semula ke borang Harian — tekan Semak & Hantar.', 'info')
    })
  }
  renderFailed()
  const builders = { harian: buildHarianForm, individu: buildIndividuForm, menetas: buildMenetasForm }
  if (!builders[mode]) mode = 'harian'
  function setMode(m) {
    mode = m; localStorage.setItem('penyu-lastmode', m)
    wrap.querySelector('#modeHarian').className = mode==='harian' ? 'active' : ''
    wrap.querySelector('#modeIndividu').className = mode==='individu' ? 'active' : ''
    wrap.querySelector('#modeMenetas').className = mode==='menetas' ? 'active' : ''
    body.innerHTML = ''
    body.appendChild(builders[mode]())
  }
  wrap.querySelector('#modeHarian').onclick = () => setMode('harian')
  wrap.querySelector('#modeIndividu').onclick = () => setMode('individu')
  wrap.querySelector('#modeMenetas').onclick = () => setMode('menetas')
  body.appendChild(builders[mode]())
  return wrap
}

// ---- Entri Harian (matches Excel template's per-day-per-RAM row shape) ----
function buildHarianForm() {
  const draft = loadDraft('harian') || {}
  const today = new Date().toISOString().slice(0,10)
  const holder = document.createElement('div')

  function renderForm() {
    holder.innerHTML = ''
    const c = card(`
      <form id="harianForm" class="space-y-4">
        <div><label class="text-sm opacity-80">Tarikh</label><input type="date" required value="${draft.tarikh || today}" id="h_tarikh" /></div>
        <div>
          <label class="text-sm opacity-80">RAM</label>
          <div class="seg mt-1">
            <button type="button" id="h_ram_lpp" class="${(draft.ram||'LPP')==='LPP'?'active':''}">LPP</button>
            <button type="button" id="h_ram_sfc" class="${draft.ram==='SFC'?'active':''}">SFC</button>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs opacity-70">Bilangan Penyu Bertag</label><input type="number" inputmode="numeric" id="h_bp_bertag" value="${draft.bp_bertag ?? ''}" /></div>
          <div><label class="text-xs opacity-70">Bilangan Penyu Tak Bertag</label><input type="number" inputmode="numeric" id="h_bp_takbertag" value="${draft.bp_takbertag ?? ''}" /></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs opacity-70">Jumlah Telur Diram (Bertag)</label><input type="number" inputmode="numeric" id="h_telur_bertag" value="${draft.telur_bertag ?? ''}" class="text-lg" /></div>
          <div><label class="text-xs opacity-70">Jumlah Telur Diram (Tak Bertag)</label><input type="number" inputmode="numeric" id="h_telur_takbertag" value="${draft.telur_takbertag ?? ''}" class="text-lg" /></div>
        </div>
        <div><label class="text-sm opacity-80">Catatan (pilihan)</label><textarea id="h_catatan" rows="2">${draft.catatan || ''}</textarea></div>
        <button type="submit" class="btn btn-primary w-full">Semak &amp; Hantar →</button>
      </form>
    `)
    holder.appendChild(c)

    let ram = draft.ram || 'LPP'
    const setRam = (r) => { ram = r; c.querySelector('#h_ram_lpp').className = r==='LPP'?'active':''; c.querySelector('#h_ram_sfc').className = r==='SFC'?'active':''; persistDraft() }
    c.querySelector('#h_ram_lpp').onclick = () => setRam('LPP')
    c.querySelector('#h_ram_sfc').onclick = () => setRam('SFC')

    function persistDraft() {
      draft.tarikh = c.querySelector('#h_tarikh').value
      draft.ram = ram
      draft.bp_bertag = c.querySelector('#h_bp_bertag').value
      draft.bp_takbertag = c.querySelector('#h_bp_takbertag').value
      draft.telur_bertag = c.querySelector('#h_telur_bertag').value
      draft.telur_takbertag = c.querySelector('#h_telur_takbertag').value
      draft.catatan = c.querySelector('#h_catatan').value
      saveDraft('harian', draft)
    }
    c.querySelectorAll('input, textarea').forEach(el => el.addEventListener('input', persistDraft))

    c.querySelector('#harianForm').onsubmit = (e) => {
      e.preventDefault()
      const payload = {
        island: state.island, tarikh: c.querySelector('#h_tarikh').value, ram,
        bilangan_penyu_bertag: Number(c.querySelector('#h_bp_bertag').value || 0),
        bilangan_penyu_takbertag: Number(c.querySelector('#h_bp_takbertag').value || 0),
        jumlah_telur_diram_bertag: Number(c.querySelector('#h_telur_bertag').value || 0),
        jumlah_telur_diram_takbertag: Number(c.querySelector('#h_telur_takbertag').value || 0),
        catatan: c.querySelector('#h_catatan').value || null,
        created_by: state.profile.id
      }
      renderHarianSummary(payload)
    }
  }

  async function renderHarianSummary(payload) {
    holder.innerHTML = ''
    let countdown = 5

    // Anti-pendua: satu tarikh + RAM hanya SATU Entri Harian. Kalau sudah
    // ada → pilih Ganti atau Campur (kemaskini rekod sedia ada, bukan tambah baris).
    // Kalau sudah ada sarang Individu → amaran dikira dua kali.
    let existing = [], nests = []
    if (navigator.onLine) {
      const [dRes, nRes] = await Promise.all([
        supabase.from('daily_entries').select('*, staff_profiles!created_by(full_name)').eq('island', state.island).eq('tarikh', payload.tarikh).eq('ram', payload.ram).order('created_at'),
        supabase.from('nest_records').select('*, staff_profiles!created_by(full_name)').eq('island', state.island).eq('tarikh_dijumpai', payload.tarikh).eq('ram', payload.ram)
      ])
      existing = dRes.data || []; nests = nRes.data || []
    }
    const NUMS = [['bilangan_penyu_bertag','bilangan_penyu_takbertag','Penyu'], ['jumlah_telur_diram_bertag','jumlah_telur_diram_takbertag','Telur']]
    let mode = existing.length ? null : 'baru'
    const merged = () => {
      const base = existing[0]
      const out = {}
      NUMS.forEach(([b, t]) => [b, t].forEach(f => out[f] = mode === 'campur' ? (base[f]||0) + payload[f] : payload[f]))
      return out
    }
    const existingHTML = existing.length ? `
      <div class="text-sm bg-amber-500/10 border border-amber-500/40 rounded-xl px-3 py-3 mb-4">
        <div class="font-semibold mb-1">⚠️ Sudah ada Entri Harian untuk ${fmtDate(payload.tarikh)} · ${payload.ram}</div>
        ${existing.map(d => `<div class="text-xs border-t border-amber-500/20 pt-1.5 mt-1.5 tabular-num">Penyu ${d.bilangan_penyu_bertag}/${d.bilangan_penyu_takbertag} · Telur ${d.jumlah_telur_diram_bertag}/${d.jumlah_telur_diram_takbertag}<div class="opacity-70">${d.staff_profiles?.full_name || '?'} · ${fmtDateTime(d.created_at)}</div></div>`).join('')}
        <div class="text-xs opacity-80 mt-2 mb-2">Satu tarikh + RAM hanya boleh ada SATU Entri Harian. Pilih:</div>
        <div class="seg"><button type="button" data-mode="ganti">Ganti angka lama</button><button type="button" data-mode="campur">Campur (tambah)</button></div>
        <div id="mergeResult" class="text-xs mt-2 tabular-num"></div>
      </div>` : ''
    const nestHTML = nests.length ? `
      <div class="text-sm bg-red-500/10 border border-red-500/40 rounded-xl px-3 py-3 mb-4">
        <div class="font-semibold mb-1">⚠️ Tarikh + RAM ini sudah ada ${nests.length} sarang Entri Individu</div>
        <div class="text-xs tabular-num">${nests.map(n => `${n.jumlah_telur_diram} telur (${n.bertag ? 'Bertag' : 'Tak Bertag'})`).join(' · ')} = <b>${nests.reduce((s, n) => s + n.jumlah_telur_diram, 0)} telur</b></div>
        <div class="text-xs opacity-70">Oleh: ${[...new Set(nests.map(n => n.staff_profiles?.full_name || '?'))].join(', ')}</div>
        <div class="text-xs opacity-90 mt-2">Kalau ini penyu yang SAMA, data akan dikira DUA KALI. Teruskan hanya jika ini penyu lain yang tidak direkod secara Individu.</div>
      </div>` : ''

    const c = card(`
      <h2 class="font-display text-xl mb-4">Sahkan Data Harian</h2>
      ${existingHTML}${nestHTML}
      <div class="space-y-2 text-sm">
        <div class="flex justify-between border-b border-white/10 pb-2"><span class="opacity-70">Pulau</span><span class="font-semibold">${state.island}</span></div>
        <div class="flex justify-between border-b border-white/10 pb-2"><span class="opacity-70">Tarikh</span><span class="font-semibold">${fmtDate(payload.tarikh)}</span></div>
        <div class="flex justify-between border-b border-white/10 pb-2"><span class="opacity-70">RAM</span><span class="font-semibold">${payload.ram}</span></div>
        <div class="flex justify-between border-b border-white/10 pb-2"><span class="opacity-70">Bilangan Penyu (Bertag/Tak)</span><span class="font-semibold tabular-num">${payload.bilangan_penyu_bertag} / ${payload.bilangan_penyu_takbertag}</span></div>
        <div class="flex justify-between border-b border-white/10 pb-2"><span class="opacity-70">Jumlah Telur (Bertag/Tak)</span><span class="font-semibold tabular-num">${payload.jumlah_telur_diram_bertag} / ${payload.jumlah_telur_diram_takbertag}</span></div>
      </div>
      <div class="flex gap-2 mt-6">
        <button id="backBtn" data-esc class="btn btn-ghost flex-1">← Betulkan</button>
        <button id="submitBtn" class="btn btn-primary flex-1" disabled>Tunggu 5s...</button>
      </div>
    `)
    holder.appendChild(c)
    c.querySelector('#backBtn').onclick = renderForm
    const submitBtn = c.querySelector('#submitBtn')
    let ready = false
    const readyLabel = () => existing.length ? (mode === 'ganti' ? 'Ganti Sekarang' : mode === 'campur' ? 'Campur Sekarang' : 'Pilih Ganti / Campur') : (nests.length ? 'Teruskan (penyu lain)' : 'Hantar Sekarang')
    const refreshBtn = () => { if (!ready) return; submitBtn.disabled = !mode; submitBtn.textContent = readyLabel() }
    c.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
      mode = b.dataset.mode
      c.querySelectorAll('[data-mode]').forEach(x => x.className = x === b ? 'active' : '')
      const m = merged()
      c.querySelector('#mergeResult').innerHTML = `Hasil selepas simpan: Penyu <b>${m.bilangan_penyu_bertag}/${m.bilangan_penyu_takbertag}</b> · Telur <b>${m.jumlah_telur_diram_bertag}/${m.jumlah_telur_diram_takbertag}</b>${existing.length > 1 ? ' <span class="text-red-300">(rekod berganda lain kekal — bersihkan di Admin → Semak Data Bercanggah)</span>' : ''}`
      refreshBtn()
    })
    const iv = setInterval(() => {
      countdown--
      if (countdown <= 0) { clearInterval(iv); ready = true; refreshBtn() }
      else submitBtn.textContent = `Tunggu ${countdown}s...`
    }, 1000)
    submitBtn.onclick = async () => {
      if (!mode) return
      submitBtn.disabled = true; submitBtn.textContent = 'Menghantar...'
      let err = null
      if (!navigator.onLine) { queueWrite({ table:'daily_entries', op:'insert', payload }) }
      else if (existing.length) {
        const patch = { ...merged(), updated_by: state.profile.id }
        if (payload.catatan) patch.catatan = mode === 'campur' && existing[0].catatan ? `${existing[0].catatan}; ${payload.catatan}` : payload.catatan
        const res = await supabase.from('daily_entries').update(patch).eq('id', existing[0].id); err = res.error
      } else {
        const res = await supabase.from('daily_entries').insert(payload); err = res.error
      }
      if (err) {
        submitBtn.disabled = false; submitBtn.textContent = readyLabel()
        toast(err.code === '23505' ? 'Entri Harian untuk tarikh + RAM ini baru sahaja dimasukkan orang lain. Tekan Betulkan → Semak semula.' : 'Gagal menghantar: ' + err.message, 'error')
        return
      }
      clearDraft('harian')
      holder.innerHTML = ''
      const done = !navigator.onLine ? 'Disimpan — akan sync bila online' : existing.length ? (mode === 'ganti' ? 'Rekod sedia ada diganti!' : 'Dicampur ke rekod sedia ada!') : 'Data harian dihantar!'
      holder.appendChild(card(`<div class="text-center py-10"><div class="text-5xl mb-3">✅</div><p class="font-display text-lg">${done}</p></div>`))
      setTimeout(() => { draft.telur_bertag=''; draft.telur_takbertag=''; draft.bp_bertag=''; draft.bp_takbertag=''; draft.catatan=''; renderForm() }, 1800)
    }
  }

  renderForm()
  return holder
}

// ---- Entri Individu (per-turtle, dynamic count, full draft persistence) ----
function buildIndividuForm() {

  function ensureTurtles(n) {
    const arr = draft.turtles || []
    while (arr.length < n) arr.push({ bertag: null, ram: 'LPP', jumlah: '' })

  function renderSetup() {
    holder.innerHTML = ''

      })

          ${harian.map(d => `<div class="text-xs tabular-num">${d.ram} · ${d.jumlah_telur_diram_bertag + d.jumlah_telur_diram_takbertag} telur · ${d.bilangan_penyu_bertag + d.bilangan_penyu_takbertag} ekor · ${d.staff_profiles?.full_name || '?'}</div>`).join('')}
          <div class="text-xs opacity-90 mt-1">Kalau penyu ini sudah termasuk dalam Entri Harian tersebut, data akan dikira DUA KALI.</div>

        <div class="text-sm ${matches.length ? 'bg-amber-500/10 border-amber-500/40' : 'bg-white/5 border-white/15'} border rounded-xl px-3 py-3 mb-3">
          <div class="font-semibold mb-1">${matches.length ? '⚠️' : 'ℹ️'} Sudah ada ${oldNests.length} sarang Individu pada ${fmtDate(draft.tarikh)}</div>
          <div class="text-xs tabular-num">${oldNests.map(n => `${n.ram} ${n.bertag ? 'B' : 'TB'} ${n.jumlah_telur_diram}`).join(' · ')}</div>
          ${matches.length ? `<div class="text-xs mt-1">${matches.length} penyu baharu anda mempunyai RAM, tag &amp; bilangan telur yang SAMA dengan rekod sedia ada — mungkin pendua.</div>` : ''}
        </div>`
    }
    holder.innerHTML = ''
    const c = card(`
      <h2 class="font-display text-xl mb-4">Sahkan ${draft.count} Rekod Penyu</h2>
      ${warnHTML}
      <div class="space-y-1 text-sm max-h-64 overflow-y-auto mb-4">
        ${draft.turtles.map((t,i) => `<div class="flex justify-between border-b border-white/10 py-1.5"><span class="opacity-70">Penyu #${i+1} · ${t.ram} · ${t.bertag?'Bertag':'Tak Bertag'}</span><span class="font-semibold tabular-num">${t.jumlah} telur</span></div>`).join('')}
      </div>
      <div class="flex justify-between text-sm mb-4 pt-2 border-t border-white/20"><span class="opacity-80 font-semibold">Jumlah Keseluruhan</span><span class="font-display text-lg tabular-num">${totalTelur} telur</span></div>
      <div class="flex gap-2">
        <button id="backBtn" data-esc class="btn btn-ghost flex-1">← Betulkan</button>
        <button id="submitBtn" class="btn btn-primary flex-1" disabled>Tunggu 5s...</button>
      </div>
    `)
    holder.appendChild(c)
    c.querySelector('#backBtn').onclick = renderTurtleList
    const submitBtn = c.querySelector('#submitBtn')
    const iv = setInterval(() => {
      countdown--
      if (countdown <= 0) { clearInterval(iv); submitBtn.disabled = false; submitBtn.textContent = warnHTML ? 'Teruskan' : 'Hantar Sekarang' }
      else submitBtn.textContent = `Tunggu ${countdown}s...`
    }, 1000)
    submitBtn.onclick = async () => {
      submitBtn.disabled = true; submitBtn.textContent = 'Menghantar...'
      const rows = draft.turtles.map(t => ({
        island: state.island, tarikh_dijumpai: draft.tarikh, species: SPECIES[0],
        bertag: t.bertag, ram: t.ram, jumlah_telur_diram: Number(t.jumlah),
        status: 'diram', created_by: state.profile.id
      }))
      let err = null
      if (!navigator.onLine) { rows.forEach(payload => queueWrite({ table:'nest_records', op:'insert', payload })) }
      else { const res = await supabase.from('nest_records').insert(rows); err = res.error }
      if (err) { submitBtn.disabled = false; submitBtn.textContent = 'Hantar Sekarang'; toast('Gagal menghantar: ' + err.message, 'error'); return }
      clearDraft('individu')
      holder.innerHTML = ''
      holder.appendChild(card(`<div class="text-center py-10"><div class="text-5xl mb-3">✅</div><p class="font-display text-lg">${draft.count} rekod dihantar!</p></div>`))
      setTimeout(() => { draft.turtles = []; draft.count = 1; ensureTurtles(1); renderSetup() }, 1800)
    }
  }

  renderSetup()
  return holder
}


// =========================================================================
// MENETAS BULANAN — rekod menetas + buruk ikut BULAN TELUR DIRAM, per RAM.
// Sama logik dengan template Excel (buruk = diram - menetas pada baris
// tarikh diram). Kalau rekod bulanan wujud, ia menggantikan jumlah
// menetas/buruk harian untuk bulan + RAM tersebut.
// =========================================================================
const HATCH_COLORS = { menetas: '#2FA4B8', buruk: '#DC6A40', belum: 'rgba(148,163,184,.35)' }

// Jumlah telur diram (bertag / tak bertag) untuk satu pulau + bulan + RAM
async function fetchDiramMonth(island, year, month, ram) {
  const start = `${year}-${String(month).padStart(2,'0')}-01`
  const end = `${year}-${String(month).padStart(2,'0')}-${String(new Date(year, month, 0).getDate()).padStart(2,'0')}`
  const [dRes, nRes] = await Promise.all([
    supabase.from('daily_entries').select('jumlah_telur_diram_bertag, jumlah_telur_diram_takbertag').eq('island', island).eq('ram', ram).gte('tarikh', start).lte('tarikh', end),
    supabase.from('nest_records').select('bertag, jumlah_telur_diram').eq('island', island).eq('ram', ram).gte('tarikh_dijumpai', start).lte('tarikh_dijumpai', end)
  ])
  let b = 0, t = 0
  ;(dRes.data||[]).forEach(d => { b += d.jumlah_telur_diram_bertag||0; t += d.jumlah_telur_diram_takbertag||0 })
  ;(nRes.data||[]).forEach(n => { if (n.bertag) b += n.jumlah_telur_diram||0; else t += n.jumlah_telur_diram||0 })
  return { b, t }
}

// Amaran bila menetas + buruk melebihi telur diram. Pulangkan '' kalau OK.
function overDiramWarning(rows) {
  const over = rows.filter(r => r.diram !== null && (r.menetas + r.buruk) > r.diram)
  if (!over.length) return ''
  return `
    <div class="text-sm bg-red-500/10 border border-red-500/40 rounded-xl px-3 py-3">
      <div class="font-semibold mb-1">⚠️ Melebihi jumlah telur diram</div>
      ${over.map(r => `<div class="text-xs tabular-num">${r.label}: menetas ${r.menetas.toLocaleString()} + buruk ${r.buruk.toLocaleString()} = <b>${(r.menetas+r.buruk).toLocaleString()}</b>, tetapi diram hanya ${r.diram.toLocaleString()} (lebih ${(r.menetas+r.buruk-r.diram).toLocaleString()})</div>`).join('')}
      <div class="text-xs opacity-80 mt-1">Semak semula angka. Kalau memang betul, anda masih boleh teruskan.</div>
    </div>`
}

function buildMenetasForm() {
  const now = new Date()
  const def = new Date(now.getFullYear(), now.getMonth() - 2, 1) // telur menetas ~45-60 hari selepas diram
  const draft = loadDraft('menetas') || {}
  let year = Number(draft.year) || def.getFullYear()
  let month = Number(draft.month) || (def.getMonth() + 1)
  let ram = draft.ram || 'LPP'
  const island = state.island
  const holder = document.createElement('div')
  let diram = { b: 0, t: 0 }
  let existing = null

  const yearOpts = Array.from({length:6}, (_,i) => now.getFullYear() - i)
  if (!yearOpts.includes(year)) yearOpts.push(year)

  async function renderForm() {
    holder.innerHTML = ''
    const c = card(`
      <form id="menetasForm" class="space-y-4">
        <p class="text-xs opacity-70">Rekod ikut <b>bulan telur itu DIRAM</b> (bukan bulan ia menetas) — sama macam template Excel.</p>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-sm opacity-80">Bulan Telur Diram</label><select id="m_month">${MONTH_LABELS.map((ml,i)=>`<option value="${i+1}" ${i+1===month?'selected':''}>${ml}</option>`).join('')}</select></div>

          </div>
        </div>
        <div id="m_diramBox" class="frosted-flat p-3 text-sm">${skeletonBlock(1)}</div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs opacity-70">Telur Menetas (Bertag)</label><input type="number" inputmode="numeric" min="0" id="m_tm_b" class="text-lg" /></div>
          <div><label class="text-xs opacity-70">Telur Menetas (Tak Bertag)</label><input type="number" inputmode="numeric" min="0" id="m_tm_t" class="text-lg" /></div>
          <div><label class="text-xs opacity-70">Telur Buruk (Bertag)</label><input type="number" inputmode="numeric" min="0" id="m_tb_b" class="text-lg" /></div>
          <div><label class="text-xs opacity-70">Telur Buruk (Tak Bertag)</label><input type="number" inputmode="numeric" min="0" id="m_tb_t" class="text-lg" /></div>
        </div>
        <button type="button" id="m_fillBuruk" class="btn btn-ghost btn-sm w-full">Isi baki sebagai telur buruk (diram − menetas)</button>
        <div id="m_live"></div>
        <div><label class="text-sm opacity-80">Catatan (pilihan)</label><textarea id="m_cat" rows="2"></textarea></div>
        <button type="submit" class="btn btn-primary w-full">Semak &amp; Hantar →</button>
      </form>
    `)
    holder.appendChild(c)
    const listHolder = document.createElement('div')
    listHolder.className = 'mt-4'
    holder.appendChild(listHolder)

    const val = (id) => { const v = c.querySelector(id).value; return v === '' ? 0 : Math.max(0, Number(v)) }
    function persist() {
      saveDraft('menetas', { year, month, ram,
        tm_b: c.querySelector('#m_tm_b').value, tm_t: c.querySelector('#m_tm_t').value,
        tb_b: c.querySelector('#m_tb_b').value, tb_t: c.querySelector('#m_tb_t').value,
        cat: c.querySelector('#m_cat').value })
    }
    function updateLive() {
      const tm_b = val('#m_tm_b'), tm_t = val('#m_tm_t'), tb_b = val('#m_tb_b'), tb_t = val('#m_tb_t')
      const totalD = diram.b + diram.t, totalM = tm_b + tm_t, totalB = tb_b + tb_t
      const baki = totalD - totalM - totalB
      const rate = (totalM + totalB) ? Math.round(totalM / (totalM + totalB) * 100) : null
      c.querySelector('#m_live').innerHTML = `
        <div class="grid grid-cols-3 gap-2 text-center text-xs mb-2">
          <div class="frosted-flat p-2"><div class="opacity-70">Menetas</div><div class="font-display text-lg tabular-num">${totalM.toLocaleString()}</div></div>
          <div class="frosted-flat p-2"><div class="opacity-70">Buruk</div><div class="font-display text-lg tabular-num">${totalB.toLocaleString()}</div></div>
          <div class="frosted-flat p-2"><div class="opacity-70">Kadar Menetas</div><div class="font-display text-lg tabular-num">${rate === null ? '—' : rate + '%'}</div></div>
        </div>
        ${baki >= 0 && totalD ? `<div class="text-xs opacity-70 text-center mb-2">Baki belum direkod: <b class="tabular-num">${baki.toLocaleString()}</b> telur</div>` : ''}
        ${overDiramWarning([
          { label: 'Bertag', diram: diram.b, menetas: tm_b, buruk: tb_b },
          { label: 'Tak Bertag', diram: diram.t, menetas: tm_t, buruk: tb_t }
        ])}`
    }
    async function loadContext() {
      c.querySelector('#m_diramBox').innerHTML = skeletonBlock(1)
      const [d, ex] = await Promise.all([
        fetchDiramMonth(island, year, month, ram),
        supabase.from('monthly_hatch').select('*').eq('island', island).eq('year', year).eq('month', month).eq('ram', ram).maybeSingle()

      diram = d
      existing = ex.data || null
      if (ex.error && /monthly_hatch/.test(ex.error.message)) toast('Jadual monthly_hatch belum wujud — run migration-menetas-buruk.sql dalam Supabase dulu.', 'error')
      c.querySelector('#m_diramBox').innerHTML = `
        <div class="flex justify-between"><span class="opacity-70">Telur diram ${MONTH_LABELS[month-1]} ${year} · ${ram}</span><span class="font-display text-lg tabular-num">${(d.b+d.t).toLocaleString()}</span></div>
        <div class="flex justify-between text-xs opacity-70 tabular-num"><span>Bertag ${d.b.toLocaleString()}</span><span>Tak Bertag ${d.t.toLocaleString()}</span></div>
        ${existing ? '<div class="text-xs text-amber-300 mt-1">✏️ Rekod bulan ini sudah wujud — hantar semula akan mengemaskini.</div>' : ''}`
      const dr = loadDraft('menetas') || {}
      const sameKey = dr.year == year && dr.month == month && dr.ram === ram
      const pick = (draftVal, exVal) => (sameKey && draftVal !== undefined && draftVal !== '') ? draftVal : (existing ? exVal : '')
      c.querySelector('#m_tm_b').value = pick(dr.tm_b, existing?.menetas_bertag)
      c.querySelector('#m_tm_t').value = pick(dr.tm_t, existing?.menetas_takbertag)
      c.querySelector('#m_tb_b').value = pick(dr.tb_b, existing?.buruk_bertag)
      c.querySelector('#m_tb_t').value = pick(dr.tb_t, existing?.buruk_takbertag)
      c.querySelector('#m_cat').value = (sameKey && dr.cat) ? dr.cat : (existing?.catatan || '')
      updateLive()
    }
    async function loadYearList() {
      const { data } = await supabase.from('monthly_hatch').select('*').eq('island', island).eq('year', year).order('month').order('ram')
      if (!data || !data.length) { listHolder.innerHTML = ''; listHolder.appendChild(flatCard(`<div class="text-sm opacity-70">Belum ada rekod menetas bulanan untuk ${island} ${year}.</div>`)); return }
      listHolder.innerHTML = ''
      const lc = flatCard(`
        <div class="eyebrow mb-2">Rekod Menetas ${island} ${year}</div>
        <p class="text-xs opacity-50 mb-2">Tekan baris untuk ubah</p>
        <div class="space-y-1">${data.map(r => {
          const m = r.menetas_bertag + r.menetas_takbertag, b = r.buruk_bertag + r.buruk_takbertag
          const rate = (m+b) ? Math.round(m/(m+b)*100) + '%' : '—'
          return `<button type="button" data-m="${r.month}" data-r="${r.ram}" class="w-full flex justify-between text-sm border-b border-white/10 py-1.5 text-left">
            <span><b>${MONTH_LABELS[r.month-1]}</b> <span class="opacity-60">· ${r.ram}</span></span>
            <span class="tabular-num"><span class="opacity-70">Menetas</span> ${m.toLocaleString()} · <span class="opacity-70">Buruk</span> ${b.toLocaleString()} · <b>${rate}</b></span>
          </button>`}).join('')}</div>`)
      listHolder.appendChild(lc)
      lc.querySelectorAll('button[data-m]').forEach(btn => btn.onclick = () => {
        month = Number(btn.dataset.m); ram = btn.dataset.r
        c.querySelector('#m_month').value = month
        c.querySelectorAll('[data-ram]').forEach(x => x.className = x.dataset.ram === ram ? 'active' : '')
        saveDraft('menetas', { year, month, ram }); loadContext(); window.scrollTo({ top: 0, behavior: 'smooth' })
      })
    }

    const resetKey = () => saveDraft('menetas', { year, month, ram })
    c.querySelector('#m_month').onchange = (e) => { month = Number(e.target.value); resetKey(); loadContext() }
    c.querySelector('#m_year').onchange = (e) => { year = Number(e.target.value); resetKey(); loadContext(); loadYearList() }
    c.querySelectorAll('[data-ram]').forEach(btn => btn.onclick = () => {
      ram = btn.dataset.ram
      c.querySelectorAll('[data-ram]').forEach(x => x.className = x === btn ? 'active' : '')
      resetKey(); loadContext()
    })
    c.querySelectorAll('input, textarea').forEach(el => el.addEventListener('input', () => { persist(); updateLive() }))
    c.querySelector('#m_fillBuruk').onclick = () => {
      const tm_b = val('#m_tm_b'), tm_t = val('#m_tm_t')
      if (!tm_b && !tm_t) { toast('Isi telur menetas dahulu.', 'info'); return }
      c.querySelector('#m_tb_b').value = Math.max(0, diram.b - tm_b)
      c.querySelector('#m_tb_t').value = Math.max(0, diram.t - tm_t)
      persist(); updateLive()
    }
    c.querySelector('#menetasForm').onsubmit = (e) => {
      e.preventDefault()
      const payload = {
        island, year, month, ram,
        menetas_bertag: val('#m_tm_b'), menetas_takbertag: val('#m_tm_t'),
        buruk_bertag: val('#m_tb_b'), buruk_takbertag: val('#m_tb_t'),
        catatan: c.querySelector('#m_cat').value || null,
        updated_by: state.profile.id, updated_at: new Date().toISOString()
      }
      if (!existing) payload.created_by = state.profile.id
      if (!payload.menetas_bertag && !payload.menetas_takbertag && !payload.buruk_bertag && !payload.buruk_takbertag) { toast('Isi sekurang-kurangnya satu angka.', 'error'); return }
      renderSummary(payload)
    }
    loadContext()
    loadYearList()
  }

  function renderSummary(p) {
    holder.innerHTML = ''
    const warn = overDiramWarning([
      { label: 'Bertag', diram: diram.b, menetas: p.menetas_bertag, buruk: p.buruk_bertag },
      { label: 'Tak Bertag', diram: diram.t, menetas: p.menetas_takbertag, buruk: p.buruk_takbertag }
    ])
    const m = p.menetas_bertag + p.menetas_takbertag, b = p.buruk_bertag + p.buruk_takbertag
    const row = (k, v) => `<div class="flex justify-between border-b border-white/10 pb-2"><span class="opacity-70">${k}</span><span class="font-semibold tabular-num">${v}</span></div>`
    const c = card(`
      <h2 class="font-display text-xl mb-4">Sahkan Menetas Bulanan</h2>
      ${warn ? `<div class="mb-4">${warn}</div>` : ''}
      <div class="space-y-2 text-sm">
        ${row('Pulau', p.island)}
        ${row('Bulan Telur Diram', `${MONTH_LABELS[p.month-1]} ${p.year}`)}
        ${row('RAM', p.ram)}
        ${row('Telur Diram (Bertag / Tak Bertag)', `${diram.b.toLocaleString()} / ${diram.t.toLocaleString()}`)}
        ${row('Menetas (Bertag / Tak Bertag)', `${p.menetas_bertag.toLocaleString()} / ${p.menetas_takbertag.toLocaleString()}`)}
        ${row('Buruk (Bertag / Tak Bertag)', `${p.buruk_bertag.toLocaleString()} / ${p.buruk_takbertag.toLocaleString()}`)}
        ${row('Kadar Menetas', (m+b) ? Math.round(m/(m+b)*100) + '%' : '—')}
      </div>
      ${existing ? '<p class="text-xs text-amber-300 mt-3">Ini akan menggantikan rekod sedia ada untuk bulan + RAM ini.</p>' : ''}
      <div class="flex gap-2 mt-6">
        <button id="backBtn" data-esc class="btn btn-ghost flex-1">← Betulkan</button>
        <button id="submitBtn" class="btn btn-primary flex-1" disabled>Tunggu 5s...</button>
      </div>
    `)
    holder.appendChild(c)
    c.querySelector('#backBtn').onclick = renderForm
    const submitBtn = c.querySelector('#submitBtn')
    const readyLabel = warn ? 'Teruskan' : 'Hantar Sekarang'
    let countdown = 5
    const iv = setInterval(() => {
      countdown--
      if (countdown <= 0) { clearInterval(iv); submitBtn.disabled = false; submitBtn.textContent = readyLabel }
      else submitBtn.textContent = `Tunggu ${countdown}s...`
    }, 1000)
    submitBtn.onclick = async () => {
      submitBtn.disabled = true; submitBtn.textContent = 'Menghantar...'
      let err = null
      if (!navigator.onLine) queueWrite({ table:'monthly_hatch', op:'upsert', payload: p, onConflict: 'island,year,month,ram' })
      else { const res = await supabase.from('monthly_hatch').upsert(p, { onConflict: 'island,year,month,ram' }); err = res.error }
      if (err) { submitBtn.disabled = false; submitBtn.textContent = readyLabel; toast('Gagal menghantar: ' + err.message, 'error'); return }
      clearDraft('menetas')
      saveDraft('menetas', { year: p.year, month: p.month, ram: p.ram })
      holder.innerHTML = ''
      holder.appendChild(card(`<div class="text-center py-10"><div class="text-5xl mb-3">✅</div><p class="font-display text-lg">${navigator.onLine ? 'Data menetas disimpan!' : 'Disimpan — akan sync bila online'}</p></div>`))
      setTimeout(renderForm, 1500)
    }
  }

  renderForm()
  return holder
}

// =========================================================================
// ENTRIES LIST — "Entri Saya" / "Entri Semua" with click-to-edit
// =========================================================================
async function screenEntries() {
  const wrap = document.createElement('div')
  wrap.innerHTML = `
    <div class="flex items-center gap-2 mb-4">
      <h1 class="font-display text-2xl">Entri</h1>
      <span class="rounded px-2.5 py-1 text-xs font-semibold bg-teal-900/40">${state.island}</span>
    </div>
    <div class="seg mb-3">
      <button id="tabSaya" class="${state.entriesTab==='saya'?'active':''}">Entri Saya</button>
      <button id="tabSemua" class="${state.entriesTab==='semua'?'active':''}">Entri Semua</button>
    </div>
    <div class="flex gap-2 mb-5">
      <input type="month" id="filterMonth" class="flex-1" value="${new Date().toISOString().slice(0,7)}" />
      <button id="filterClear" class="btn btn-ghost btn-sm">Semua Tarikh</button>
      ${state.profile?.role === 'admin' ? '<button id="bulkToggle" class="btn btn-ghost btn-sm">Pilih</button>' : ''}
    </div>
    <div id="bulkBar" class="hidden frosted-flat p-3 mb-4 flex items-center justify-between gap-2">
      <span class="text-sm"><span id="bulkCount" class="font-semibold tabular-num">0</span> dipilih</span>
      <button id="bulkDelete" class="btn btn-sm" style="background:rgba(225,96,76,.15); border:1px solid rgba(225,96,76,.4); color:#E1604C;" disabled>Tunggu 5s...</button>
    </div>
    <div id="entriesList" class="stagger">${skeletonBlock(4)}</div>
  `
  const listEl = wrap.querySelector('#entriesList')
  let monthFilter = null // null = show all, else 'YYYY-MM'
  let bulkMode = false
  const bulkSelected = new Map() // id -> type
  async function loadList() {
    listEl.innerHTML = skeletonBlock(4)
    const scopeOwn = state.entriesTab === 'saya'
    let dq = supabase.from('daily_entries').select('*, staff_profiles!created_by(full_name)').eq('island', state.island).order('tarikh', { ascending:false }).limit(100)
    let nq = supabase.from('nest_records').select('*, staff_profiles!created_by(full_name)').eq('island', state.island).order('tarikh_dijumpai', { ascending:false }).limit(100)
    if (scopeOwn) { dq = dq.eq('created_by', state.profile.id); nq = nq.eq('created_by', state.profile.id) }
    if (monthFilter) {
      const [y,m] = monthFilter.split('-')
      const lastDay = new Date(Number(y), Number(m), 0).getDate()
      dq = dq.gte('tarikh', `${monthFilter}-01`).lte('tarikh', `${monthFilter}-${lastDay}`)
      nq = nq.gte('tarikh_dijumpai', `${monthFilter}-01`).lte('tarikh_dijumpai', `${monthFilter}-${lastDay}`)
    }
    const [dailyRes, nestRes] = await Promise.all([dq, nq])
    if (dailyRes.error || nestRes.error) {
      listEl.innerHTML = ''
      listEl.appendChild(card(`<div class="text-sm text-red-400">Ralat memuatkan entri: ${dailyRes.error?.message || nestRes.error?.message}</div>`))
      return
    }
    const daily = dailyRes.data, nests = nestRes.data
    const combined = [
      ...(daily||[]).map(d => ({ type:'harian', date: d.tarikh, id: d.id, owner: d.created_by, ownerName: d.staff_profiles?.full_name || '?', summary: `${d.ram} · ${d.bilangan_penyu_bertag+d.bilangan_penyu_takbertag} ekor · ${d.jumlah_telur_diram_bertag+d.jumlah_telur_diram_takbertag} telur` })),
      ...(nests||[]).map(n => ({ type:'individu', date: n.tarikh_dijumpai, id: n.id, owner: n.created_by, ownerName: n.staff_profiles?.full_name || '?', summary: `${n.ram} · ${n.bertag?'Bertag':'Tak Bertag'} · ${n.jumlah_telur_diram} telur${n.status==='menetas' ? ' · Menetas' : ''}` }))
    ].sort((a,b) => new Date(b.date) - new Date(a.date))

    // Tanda hari bercanggah: >1 Harian, atau Harian + Individu pada tarikh + RAM sama
    const keyCount = {}
    ;(daily||[]).forEach(d => { const k = `${d.tarikh}|${d.ram}`; (keyCount[k] ||= { h:0, n:0 }).h++ })
    ;(nests||[]).forEach(n => { const k = `${n.tarikh_dijumpai}|${n.ram}`; (keyCount[k] ||= { h:0, n:0 }).n++ })
    const isConflict = (k) => keyCount[k] && (keyCount[k].h > 1 || (keyCount[k].h && keyCount[k].n))
    combined.forEach(e => {
      const src = e.type === 'harian' ? (daily||[]).find(d => d.id === e.id) : (nests||[]).find(n => n.id === e.id)
      e.conflict = src && isConflict(`${e.date}|${src.ram}`)
    })
    listEl.innerHTML = ''
    const nConf = combined.filter(e => e.conflict).length
    if (nConf) listEl.appendChild(flatCard(`<div class="text-xs"><b class="text-red-300">⚠️ ${nConf} entri bercanggah</b> — tarikh + RAM sama dimasukkan lebih dari sekali (data mungkin dikira dua kali).${state.profile?.role === 'admin' ? ' Bersihkan di Admin → Semak Data Bercanggah.' : ' Maklumkan kepada admin.'}</div>`, 'mb-3 border border-red-500/40'))
    if (!combined.length) { listEl.appendChild(card('<div class="text-center py-8 opacity-80">Tiada entri untuk tempoh ini.</div>')); return }
    combined.forEach((e, i) => {
      const canEdit = e.owner === state.profile.id || state.profile.role === 'admin'
      const checkboxHTML = bulkMode ? `<input type="checkbox" class="bulk-check w-5 h-5 flex-shrink-0" data-id="${e.id}" data-type="${e.type}" ${bulkSelected.has(e.id)?'checked':''} />` : ''
      const row = flatCard(`
        <div class="list-row ${canEdit ? 'cursor-pointer' : ''}">
          ${checkboxHTML}
          <div class="avatar-badge">${e.ownerName.charAt(0).toUpperCase()}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-sm">${fmtDate(e.date)}</span>
              <span class="type-pill ${e.type==='harian'?'type-harian':'type-individu'}">${e.type==='harian'?'Harian':'Individu'}</span>
              ${e.conflict ? '<span class="type-pill" style="background:rgba(225,96,76,.18); color:#F19A80;">Bercanggah</span>' : ''}
            </div>
            <div class="text-xs opacity-75 tabular-num">${e.summary}</div>
            <div class="text-[11px] opacity-50">${e.ownerName}</div>
          </div>
          ${canEdit ? '<span class="opacity-50">✏️</span>' : ''}
        </div>
      `, 'mb-2 p-2')
      if (bulkMode) {
        row.onclick = (ev) => {
          const cb = row.querySelector('.bulk-check')
          if (ev.target !== cb) cb.checked = !cb.checked
          if (cb.checked) bulkSelected.set(e.id, e.type)
          else bulkSelected.delete(e.id)
          updateBulkBar()
        }
      } else if (canEdit) {
        row.onclick = () => { state.editTarget = { type: e.type, id: e.id }; go('editentry') }
      }
      listEl.appendChild(row)
    })
  }

  function updateBulkBar() {
    wrap.querySelector('#bulkCount').textContent = bulkSelected.size
  }

  const bulkToggleBtn = wrap.querySelector('#bulkToggle')
  if (bulkToggleBtn) {
    let armTimer = null
    bulkToggleBtn.onclick = () => {
      bulkMode = !bulkMode
      bulkSelected.clear()
      updateBulkBar()
      bulkToggleBtn.textContent = bulkMode ? 'Batal' : 'Pilih'
      const bar = wrap.querySelector('#bulkBar')
      bar.classList.toggle('hidden', !bulkMode)
      bar.classList.toggle('flex', bulkMode)
      const delBtn = wrap.querySelector('#bulkDelete')
      clearInterval(armTimer)
      if (bulkMode) {
        // Arm the bulk delete button with the same 5s safety delay
        let cd = 5
        delBtn.disabled = true
        delBtn.textContent = `Tunggu ${cd}s...`
        armTimer = setInterval(() => {
          cd--
          if (cd <= 0) { clearInterval(armTimer); delBtn.disabled = false; delBtn.textContent = 'Padam Terpilih' }
          else delBtn.textContent = `Tunggu ${cd}s...`
        }, 1000)
      }
      loadList()
    }
    wrap.querySelector('#bulkDelete').onclick = async () => {
      if (!bulkSelected.size) { toast('Tiada entri dipilih.', 'info'); return }
      if (!confirm(`Padam ${bulkSelected.size} entri terpilih? Tindakan ini kekal.`)) return
      const dailyIds = [], nestIds = []
      bulkSelected.forEach((type, id) => (type === 'harian' ? dailyIds : nestIds).push(id))
      let err = null
      if (dailyIds.length) { const r = await supabase.from('daily_entries').delete().in('id', dailyIds); err = err || r.error }
      if (nestIds.length) { const r = await supabase.from('nest_records').delete().in('id', nestIds); err = err || r.error }
      if (err) { toast('Gagal padam: ' + err.message, 'error'); return }
      toast(`${bulkSelected.size} entri dipadam`, 'success')
      bulkSelected.clear()
      updateBulkBar()
      loadList()
    }
  }
  wrap.querySelector('#tabSaya').onclick = () => { state.entriesTab='saya'; wrap.querySelector('#tabSaya').className='active'; wrap.querySelector('#tabSemua').className=''; loadList() }
  wrap.querySelector('#tabSemua').onclick = () => { state.entriesTab='semua'; wrap.querySelector('#tabSemua').className='active'; wrap.querySelector('#tabSaya').className=''; loadList() }
  wrap.querySelector('#filterMonth').onchange = (e) => { monthFilter = e.target.value || null; loadList() }
  wrap.querySelector('#filterClear').onclick = () => { monthFilter = null; wrap.querySelector('#filterMonth').value = ''; loadList() }
  monthFilter = wrap.querySelector('#filterMonth').value || null
  loadList()
  return wrap
}

// ---------- Edit entry (fixes old bug: now always targets a specific id) ----------
// Live warning + "Teruskan" after 5s when menetas + buruk > diram.
function attachHatchGuard(c, getRows, saveBtn, doSave) {
  const box = c.querySelector('#e_warn')
  const label = saveBtn.textContent
  let armed = false, iv = null
  function refresh() {
    const html = overDiramWarning(getRows())
    box.innerHTML = html
    if (!html) { armed = false; clearInterval(iv); saveBtn.disabled = false; saveBtn.textContent = label }
    return html
  }
  c.querySelectorAll('input').forEach(i => i.addEventListener('input', refresh))
  refresh()
  saveBtn.onclick = async () => {
    if (refresh() && !armed) {
      armed = true
      let cd = 5
      saveBtn.disabled = true; saveBtn.textContent = `Semak amaran... ${cd}s`
      clearInterval(iv)
      iv = setInterval(() => {
        cd--
        if (cd <= 0) { clearInterval(iv); saveBtn.disabled = false; saveBtn.textContent = 'Teruskan Simpan' }
        else saveBtn.textContent = `Semak amaran... ${cd}s`
      }, 1000)
      box.scrollIntoView({ behavior: 'smooth', block: 'center' })
      return
    }
    await doSave()
  }
}

function attachDeleteUI(wrap, table, id) {
  const delCard = card(`
    <h2 class="font-display text-lg mb-2 text-red-400">Zon Bahaya</h2>
    <p class="text-sm opacity-70 mb-3">Padam rekod ini secara kekal. Tindakan ini tidak boleh dibatalkan.</p>
    <button id="e_del" class="btn w-full" style="background:rgba(225,96,76,.15); border:1px solid rgba(225,96,76,.4); color:#E1604C;" disabled>Tunggu 5s...</button>
  `, 'mt-4')
  wrap.appendChild(delCard)
  const delBtn = delCard.querySelector('#e_del')
  let countdown = 5
  const iv = setInterval(() => {
    countdown--
    if (countdown <= 0) { clearInterval(iv); delBtn.disabled = false; delBtn.textContent = 'Padam Entri Ini' }
    else delBtn.textContent = `Tunggu ${countdown}s...`
  }, 1000)
  delBtn.onclick = async () => {
    if (!confirm('Padam rekod ini? Tindakan ini kekal.')) return
    delBtn.disabled = true
    const { error } = await supabase.from(table).delete().eq('id', id)
    if (error) { toast('Gagal padam: ' + error.message, 'error'); delBtn.disabled = false; return }
    toast('Rekod dipadam', 'success')
    go('entries')
  }
}

      </div>
    `)
    wrap.appendChild(c)
    const nv = (id) => { const v = c.querySelector(id).value; return v === '' ? null : Number(v) }
    attachHatchGuard(c, () => [
      { label: 'Bertag', diram: nv('#e_td_b') || 0, menetas: nv('#e_tm_b') || 0, buruk: nv('#e_tb_b') || 0 },
      { label: 'Tak Bertag', diram: nv('#e_td_t') || 0, menetas: nv('#e_tm_t') || 0, buruk: nv('#e_tb_t') || 0 }
    ], c.querySelector('#e_save'), async () => {
      const payload = {
        tarikh: c.querySelector('#e_tarikh').value,
        bilangan_penyu_bertag: Number(c.querySelector('#e_bp_b').value||0),
        bilangan_penyu_takbertag: Number(c.querySelector('#e_bp_t').value||0),
        jumlah_telur_diram_bertag: Number(c.querySelector('#e_td_b').value||0),
        jumlah_telur_diram_takbertag: Number(c.querySelector('#e_td_t').value||0),
        telur_menetas_bertag: c.querySelector('#e_tm_b').value === '' ? null : Number(c.querySelector('#e_tm_b').value),
        telur_menetas_takbertag: c.querySelector('#e_tm_t').value === '' ? null : Number(c.querySelector('#e_tm_t').value),
        telur_buruk_bertag: nv('#e_tb_b'),
        telur_buruk_takbertag: nv('#e_tb_t'),
        jumlah_telur_dikeluarkan: c.querySelector('#e_dk').value === '' ? null : Number(c.querySelector('#e_dk').value),
        catatan: c.querySelector('#e_cat').value || null,
        updated_by: state.profile.id
      }
      const { error } = await supabase.from('daily_entries').update(payload).eq('id', target.id)
      if (error) { toast(error.code === '23505' ? 'Sudah ada Entri Harian lain untuk tarikh + RAM itu. Ubah rekod tersebut, atau padam salah satu.' : 'Gagal simpan: ' + error.message, 'error'); return }
      toast('Disimpan', 'success'); go('entries')
    })
    attachDeleteUI(wrap, 'daily_entries', target.id)
  } else {
    const { data: n } = await supabase.from('nest_records').select('*').eq('id', target.id).single()
    if (!n) { wrap.appendChild(card('Rekod tidak dijumpai.')); return wrap }
    const c = card(`
      <h2 class="font-display text-xl mb-4">Edit Rekod Penyu</h2>
      <div class="space-y-3">
        <div><label class="text-xs opacity-70">Tarikh Dijumpai</label><input type="date" id="e_tarikh" value="${n.tarikh_dijumpai}" /></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs opacity-70">Status Tag</label>
            <div class="seg mt-1"><button type="button" id="e_b_yes" class="${n.bertag?'active':''}">Bertag</button><button type="button" id="e_b_no" class="${!n.bertag?'active':''}">Tak Bertag</button></div>
          </div>
          <div><label class="text-xs opacity-70">RAM</label>
            <div class="seg mt-1"><button type="button" id="e_r_lpp" class="${n.ram==='LPP'?'active':''}">LPP</button><button type="button" id="e_r_sfc" class="${n.ram==='SFC'?'active':''}">SFC</button></div>
          </div>
        </div>
        <div><label class="text-xs opacity-70">Jumlah Telur Diram</label><input type="number" id="e_td" value="${n.jumlah_telur_diram}" /></div>
        <div class="eyebrow mt-2">Penetasan (isi bila dah menetas)</div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs opacity-70">Telur Menetas</label><input type="number" id="e_tm" value="${n.telur_menetas ?? ''}" /></div>
          <div><label class="text-xs opacity-70">Telur Buruk</label><input type="number" id="e_tb" value="${n.telur_buruk ?? ''}" /></div>
        </div>
        <div id="e_warn"></div>
        <div><label class="text-xs opacity-70">Catatan</label><textarea id="e_cat" rows="2">${n.catatan||''}</textarea></div>
        <button id="e_save" class="btn btn-primary w-full mt-2">Simpan Perubahan</button>
      </div>
    `)
    wrap.appendChild(c)
    let bertag = n.bertag, ram = n.ram
    c.querySelector('#e_b_yes').onclick = () => { bertag=true; c.querySelector('#e_b_yes').className='active'; c.querySelector('#e_b_no').className='' }
    c.querySelector('#e_b_no').onclick = () => { bertag=false; c.querySelector('#e_b_no').className='active'; c.querySelector('#e_b_yes').className='' }
    c.querySelector('#e_r_lpp').onclick = () => { ram='LPP'; c.querySelector('#e_r_lpp').className='active'; c.querySelector('#e_r_sfc').className='' }
    c.querySelector('#e_r_sfc').onclick = () => { ram='SFC'; c.querySelector('#e_r_sfc').className='active'; c.querySelector('#e_r_lpp').className='' }
    attachHatchGuard(c, () => [{ label: 'Sarang ini', diram: Number(c.querySelector('#e_td').value||0), menetas: Number(c.querySelector('#e_tm').value||0), buruk: Number(c.querySelector('#e_tb').value||0) }],
      c.querySelector('#e_save'), async () => {
      const menetas = c.querySelector('#e_tm').value === '' ? null : Number(c.querySelector('#e_tm').value)
      const payload = {
        tarikh_dijumpai: c.querySelector('#e_tarikh').value, bertag, ram,
        jumlah_telur_diram: Number(c.querySelector('#e_td').value||0),
        telur_menetas: menetas,
        telur_buruk: c.querySelector('#e_tb').value === '' ? null : Number(c.querySelector('#e_tb').value),
        status: menetas !== null ? 'menetas' : 'diram',
        catatan: c.querySelector('#e_cat').value || null,
        updated_by: state.profile.id
      }
      const { error } = await supabase.from('nest_records').update(payload).eq('id', target.id)
      if (error) { toast('Gagal simpan: ' + error.message, 'error'); return }
      toast('Disimpan', 'success'); go('entries')
    })
    attachDeleteUI(wrap, 'nest_records', target.id)
  }
  return wrap
}
