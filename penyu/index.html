          <div class="pres-eyebrow pa" ${delay(0)}>${presEsc(isl.name)}</div>
          <h2 class="pres-title pa" ${delay(1)} style="font-size:clamp(1.8rem,4vw,3rem)">Pilih tahun</h2>
          <div class="text-sm opacity-70 pa" ${delay(2)}>Saiz gelembung = telur dikutip · bingkai emas = tahun tertinggi (${best.y})</div>
        </div>
        <div class="pres-ywrap">
          ${sums.slice().reverse().map((s, i) => {
            const b = s.dikutip ? Math.round(52 + 78 * Math.sqrt(s.dikutip / max)) : 36
            return `<div class="pa" ${delay(i * .22, .25)}><button class="pres-ychip ${s.dikutip ? '' : 'empty'} ${s.y === best.y ? 'best' : ''}" data-y="${s.y}" title="${s.y}: ${s.dikutip ? fmt(s.dikutip) + ' telur dikutip' : 'tiada data'}" style="--b:${b}; --fd:${(5.5 + (i % 5) * .7).toFixed(1)}s; --fdl:-${((i * .9) % 6).toFixed(1)}s">
              <span class="pres-num yr">${s.y}</span>
              ${s.dikutip && b >= 60 ? `<span class="cnt">${fmtShort(s.dikutip)}</span>` : ''}
              ${s.y === thisYear ? '<span class="cur">semasa</span>' : ''}
            </button></div>`
          }).join('')}
        </div>
      </div>`, (scr) => {
      scr.querySelectorAll('.pres-ychip').forEach(b => {
        b.onpointerenter = (e) => { if (e.pointerType === 'mouse') ripple(b, e.clientX, e.clientY) }
        b.onclick = () => { S.year = Number(b.dataset.y); S.sec = 0; S.cmp = null; dir = 1; renderSection() }
      })
    })
  }

  // ---------- 4. Laporan tahun ----------
  function ctx() {
    const months = data.byIsl[S.island][S.year]
    const s = yearSummary(months, S.year)
    const series = data.years.map(y => ({ y, ...yearSummary(data.byIsl[S.island][y], y) })).filter(r => r.dikutip > 0)
    const ranked = series.slice().sort((a, b) => b.dikutip - a.dikutip)
    const rank = ranked.findIndex(r => r.y === S.year) + 1
    const prevYear = series.filter(r => r.y < S.year).pop()
    if (!S.cmp || S.cmp === S.year) S.cmp = prevYear?.y ?? series.find(r => r.y !== S.year)?.y
    return { months, s, series, ranked, rank, prevYear, isl: islandOf(S.island) }
  }
  function goSec(i) {
    if (i < 0 || i >= PRES_SECTIONS.length || i === S.sec && S.level === 'report') return
    dir = i > S.sec ? 1 : -1
    S.sec = i
    renderSection()
  }
  const head = (eyebrow, title) => `
    <div class="mb-5" style="width:min(1200px,100%)">
      <div class="pres-eyebrow pa" ${delay(0)}>${eyebrow}</div>
      <h2 class="pres-title pa" ${delay(1)} style="font-size:clamp(1.7rem,3.6vw,3rem)">${title}</h2>
    </div>`
  // Banding menetas hanya jika penetasan KEDUA-DUA tahun lengkap; jika tidak, % akan mengelirukan
  const hatchCmpTxt = (now, yNow, sNow, then, yThen, sThen) => {
    if (!sThen.menetas) return `<span style="color:#F2C38B">⚠ tiada data penetasan ${yThen}</span>`
    if (sThen.hatchIncomplete) return `<span style="color:#F2C38B">⚠ data penetasan ${yThen} belum lengkap</span>`
    if (sNow.hatchIncomplete) return `<span style="color:#F2C38B">⚠ penetasan ${yNow} belum lengkap</span> <span class="opacity-60">· ${yThen}: ${fmt(then)}</span>`
    return deltaTxt(now, then) + ` <span class="opacity-60">vs ${yThen}</span>`
  }
  const kLbl = (v) => v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(v)
  const deltaTxt = (now, then) => {
    if (!then) return '<span class="opacity-60">—</span>'
    const d = (now - then) / then * 100
    return `<span class="${d >= 0 ? 'pres-up' : 'pres-down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}%</span>`
  }

  function renderSection() {
    S.level = 'report'
    const C = ctx()
    const { s, months } = C
    const isl = { ...C.isl, name: presEsc(C.isl.name) }
    setBg(C.isl.img || ISL[0].img)
    crumb()
    const sec = S.sec
    const incompleteNote = S.year === thisYear ? 'Tahun semasa — data masih dikemas kini' : s.hatchIncomplete ? 'Sebahagian penetasan belum direkod' : ''

    if (sec === 0) {
      const ratePct = s.rate == null ? 0 : s.rate
      show(`
        ${head(`${isl.name} · Laporan Tahunan`, `Tahun ${S.year}`)}
        <div class="pres-sum items-stretch" style="width:min(1200px,100%)">
          <div class="pres-card p-6 pa flex flex-col justify-center items-center text-center gap-3" ${delay(2)}>
            <div class="pres-ring" id="ring"><div><div><div class="pres-num" style="font-size:clamp(1.8rem,3vw,2.6rem)" data-count="${ratePct}" data-dec="1" data-suf="%">0%</div><div class="text-xs opacity-70">kadar menetas</div></div></div></div>
            <div class="text-sm opacity-80">${C.rank ? `<span class="pres-num" style="color:#E0A458">#${C.rank}</span> daripada ${C.series.length} tahun (telur dikutip)` : ''}</div>
            ${incompleteNote ? `<div class="text-xs" style="color:#F2C38B">⚠ ${incompleteNote}</div>` : ''}
          </div>
          <div class="grid grid-cols-2 gap-4">
            ${[
              ['🐢', 'Pendaratan penyu / sarang', s.penyu],
              ['🥚', 'Telur dikutip', s.dikutip],
              ['🏝', 'Telur ditanam', s.telur],
              ['🐣', 'Anak penyu menetas', s.menetas]
            ].map((c, i) => `
              <div class="pres-card p-5 pa" ${delay(i, .35)}>
                <div style="font-size:1.6rem">${c[0]}</div>
                <div class="pres-num mt-1" style="font-size:clamp(1.8rem,3.4vw,3rem)" data-count="${c[2]}" data-wait="${450 + i * 150}">0</div>
                <div class="text-sm opacity-70">${c[1]}</div>
                ${C.prevYear && i < 4 ? `<div class="text-xs mt-1">${i === 3 ? hatchCmpTxt(c[2], S.year, s, C.prevYear.menetas, C.prevYear.y, C.prevYear) : `${deltaTxt(c[2], [C.prevYear.penyu, C.prevYear.dikutip, C.prevYear.telur][i])} <span class="opacity-60">vs ${C.prevYear.y}</span>`}</div>` : ''}
              </div>`).join('')}
          </div>
        </div>`, (scr) => setTimeout(() => { const r = scr.querySelector('#ring'); if (r) r.style.setProperty('--p', ratePct) }, 400))
      return
    }

    if (sec === 1) {
      const landas = months.map((r, i) => r.telur === 0 && r.dikutip === 0 ? MONTH_LABELS[i] : null).filter(Boolean)
      const showDikutip = months.some(r => r.dikutip !== r.telur)
      show(`
        ${head(`${isl.name} · ${S.year}`, 'Perjalanan 12 bulan')}
        <div class="pres-card p-5 pa" ${delay(2)} style="width:min(1200px,100%); height:clamp(300px,52vh,520px)"><canvas id="c1"></canvas></div>
        ${landas.length ? `<div class="text-sm opacity-75 mt-4 pa" ${delay(3)}>🌊 Tiada pendaratan direkod: <b>${landas.join(', ')}</b> — musim landas, kakitangan tidak dapat ke pulau.</div>` : ''}`, (scr) => {
        const ds = [{ label: 'Telur ditanam', data: months.map(r => r.telur), backgroundColor: months.map((r, i) => i === C.s.active.reduce((b, x) => x.telur > (months[b]?.telur || 0) ? x.m : b, 0) ? '#E0A458' : '#2FA4B8'), borderRadius: 8, order: 2 }]
        if (showDikutip) ds.push({ type: 'line', label: 'Telur dikutip', data: months.map(r => r.dikutip), borderColor: 'rgba(255,255,255,.7)', borderDash: [6, 5], pointRadius: 0, borderWidth: 2, order: 1, noLabel: true })
        ds.push({ type: 'line', label: 'Penyu / sarang', data: months.map(r => r.penyu), yAxisID: 'y2', borderColor: '#A7F3D0', backgroundColor: '#A7F3D0', pointRadius: 4, tension: .35, borderWidth: 2, order: 0, hidden: true })
        S.charts.push(new Chart(scr.querySelector('#c1'), {
          type: 'bar', data: { labels: MONTH_LABELS, datasets: ds }, plugins: [presValueLabels(13, fmt)],
          options: chartBase({ layout: { padding: { top: 22 } }, animation: { duration: 900, delay: (c) => c.type === 'data' ? c.dataIndex * 110 + 300 : 0 }, interaction: { mode: 'index', intersect: false },
            scales: { ...chartBase().scales, y2: { position: 'right', display: 'auto', grid: { display: false }, ticks: { color: '#A7F3D0' }, beginAtZero: true } },
            plugins: { ...chartBase().plugins, tooltip: { ...chartBase().plugins.tooltip, callbacks: { label: (c) => ` ${c.dataset.label}: ${fmt(c.raw)}` } } } })
        }))
      })
      return
    }

    if (sec === 2) {
      const act = s.active
      if (!act.length) { show(`${head(`${isl.name} · ${S.year}`, 'Bulan terbaik & terendah')}<div class="pres-card p-8 pa">Tiada pendaratan direkod tahun ini.</div>`); return }
      const best = act.reduce((b, r) => r.telur > b.telur ? r : b, act[0])
      const low = act.reduce((b, r) => r.telur < b.telur ? r : b, act[0])
      const share = (r) => s.telur ? (r.telur / s.telur * 100).toFixed(1) : 0
      const bestRate = act.filter(r => r.menetas + r.buruk > 0).reduce((b, r) => (!b || r.menetas / (r.menetas + r.buruk) > b.menetas / (b.menetas + b.buruk)) ? r : b, null)
      const card2 = (tag, color, r, extra, i) => `
        <div class="pres-card p-7 pa relative overflow-hidden" ${delay(i, .3)} style="border-color:${color}55">
          <div style="position:absolute; right:-20px; top:-30px; font-size:9rem; opacity:.07; font-family:Fraunces">${MONTH_LABELS[r.m]}</div>
          <div class="pres-eyebrow" style="color:${color}">${tag}</div>
          <div class="pres-title mt-2" style="font-size:clamp(2.2rem,4.6vw,4rem)">${MONTH_FULL[r.m]}</div>
          <div class="pres-num mt-2" style="font-size:clamp(1.6rem,3vw,2.6rem); color:${color}" data-count="${r.telur}" data-wait="${700 + i * 200}">0</div>
          <div class="text-sm opacity-75">telur ditanam · ${share(r)}% daripada setahun · ${fmt(r.penyu)} sarang</div>
          ${extra}
        </div>`
      show(`
        ${head(`${isl.name} · ${S.year}`, 'Bulan terbaik & terendah')}
        <div class="grid gap-5" style="width:min(1200px,100%); grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
          ${card2('🏆 Bulan terbaik', '#E0A458', best, `<div class="text-sm mt-3 opacity-90">${best.menetas + best.buruk ? `Kadar menetas bulan ini: <b>${(best.menetas / (best.menetas + best.buruk) * 100).toFixed(1)}%</b>` : ''}</div>`, 0)}
          ${card2('📉 Bulan terendah (yang ada pendaratan)', '#7DD3FC', low, `<div class="text-sm mt-3 opacity-90">${act.length} bulan ada pendaratan tahun ini</div>`, 1)}
        </div>
        ${bestRate ? `<div class="pres-card p-4 mt-5 pa text-sm" ${delay(3, .3)} style="width:min(1200px,100%)">🐣 Kadar menetas tertinggi: <b>${MONTH_FULL[bestRate.m]}</b> — ${(bestRate.menetas / (bestRate.menetas + bestRate.buruk) * 100).toFixed(1)}% (${fmt(bestRate.menetas)} anak penyu)</div>` : ''}`)
      return
    }

    if (sec === 3) {
      const unknown = Math.max(0, s.telur - s.menetas - s.buruk)
      const egg = MODE === 'hidup' && (s.menetas + s.buruk) > 0
      show(`
        ${head(`${isl.name} · ${S.year}`, 'Penetasan')}
        <div class="pres-sum" style="width:min(1200px,100%)">
          <div class="pres-card p-5 pa relative" ${delay(2)} style="height:clamp(300px,50vh,480px)"><canvas id="c3a"></canvas>
            ${egg ? '<canvas class="pres-eggc" id="eggC"></canvas>' : ''}
            <div id="c3lbl" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none" style="padding-bottom:40px; transition:opacity .6s; ${egg ? 'opacity:0' : ''}"><div class="pres-num" style="font-size:clamp(1.8rem,3vw,2.6rem)" data-count="${s.rate ?? 0}" data-dec="1" data-suf="%" data-wait="${egg ? 2100 : 700}">0%</div><div class="text-xs opacity-70">kadar menetas</div></div></div>
          <div class="pres-card p-5 pa" ${delay(3)} style="height:clamp(300px,50vh,480px)"><canvas id="c3b"></canvas></div>
        </div>
        <div class="text-xs opacity-60 mt-3 pa" ${delay(4)}>Kadar menetas = menetas ÷ (menetas + buruk), ikut bulan telur ditanam.${s.hatchIncomplete ? ' ⚠ Sebahagian bulan belum ada data penetasan.' : ''}</div>`, (scr) => {
        const donut = () => {
          if (!scr.isConnected) return
          scr.querySelector('#c3lbl').style.opacity = '1'
          const ch = new Chart(scr.querySelector('#c3a'), {
            type: 'doughnut',
            data: { labels: [`Menetas: ${fmt(s.menetas)}`, `Buruk: ${fmt(s.buruk)}`, ...(unknown ? [`Belum direkod: ${fmt(unknown)}`] : [])], datasets: [{ data: [s.menetas, s.buruk, ...(unknown ? [unknown] : [])], backgroundColor: ['#2FA4B8', '#DC6A40', 'rgba(148,163,184,.3)'], borderColor: '#082028', borderWidth: 3, hoverOffset: 10 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '70%', animation: { animateRotate: true, duration: 1800 }, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5d1', usePointStyle: true, font: { size: 13 } } }, tooltip: { callbacks: { label: (c) => ` ${c.label.split(':')[0]}: ${fmt(c.raw)}` } } } }
          })
          // carta mungkin dibina selepas skrin bertukar; simpan pada skrin supaya dimusnahkan bersama
          if (scr.isConnected && scr === $('#presStage').lastElementChild) S.charts.push(ch); else (scr._charts = scr._charts || []).push(ch)
        }
        if (egg) { eggCrack(scr.querySelector('#eggC')); setTimeout(donut, 1700) } else donut()
        const rate = months.map(r => r.menetas + r.buruk ? Math.round(r.menetas / (r.menetas + r.buruk) * 1000) / 10 : null)
        S.charts.push(new Chart(scr.querySelector('#c3b'), {
          type: 'bar', plugins: [presValueLabels(11, fmt)],
          data: { labels: MONTH_LABELS.map((m, i) => rate[i] == null ? [m, ''] : [m, rate[i].toFixed(0) + '%']), datasets: [
            { label: 'Menetas', data: months.map(r => r.menetas), backgroundColor: '#2FA4B8', borderRadius: 6, stack: 'a' },
            { label: 'Buruk', data: months.map(r => r.buruk), backgroundColor: '#DC6A40', borderRadius: 6, stack: 'a' },
            { type: 'line', label: 'Kadar %', data: rate, yAxisID: 'y2', borderColor: '#F1F5F4', backgroundColor: '#F1F5F4', pointRadius: 4, borderWidth: 2, tension: .3, spanGaps: true, noLabel: true }
          ] },
          options: chartBase({ layout: { padding: { top: 8 } }, animation: { duration: 900, delay: (c) => c.type === 'data' ? c.dataIndex * 90 + 300 : 0 }, interaction: { mode: 'index', intersect: false },
            scales: { x: { ...chartBase().scales.x, stacked: true, ticks: { color: '#cbd5d1', font: { size: 12 } } }, y: { ...chartBase().scales.y, stacked: true }, y2: { position: 'right', min: 0, max: 100, grid: { display: false }, ticks: { color: '#F1F5F4', callback: (v) => v + '%' } } } })
        }))
      })
      return
    }

    if (sec === 4) {
      const opts = C.series.filter(r => r.y !== S.year).map(r => r.y).reverse()
      const render4 = () => {
        const cm = data.byIsl[S.island][S.cmp], cs = yearSummary(cm, S.cmp)
        return { cm, cs }
      }
      let { cm, cs } = render4()
      const kpis = () => [
        ['Penyu / sarang', s.penyu, cs.penyu], ['Telur dikutip', s.dikutip, cs.dikutip], ['Telur ditanam', s.telur, cs.telur],
        ['Anak penyu menetas', s.menetas, cs.menetas, false, true], ['Kadar menetas', s.rate, cs.rate, true]
      ]
      const kpiHTML = () => kpis().map((k, i) => `
        <div class="pres-card p-4 pa" ${delay(i, .2)}>
          <div class="text-xs opacity-70">${k[0]}</div>
          <div class="pres-num" style="font-size:clamp(1.3rem,2.2vw,1.9rem)">${k[3] ? (k[1] == null ? '—' : k[1].toFixed(1) + '%') : fmt(k[1])}</div>
          <div class="text-xs mt-1">${k[4] && (s.hatchIncomplete || cs.hatchIncomplete || !cs.menetas) ? `<span class="opacity-60">${S.cmp}: ${fmt(k[2])}</span> · <span style="color:#F2C38B">⚠ ${!cs.menetas ? `tiada data penetasan ${S.cmp}` : `penetasan ${cs.hatchIncomplete ? S.cmp : S.year} belum lengkap`}</span>` : `<span class="opacity-60">${S.cmp}: ${k[3] ? (k[2] == null ? '—' : k[2].toFixed(1) + '%') : fmt(k[2])}</span> · ${k[3] ? (k[1] == null || k[2] == null ? '' : `<span class="${k[1] >= k[2] ? 'pres-up' : 'pres-down'}">${k[1] >= k[2] ? '▲' : '▼'} ${Math.abs(k[1] - k[2]).toFixed(1)} mata</span>`) : deltaTxt(k[1], k[2])}`}</div>
        </div>`).join('')
      show(`
        <div class="mb-4 flex items-end justify-between gap-4 flex-wrap" style="width:min(1200px,100%)">
          <div><div class="pres-eyebrow pa" ${delay(0)}>${isl.name}</div>
          <h2 class="pres-title pa" ${delay(1)} style="font-size:clamp(1.7rem,3.6vw,3rem)">${S.year} <span style="opacity:.5">vs</span> <span style="color:#E0A458" id="cmpLbl">${S.cmp}</span></h2></div>
          <label class="pa flex items-center gap-2 text-sm" ${delay(2)}><span class="opacity-75">Banding dengan</span>
            <select id="cmpSel">${opts.map(y => `<option value="${y}" ${y === S.cmp ? 'selected' : ''}>${y}</option>`).join('')}</select></label>
        </div>
        <div class="grid gap-3 mb-4" id="kpiRow" style="width:min(1200px,100%); grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${kpiHTML()}</div>
        <div class="pres-card p-5 pa" ${delay(3)} style="width:min(1200px,100%); height:clamp(260px,40vh,420px)"><canvas id="c4"></canvas></div>`, (scr) => {
        const chart = new Chart(scr.querySelector('#c4'), {
          type: 'bar',
          data: { labels: MONTH_LABELS, datasets: [
            { label: String(S.year), data: months.map(r => r.telur), backgroundColor: '#2FA4B8', borderRadius: 6, labelFmt: kLbl },
            { label: String(S.cmp), data: cm.map(r => r.telur), backgroundColor: '#E0A458', borderRadius: 6, labelFmt: kLbl }
          ] }, plugins: [presValueLabels(11, fmt)],
          options: chartBase({ layout: { padding: { top: 28 } }, animation: { duration: 900, delay: (c) => c.type === 'data' && c.mode === 'default' ? c.dataIndex * 70 + c.datasetIndex * 200 + 300 : 0 }, interaction: { mode: 'index', intersect: false },
            plugins: { ...chartBase().plugins, tooltip: { ...chartBase().plugins.tooltip, callbacks: { label: (c) => ` ${c.dataset.label}: ${fmt(c.raw)} telur` } } } })
        })
        S.charts.push(chart)
        scr.querySelector('#cmpSel').onchange = (e) => {
          S.cmp = Number(e.target.value)
          ;({ cm, cs } = render4())
          chart.data.datasets[1].label = String(S.cmp)
          chart.data.datasets[1].data = cm.map(r => r.telur)
          chart.update()
          scr.querySelector('#cmpLbl').textContent = S.cmp
          const row = scr.querySelector('#kpiRow'); row.innerHTML = kpiHTML()
        }
      })
      return
    }

    if (sec === 5) {
      const ser = C.series
      const best = ser.reduce((b, r) => r.dikutip > b.dikutip ? r : b, ser[0])
      const worst = ser.filter(r => r.y !== thisYear).reduce((b, r) => r.dikutip < b.dikutip ? r : b, ser[0])
      const rated = ser.filter(r => r.rate != null && !r.hatchIncomplete)
      const bestRate = rated.reduce((b, r) => !b || r.rate > b.rate ? r : b, null)
      const avg = ser.reduce((a, r) => a + r.dikutip, 0) / ser.length
      show(`
        ${head(isl.name, `${S.year} dalam sejarah ${ser[0].y}–${ser[ser.length - 1].y}`)}
        <div class="grid gap-3 mb-4" style="width:min(1200px,100%); grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
          <div class="pres-card p-4 pa" ${delay(0, .2)}><div class="text-xs opacity-70">🏆 Tahun tertinggi</div><div class="pres-num" style="font-size:1.6rem; color:#E0A458">${best.y}</div><div class="text-xs opacity-75">${fmt(best.dikutip)} telur dikutip</div></div>
          <div class="pres-card p-4 pa" ${delay(1, .2)}><div class="text-xs opacity-70">📉 Tahun terendah</div><div class="pres-num" style="font-size:1.6rem; color:#7DD3FC">${worst.y}</div><div class="text-xs opacity-75">${fmt(worst.dikutip)} telur dikutip</div></div>
          ${bestRate ? `<div class="pres-card p-4 pa" ${delay(2, .2)}><div class="text-xs opacity-70">🐣 Kadar menetas terbaik</div><div class="pres-num" style="font-size:1.6rem; color:#6EE7B7">${bestRate.y}</div><div class="text-xs opacity-75">${bestRate.rate.toFixed(1)}%</div></div>` : ''}
          <div class="pres-card p-4 pa" ${delay(3, .2)}><div class="text-xs opacity-70">📍 ${S.year}</div><div class="pres-num" style="font-size:1.6rem">#${C.rank}</div><div class="text-xs opacity-75">${deltaTxt(s.dikutip, avg)} berbanding purata</div></div>
        </div>
        <div class="pres-card p-5 pa" ${delay(4, .2)} style="width:min(1200px,100%); height:clamp(260px,42vh,440px)"><canvas id="c5"></canvas></div>
        <div class="text-xs opacity-60 mt-2 pa" ${delay(5, .2)}>Klik mana-mana tahun pada graf untuk terus ke laporan tahun itu.</div>`, (scr) => {
        const col = (r) => r.y === S.year ? '#6EE7B7' : r.y === best.y ? '#E0A458' : r.y === worst.y ? '#7DD3FC' : 'rgba(47,164,184,.45)'
        const ch = new Chart(scr.querySelector('#c5'), {
          data: { labels: ser.map(r => r.y), datasets: [
            { type: 'bar', label: 'Telur dikutip', data: ser.map(r => r.dikutip), backgroundColor: ser.map(col), borderRadius: 4, yAxisID: 'y' },
            { type: 'line', label: 'Kadar menetas %', data: ser.map(r => r.rate == null ? null : Math.round(r.rate * 10) / 10), yAxisID: 'y2', borderColor: 'rgba(241,245,244,.75)', pointRadius: 0, borderWidth: 2, tension: .3, spanGaps: true }
          ] },
          options: chartBase({ animation: { duration: 700, delay: (c) => c.type === 'data' ? c.dataIndex * 35 + 300 : 0 }, interaction: { mode: 'index', intersect: false },
            onClick: (e, els) => { if (els.length) { S.year = ser[els[0].index].y; S.sec = 0; S.cmp = null; dir = 1; renderSection() } },
            onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default' },
            scales: { x: { ...chartBase().scales.x, ticks: { color: '#9fb3ae', maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } }, y: chartBase().scales.y, y2: { position: 'right', min: 0, max: 100, grid: { display: false }, ticks: { color: '#F1F5F4', callback: (v) => v + '%' } } },
            plugins: { ...chartBase().plugins, tooltip: { ...chartBase().plugins.tooltip, callbacks: { label: (c) => c.datasetIndex === 0 ? ` Telur dikutip: ${fmt(c.raw)}` : ` Kadar menetas: ${c.raw}%` } } } })
        })
        S.charts.push(ch)
      })
      return
    }

    if (sec === 6) {
      const ins = []
      const act = s.active
      if (C.rank) ins.push(['🏅', `<b>${S.year}</b> berada di kedudukan <b>#${C.rank}</b> daripada ${C.series.length} tahun bagi telur dikutip (${fmt(s.dikutip)} biji).`])
      if (C.prevYear) {
        const d = (s.dikutip - C.prevYear.dikutip) / C.prevYear.dikutip * 100
        ins.push([d >= 0 ? '📈' : '📉', `Telur dikutip ${d >= 0 ? 'meningkat' : 'menurun'} <b>${Math.abs(d).toFixed(1)}%</b> berbanding ${C.prevYear.y} (${fmt(C.prevYear.dikutip)} biji).`])
      }
      if (act.length) {
        const best = act.reduce((b, r) => r.telur > b.telur ? r : b, act[0])
        ins.push(['🏆', `<b>${MONTH_FULL[best.m]}</b> bulan paling sibuk — ${fmt(best.telur)} telur (${(best.telur / (s.telur || 1) * 100).toFixed(0)}% setahun).`])
      }
      if (s.rate != null) {
        const rated = C.series.filter(r => r.rate != null && !r.hatchIncomplete)
        const avgRate = rated.reduce((a, r) => a + r.rate, 0) / (rated.length || 1)
        const top = rated.slice().sort((a, b) => b.rate - a.rate).findIndex(r => r.y === S.year) + 1
        ins.push(['🐣', `Kadar menetas <b>${s.rate.toFixed(1)}%</b> — ${s.rate >= avgRate ? 'melebihi' : 'di bawah'} purata ${avgRate.toFixed(1)}% sejak ${C.series[0].y}${top === 1 ? ', <b>tertinggi dalam sejarah</b>' : top ? ` (#${top} terbaik)` : ''}.${s.hatchIncomplete ? ' <span style="color:#F2C38B">(penetasan belum lengkap)</span>' : ''}`])
      }
      const landas = months.map((r, i) => r.telur === 0 ? MONTH_LABELS[i] : null).filter(Boolean)
      if (landas.length && landas.length < 12) ins.push(['🌊', `Tiada pendaratan direkod pada <b>${landas.join(', ')}</b> — musim landas.`])
      show(`
        ${head(`${isl.name} · ${S.year}`, 'Rumusan')}
        <div class="grid gap-3" style="width:min(1000px,100%)">
          ${ins.map((t, i) => `<div class="pres-card pres-insight pa" ${delay(i, .35)}><div class="ic">${t[0]}</div><div style="font-size:clamp(1rem,1.6vw,1.25rem); line-height:1.5">${t[1]}</div></div>`).join('')}
        </div>
        ${MODE === 'hidup' ? `<canvas class="pres-beach pa" id="beachC" ${delay(ins.length, .35)} aria-hidden="true"></canvas>` : ''}
        <div class="flex gap-3 mt-5 flex-wrap justify-center pa" ${delay(ins.length + 1, .35)}>
          <button class="pres-btn" id="rIsl" style="font-size:1rem; padding:.7rem 1.3rem">🏝 Pulau lain</button>
          <button class="pres-btn" id="rYear" style="font-size:1rem; padding:.7rem 1.3rem">📅 Tahun lain</button>
          <button class="pres-btn" id="rHome" style="font-size:1rem; padding:.7rem 1.3rem">🏠 Utama</button>
          ${hasClosing ? '<button class="pres-btn" id="rEnd" style="font-size:1rem; padding:.7rem 1.3rem; border-color:rgba(110,231,183,.6)">Penutup →</button>' : ''}
        </div>`, (scr) => {
        scr.querySelector('#rIsl').onclick = () => { dir = -1; renderIslands() }
        scr.querySelector('#rYear').onclick = () => { dir = -1; renderYears() }
        scr.querySelector('#rHome').onclick = () => { dir = -1; renderIntro() }
        if (hasClosing) scr.querySelector('#rEnd').onclick = () => { dir = 1; renderClosing() }
        const bc = scr.querySelector('#beachC'); if (bc) beach(bc)
      })
    }
  }

  // ---------- 5. Penutup (pilihan) ----------
  function renderClosing() {
    S.level = 'closing'; setBg(null); crumb()
    const P = T.closing
    show(`
      <div class="flex flex-col items-center text-center gap-5" style="max-width:900px">
        <img src="../assets/logo.png" class="pres-logo" alt="Logo Lembaga Pengurusan Penyu" onerror="this.style.display='none'" style="width:clamp(90px,11vw,140px)" />
        ${P.title ? `<h2 class="pres-title pa" ${delay(0, .6)} style="font-size:clamp(2.2rem,6vw,5rem)">${presMulti(P.title)}</h2>` : ''}
        ${P.name ? `<div class="pa" ${delay(1, .6)} style="font-size:clamp(1.05rem,1.8vw,1.4rem); opacity:.9">${presMulti(P.name)}</div>` : ''}
        ${P.date ? `<div class="pres-eyebrow pa" ${delay(2, .6)}>${presEsc(P.date)}</div>` : ''}
        <div class="flex gap-3 mt-4 flex-wrap justify-center pa" ${delay(3, .6)}>
          <button class="pres-btn" id="cBack" style="font-size:1rem; padding:.7rem 1.3rem">‹ Rumusan</button>
          <button class="pres-btn" id="cHome" style="font-size:1rem; padding:.7rem 1.3rem">🏠 Utama</button>
        </div>
      </div>`, (scr) => {
      scr.querySelector('#cBack').onclick = () => back()
      scr.querySelector('#cHome').onclick = () => { dir = -1; renderIntro() }
    })
  }

  // ---------- Navigasi ----------
  const back = () => {
    dir = -1
    if (S.level === 'closing') { S.sec = PRES_SECTIONS.length - 1; renderSection() }
    else if (S.level === 'report') renderYears()
    else if (S.level === 'years') renderIslands()
    else if (S.level === 'islands') hasPrelude ? renderPrelude() : renderIntro()
    else if (S.level === 'prelude') renderIntro()
    else close()
  }
  const next = () => {
    if (S.level === 'intro') { if (!data) return; dir = 1; hasPrelude ? renderPrelude() : renderIslands() }
    else if (S.level === 'prelude') { if (!data) return; dir = 1; renderIslands() }
    else if (S.level === 'report') { if (S.sec === PRES_SECTIONS.length - 1) { if (hasClosing) { dir = 1; renderClosing() } } else goSec(S.sec + 1) }
  }
  const prev = () => {
    if (S.level === 'report') { if (S.sec === 0) back(); else goSec(S.sec - 1) }
    else if (S.level === 'prelude' || S.level === 'closing') back()
  }
  function close() {
    cancelAnimationFrame(raf)
    finishAnim()
    destroyPresCharts()
    root.querySelectorAll('.pres-screen').forEach(killScreen)
    S.live = []
    window.removeEventListener('keydown', onKey, true)
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {})
    root.style.transition = 'opacity .4s'; root.style.opacity = '0'
    setTimeout(() => { root.remove(); document.body.style.overflow = '' }, 400)
  }
  function onKey(e) {
    if (!document.body.contains(root)) return
    if (e.target && ['SELECT', 'INPUT', 'TEXTAREA'].includes(e.target.tagName) && e.key !== 'Escape') return
    const k = e.key
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); e.stopPropagation(); next() }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); e.stopPropagation(); prev() }
    else if (k === 'Escape') { e.preventDefault(); e.stopPropagation(); if (document.fullscreenElement) return; back() }
    else if (k === 'f' || k === 'F') { e.preventDefault(); toggleFull() }
  }
  const toggleFull = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else root.requestFullscreen?.().catch(() => {}) }
  window.addEventListener('keydown', onKey, true)
  $('#pClose').onclick = close
  $('#pFull').onclick = toggleFull
  $('#pIsl').onclick = () => { dir = -1; renderIslands() }
  $('#pYear').onclick = () => { dir = -1; renderYears() }
  $('#pNext').onclick = next
  $('#pPrev').onclick = prev
  // swipe (telefon/tablet)
  let tx = null
  root.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX }, { passive: true })
  root.addEventListener('touchend', (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) dx < 0 ? next() : prev(); tx = null }, { passive: true })
  // klik kosong pada skrin pembukaan = mula
  root.addEventListener('click', (e) => { if (S.level === 'intro' && e.target.closest('.pres-stage') && !e.target.closest('button')) next() })

  const presReady = loadPresData().then(d => { data = d; return d }).catch(err => { toast('Gagal muat data pembentangan: ' + err.message, 'error'); throw err })
  renderIntro()
  if (opts.island) {
    await presReady
    S.island = opts.island
    if (opts.year) { S.year = opts.year; S.sec = 0; renderSection() } else renderYears()
  }
}
window.openPresentation = openPresentation

// ---------- Init ----------
;(async () => {
  // Belum log masuk => ../login.html; tiada akses Penyu => portal.
  const { profile } = await requireApp('penyu')
  state.profile = profile
  applyIslandGate()
  const showPortal = appsFor(profile).length > 1
  document.getElementById('navPortal').classList.toggle('hidden', !showPortal)
  document.getElementById('navPortal').classList.toggle('flex', showPortal)
  render(location.hash.slice(1) || 'splash')
})()

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(() => {})
  })
}
</script>
