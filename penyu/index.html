        q('#pt_save').disabled = true
      }
      fill(mergePresText(data?.value))
      q('#pt_status').textContent = data?.updated_at ? 'Disimpan ' + new Date(data.updated_at).toLocaleString('ms-MY') : 'Guna teks asal'
      const f = q('#pt_form'); f.classList.remove('opacity-50', 'pointer-events-none')
    }
    q('#pt_preview').onclick = () => openPresentation({ text: collect() })
    q('#pt_reset').onclick = () => q('#pt_resetConfirm').classList.remove('hidden')
    q('#pt_resetNo').onclick = () => q('#pt_resetConfirm').classList.add('hidden')
    q('#pt_resetYes').onclick = () => { fill(mergePresText(null)); q('#pt_resetConfirm').classList.add('hidden'); toast('Teks asal dimuat — tekan Simpan untuk kekalkan', 'success') }
    q('#pt_save').onclick = async () => {
      const btn = q('#pt_save'); btn.disabled = true; btn.textContent = 'Menyimpan…'
      const value = collect()
      const { error } = await supabase.from('app_settings').upsert({ key: 'presentation', value, updated_at: new Date().toISOString() }, { onConflict: 'key' })
      btn.disabled = false; btn.textContent = '💾 Simpan'
      if (error) { toast('Gagal simpan: ' + error.message, 'error'); return }
      q('#pt_status').textContent = 'Disimpan ' + new Date().toLocaleString('ms-MY')
      toast('Teks pembentangan disimpan', 'success')
    }
    loadPt()
    const tabs = wrap.querySelector('#adminTabs')
    const showTab = (t) => {
      state.adminTab = t
      tabs.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.t === t))
      body.classList.toggle('hidden', t !== 'data')
      presBody.classList.toggle('hidden', t !== 'pres')
    }
    tabs.querySelectorAll('button').forEach(b => b.onclick = () => showTab(b.dataset.t))
    showTab(state.adminTab === 'pres' ? 'pres' : 'data')
  }
  return wrap
}

// ---------- Excel export logic ----------
// Label angka pada bar — dikongsi Mod Pembentangan & PowerPoint.
// Angka muncul (fade-in) mengikut ketinggian bar semasa animasi; tiada label untuk garis.
// ds.noLabel = tiada label; ds.labelFmt = format sendiri. Label dilangkau jika tidak muat.
function presValueLabels(size = 12, fmtNum = (v) => Math.round(v).toLocaleString('en-US')) {
  return { id: 'vl', afterDatasetsDraw(ch) {
    if (ch.width < 560) return // skrin kecil (telefon): terlalu sempit, guna tooltip
    const g = ch.ctx; g.save(); g.textAlign = 'center'; g.font = `600 ${size}px Inter, Arial, sans-serif`
    ch.data.datasets.forEach((ds, di) => {
      const meta = ch.getDatasetMeta(di)
      if (!ch.isDatasetVisible(di) || ds.noLabel || meta.type === 'line') return
      meta.data.forEach((el, i) => {
        const v = ds.data[i]; if (v == null || v === 0) return
        const fin = el.getProps(['y', 'base'], true)
        const full = Math.abs(fin.base - fin.y); if (!full) return
        const p = Math.min(1, Math.max(0, Math.abs(el.base - el.y) / full))
        const a = Math.pow(p, 4); if (a < 0.03) return
        const txt = ds.labelFmt ? ds.labelFmt(v) : fmtNum(v)
        const tw = g.measureText(txt).width
        g.globalAlpha = a
        if (ds.stack) {
          if (full < size + 4 || tw > (el.width || 0) + 8) return
          g.fillStyle = '#FFFFFF'; g.textBaseline = 'middle'; g.fillText(txt, el.x, (el.y + el.base) / 2)
        } else {
          if (tw > (el.width || 0) * 1.9) return
          g.fillStyle = '#E6F0EE'; g.textBaseline = 'bottom'; g.fillText(txt, el.x, el.y - 4)
        }
      })
    })
    g.restore()
  } }
}

// ---------- PowerPoint ikut Mod Pembentangan (PptxGenJS) ----------
// Slaid sama dengan Mod Pembentangan (tanpa animasi): Pembukaan → Pendahuluan → Pulau →
// Ringkasan → 12 Bulan → Terbaik/Terendah → Penetasan → Perbandingan → Sejarah → Rumusan → Penutup.
// Fon Georgia + Arial dan carta sebagai gambar supaya kekal kemas bila dibuka di Google Slides.
async function generatePresDeck(island, year) {
  if (!window.PptxGenJS) throw new Error('PptxGenJS tidak dimuat — semak internet')
  const [data, T] = await Promise.all([loadPresData(), loadPresText()])
  const thisYear = new Date().getFullYear()
  const ISL = PRES_ISLANDS.map(i => ({ ...i, name: T.names[i.code] || i.name }))
  const isl = ISL.find(i => i.code === island)
  const fmt = (n) => Math.round(n).toLocaleString('en-US')
  const fmtShort = (n) => n >= 1e6 ? (Math.round(n / 1e5) / 10) + ' juta' : n >= 1e4 ? Math.round(n / 1000) + 'k' : fmt(n)
  const kFmt = (v) => v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(v)
  const months = data.byIsl[island][year]
  const s = yearSummary(months, year)
  const series = data.years.map(y => ({ y, ...yearSummary(data.byIsl[island][y], y) })).filter(r => r.dikutip > 0)
  const ranked = series.slice().sort((a, b) => b.dikutip - a.dikutip)
  const rank = ranked.findIndex(r => r.y === year) + 1
  const prev = series.filter(r => r.y < year).pop()
  const cmpY = prev?.y ?? series.find(r => r.y !== year)?.y
  const cmpM = cmpY ? data.byIsl[island][cmpY] : null
  const cs = cmpY ? yearSummary(cmpM, cmpY) : null

  // ---- Warna & fon (sama tema Mod Pembentangan) ----
  const C = { bg: '061820', card: '0A242E', line: 'FFFFFF', text: 'F1F5F4', mute: '9FB3AE', mint: '6EE7B7', teal: '2FA4B8', gold: 'E0A458', sky: '7DD3FC', coral: 'DC6A40', up: '6EE7B7', down: 'F2A07B', warn: 'F2C38B' }
  const HEAD = 'Georgia', BODY = 'Arial'
  const W = 13.333, H = 7.5

  // ---- Latar: gambar pulau dikaburkan + gelap (dibakar ke JPEG) ----
  const loadImg = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src })
  async function makeBg(img) {
    const c = document.createElement('canvas'); c.width = 1600; c.height = 900
    const x = c.getContext('2d')
    x.fillStyle = '#061820'; x.fillRect(0, 0, 1600, 900)
    if (img) {
      const im = await loadImg(img)
      const sc = Math.max(1700 / im.width, 1000 / im.height)
      x.filter = 'blur(22px) brightness(0.34) saturate(1.2)'
      x.drawImage(im, 800 - im.width * sc / 2, 450 - im.height * sc / 2, im.width * sc, im.height * sc)
      x.filter = 'none'
    }
    let g = x.createRadialGradient(240, 0, 0, 240, 0, 1100); g.addColorStop(0, 'rgba(18,64,74,.75)'); g.addColorStop(1, 'rgba(18,64,74,0)')
    x.fillStyle = g; x.fillRect(0, 0, 1600, 900)
    g = x.createLinearGradient(0, 0, 0, 900); g.addColorStop(0, 'rgba(4,16,22,.35)'); g.addColorStop(1, 'rgba(4,16,22,.65)')
    x.fillStyle = g; x.fillRect(0, 0, 1600, 900)
    // garis riak halus di atas
    x.strokeStyle = 'rgba(180,255,235,.06)'; x.lineWidth = 2
    for (let i = 0; i < 4; i++) { x.beginPath(); for (let px = 0; px <= 1600; px += 20) { const py = 70 + i * 18 + Math.sin(px / 45 + i) * 5; px ? x.lineTo(px, py) : x.moveTo(px, py) } x.stroke() }
    return c.toDataURL('image/jpeg', 0.86)
  }
  const bgPlain = await makeBg(null)
  const bgIsl = isl.img ? await makeBg(isl.img) : bgPlain
  let logo = null
  try {
    const im = await loadImg('../assets/logo.png')
    const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight
    c.getContext('2d').drawImage(im, 0, 0); logo = { data: c.toDataURL('image/png'), r: im.naturalHeight / im.naturalWidth }
  } catch (e) { logo = null }

  // ---- Carta Chart.js → PNG (tanpa animasi) ----
  const valueLabels = (size) => presValueLabels(size, fmt)
  async function chartPng(cfg, wIn, hIn, labelSize) {
    if (labelSize) { cfg.plugins = [...(cfg.plugins || []), valueLabels(labelSize)]; cfg.options = { ...(cfg.options || {}), layout: { padding: { top: labelSize + 10 } } } }
    const pxW = Math.round(wIn * 110), pxH = Math.round(hIn * 110)
    const c = document.createElement('canvas'); c.width = pxW; c.height = pxH
    c.style.cssText = `position:fixed; left:-10000px; top:0; width:${pxW}px; height:${pxH}px`
    document.body.appendChild(c)
    cfg.options = { ...(cfg.options || {}), responsive: false, animation: false, devicePixelRatio: 2 }
    const ch = new Chart(c, cfg)
    const url = ch.toBase64Image('image/png', 1)
    ch.destroy(); c.remove()
    return url
  }
  const axis = (extra = {}) => ({
    plugins: { legend: { labels: { color: '#cbd5d1', usePointStyle: true, pointStyle: 'circle', boxWidth: 8, font: { size: 14 } } } },
    scales: { x: { grid: { display: false }, ticks: { color: '#9fb3ae', font: { size: 14 } } }, y: { grid: { color: 'rgba(255,255,255,.08)' }, ticks: { color: '#9fb3ae', font: { size: 13 }, callback: (v) => fmtShort(v) }, beginAtZero: true } },
    ...extra
  })

  // ---- Pembantu slaid ----
  const pptx = new PptxGenJS()
  pptx.layout = 'LAYOUT_WIDE'
  pptx.title = `${isl.name} ${year} — Lembaga Pengurusan Penyu`
  let n = 0
  const footer = (sl) => {
    n++
    sl.addText(`Lembaga Pengurusan Penyu · ${isl.name} · ${year}`, { x: 0.6, y: 7.0, w: 9, h: 0.3, fontFace: BODY, fontSize: 9, color: C.mute })
    sl.addText(String(n), { x: 12.2, y: 7.0, w: 0.55, h: 0.3, fontFace: BODY, fontSize: 9, color: C.mute, align: 'right' })
  }
  const newSlide = (bg = bgIsl) => { const sl = pptx.addSlide(); sl.background = { data: bg, path: 'latar.jpg' }; return sl }
  const head = (sl, eyebrow, title) => {
    sl.addText(eyebrow.toUpperCase(), { x: 0.6, y: 0.45, w: 12, h: 0.32, fontFace: BODY, fontSize: 11, bold: true, color: C.mint, charSpacing: 3 })
    sl.addText(title, { x: 0.6, y: 0.78, w: 12.1, h: 0.85, fontFace: HEAD, fontSize: 34, bold: true, color: C.text })
  }
  const card = (sl, x, y, w, h, border) => sl.addShape(pptx.ShapeType.roundRect, { x, y, w, h, rectRadius: 0.18, fill: { color: C.card, transparency: 22 }, line: { color: border || C.line, transparency: border ? 50 : 88, width: 1 } })
  const delta = (now, then, vs) => {
    if (!then) return [{ text: '—', options: { color: C.mute } }]
    const d = (now - then) / then * 100
    return [{ text: `${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}%`, options: { color: d >= 0 ? C.up : C.down, bold: true } }, { text: vs ? `  vs ${vs}` : '', options: { color: C.mute } }]
  }
  const hatchDelta = (now, sNow, yNow, then, sThen, yThen) => {
    if (!sThen.menetas) return [{ text: `⚠ tiada data penetasan ${yThen}`, options: { color: C.warn } }]
    if (sThen.hatchIncomplete) return [{ text: `⚠ data penetasan ${yThen} belum lengkap`, options: { color: C.warn } }]
    if (sNow.hatchIncomplete) return [{ text: `⚠ penetasan ${yNow} belum lengkap`, options: { color: C.warn } }, { text: `  ·  ${yThen}: ${fmt(then)}`, options: { color: C.mute } }]
    return delta(now, then, yThen)
  }
  // teks dengan <b> → runs PptxGenJS
  const runs = (html, base = {}) => html.split(/(<b>.*?<\/b>)/g).filter(Boolean).map(p => p.startsWith('<b>') ? { text: p.slice(3, -4), options: { ...base, bold: true, color: C.text } } : { text: p.replace(/<[^>]+>/g, ''), options: base })

  // ===== 1. Pembukaan =====
  {
    const sl = newSlide(bgPlain)
    let y = 0.7
    if (logo) { const lw = 1.7; sl.addImage({ data: logo.data, x: (W - lw) / 2, y, w: lw, h: lw * logo.r, rounding: false }); y += lw * logo.r + 0.25 }
    sl.addText(T.intro.eyebrow.toUpperCase(), { x: 0.5, y, w: W - 1, h: 0.35, align: 'center', fontFace: BODY, fontSize: 12, bold: true, color: C.mint, charSpacing: 4 }); y += 0.4
    const tl = T.intro.title.split('\n').length
    sl.addText(T.intro.title, { x: 0.5, y, w: W - 1, h: 0.75 * tl + 0.1, align: 'center', fontFace: HEAD, fontSize: 44, bold: true, color: C.text, valign: 'middle' }); y += 0.75 * tl + 0.2
    sl.addText(T.intro.subtitle, { x: 0.5, y, w: W - 1, h: 0.45, align: 'center', fontFace: BODY, fontSize: 16, color: 'CBD5D1' }); y += 0.7
    let tot = { dikutip: 0, menetas: 0, penyu: 0 }, first = null
    data.years.forEach(yy => { const z = yearSummary(data.byIsl.ALL[yy], yy); if (z.dikutip > 0 && first === null) first = yy; tot.dikutip += z.dikutip; tot.menetas += z.menetas; tot.penyu += z.penyu })
    const cells = [[tot.dikutip, T.intro.stat1], [tot.menetas, T.intro.stat2], [tot.penyu, T.intro.stat3]]
    const cw = 3.4, gap = 0.3, x0 = (W - (cw * 3 + gap * 2)) / 2
    cells.forEach(([v, l], i) => {
      const x = x0 + i * (cw + gap)
      card(sl, x, y, cw, 1.25)
      sl.addText(fmt(v), { x, y: y + 0.12, w: cw, h: 0.6, align: 'center', fontFace: BODY, fontSize: 28, bold: true, color: C.text })
      sl.addText(l.replace(/\{tahun\}/g, first ?? 1990), { x, y: y + 0.72, w: cw, h: 0.4, align: 'center', fontFace: BODY, fontSize: 11, color: C.mute })
    })
    n++
  }

  // ===== 1b. Pendahuluan (jika diisi) =====
  if (T.prelude.title || T.prelude.body) {
    const sl = newSlide(bgPlain)
    sl.addText('PENDAHULUAN', { x: 0.5, y: 1.2, w: W - 1, h: 0.35, align: 'center', fontFace: BODY, fontSize: 12, bold: true, color: C.mint, charSpacing: 4 })
    if (T.prelude.title) sl.addText(T.prelude.title, { x: 0.5, y: 1.6, w: W - 1, h: 0.9, align: 'center', fontFace: HEAD, fontSize: 38, bold: true, color: C.text })
    const paras = T.prelude.body.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean)
    if (paras.length) {
      // tinggi kad ikut panjang teks (≈ 85 aksara sebaris pada 17pt)
      const lines = paras.reduce((a, p) => a + Math.max(1, Math.ceil(p.length / 85)), 0) + (paras.length - 1) * 0.6
      const th = Math.min(4.3, 0.55 + lines * 0.42)
      const cy = Math.max(2.25, (H - th) / 2 + 0.35)
      card(sl, 1.4, cy, W - 2.8, th)
      sl.addText(paras.map((p, i) => ({ text: p.replace(/\n/g, ' '), options: { breakLine: i < paras.length - 1, paraSpaceAfter: 12 } })), { x: 1.8, y: cy + 0.15, w: W - 3.6, h: th - 0.3, fontFace: BODY, fontSize: 17, color: C.text, valign: 'middle', lineSpacingMultiple: 1.25 })
    }
    footer(sl)
  }

  // ===== 2. Pulau (kulit) =====
  {
    const sl = newSlide(bgIsl)
    if (isl.img) {
      const im = await loadImg(isl.img), r = im.height / im.width
      const iw = 7.2, ih = Math.min(5.6, iw * r)
      sl.addImage({ data: isl.img, x: W - iw - 0.6, y: (H - ih) / 2 - 0.1, w: iw, h: ih, rounding: false })
    } else {
      const pics = ISL.slice(0, 3)
      for (let i = 0; i < 3; i++) sl.addImage({ data: pics[i].img, x: 6.1 + i * 2.4, y: 1.4, w: 2.3, h: 4.6, sizing: { type: 'cover', w: 2.3, h: 4.6 } })
    }
    const totIsl = data.years.reduce((a, yy) => a + yearSummary(data.byIsl[island][yy], yy).dikutip, 0)
    sl.addText(island === 'ALL' ? 'GABUNGAN' : island, { x: 0.6, y: 2.2, w: 5.4, h: 0.35, fontFace: BODY, fontSize: 13, bold: true, color: C.mint, charSpacing: 4 })
    sl.addText(isl.name, { x: 0.6, y: 2.6, w: 5.4, h: 1.5, fontFace: HEAD, fontSize: 36, bold: true, color: C.text, valign: 'top' })
    sl.addText(`Laporan Tahunan ${year}`, { x: 0.6, y: 4.15, w: 5.4, h: 0.5, fontFace: BODY, fontSize: 18, color: 'CBD5D1' })
    sl.addText([{ text: fmt(totIsl), options: { bold: true, color: C.text } }, { text: ' telur dikutip sejak 1990', options: { color: C.mute } }], { x: 0.6, y: 4.7, w: 5.4, h: 0.4, fontFace: BODY, fontSize: 13 })
    footer(sl)
  }

  // ===== 3. Ringkasan =====
  {
    const sl = newSlide(); head(sl, `${isl.name} · Laporan Tahunan`, `Tahun ${year}`)
    card(sl, 0.6, 1.85, 4.0, 4.95)
    const ratePct = s.rate == null ? 0 : s.rate
    const ring = await chartPng({ type: 'doughnut', data: { datasets: [{ data: [ratePct, 100 - ratePct], backgroundColor: ['#6EE7B7', 'rgba(255,255,255,.09)'], borderWidth: 0 }] }, options: { cutout: '78%', plugins: { legend: { display: false }, tooltip: { enabled: false } } } }, 2.6, 2.6)
    sl.addImage({ data: ring, x: 1.3, y: 2.15, w: 2.6, h: 2.6 })
    sl.addText([{ text: s.rate == null ? '—' : `${s.rate.toFixed(1)}%`, options: { fontSize: 30, bold: true, color: C.text, breakLine: true } }, { text: 'kadar menetas', options: { fontSize: 11, color: C.mute } }], { x: 1.3, y: 2.95, w: 2.6, h: 1.0, align: 'center', valign: 'middle', fontFace: BODY })
    if (rank) sl.addText([{ text: `#${rank}`, options: { bold: true, color: C.gold } }, { text: ` daripada ${series.length} tahun (telur dikutip)`, options: { color: 'CBD5D1' } }], { x: 0.7, y: 4.95, w: 3.8, h: 0.4, align: 'center', fontFace: BODY, fontSize: 12 })
    const note = year === thisYear ? 'Tahun semasa — data masih dikemas kini' : ''
    if (note) sl.addText(`⚠ ${note}`, { x: 0.7, y: 5.4, w: 3.8, h: 0.4, align: 'center', fontFace: BODY, fontSize: 10, color: C.warn })
    const kp = [['🐢', 'Pendaratan penyu / sarang', s.penyu, prev?.penyu], ['🥚', 'Telur dikutip', s.dikutip, prev?.dikutip], ['🏝', 'Telur ditanam', s.telur, prev?.telur], ['🐣', 'Anak penyu menetas', s.menetas, prev?.menetas]]
    kp.forEach((k, i) => {
      const x = 4.85 + (i % 2) * 4.0, y = 1.85 + Math.floor(i / 2) * 2.55
      card(sl, x, y, 3.8, 2.4)
      sl.addText(k[0], { x: x + 0.25, y: y + 0.15, w: 1, h: 0.45, fontSize: 20 })
      sl.addText(fmt(k[2]), { x: x + 0.25, y: y + 0.6, w: 3.4, h: 0.75, fontFace: BODY, fontSize: 32, bold: true, color: C.text })
      sl.addText(k[1], { x: x + 0.25, y: y + 1.35, w: 3.4, h: 0.35, fontFace: BODY, fontSize: 12, color: 'CBD5D1' })
      if (prev) sl.addText(i === 3 ? hatchDelta(s.menetas, s, year, prev.menetas, prev, prev.y) : delta(k[2], k[3], prev.y), { x: x + 0.25, y: y + 1.75, w: 3.45, h: 0.35, fontFace: BODY, fontSize: 10.5 })
    })
    footer(sl)
  }

  // ===== 4. Perjalanan 12 bulan =====
  {
    const sl = newSlide(); head(sl, `${isl.name} · ${year}`, 'Perjalanan 12 bulan')
    const bestM = s.active.reduce((b, r) => r.telur > (months[b]?.telur || 0) ? r.m : b, 0)
    const ds = [{ label: 'Telur ditanam', data: months.map(r => r.telur), backgroundColor: months.map((r, i) => i === bestM ? '#E0A458' : '#2FA4B8'), borderRadius: 8, order: 2 }]
    if (months.some(r => r.dikutip !== r.telur)) ds.push({ type: 'line', label: 'Telur dikutip', data: months.map(r => r.dikutip), borderColor: 'rgba(255,255,255,.75)', borderDash: [6, 5], pointRadius: 0, borderWidth: 2, order: 1, noLabel: true })
    card(sl, 0.6, 1.85, 12.1, 4.55)
    sl.addImage({ data: await chartPng({ type: 'bar', data: { labels: MONTH_LABELS, datasets: ds }, options: axis() }, 11.7, 4.25, 14), x: 0.8, y: 2.0, w: 11.7, h: 4.25 })
    const landas = months.map((r, i) => r.telur === 0 && r.dikutip === 0 ? MONTH_LABELS[i] : null).filter(Boolean)
    if (landas.length && landas.length < 12) sl.addText([{ text: '🌊 Tiada pendaratan direkod: ', options: { color: 'CBD5D1' } }, { text: landas.join(', '), options: { bold: true, color: C.text } }, { text: ' — musim landas.', options: { color: 'CBD5D1' } }], { x: 0.6, y: 6.5, w: 12, h: 0.4, fontFace: BODY, fontSize: 12 })
    footer(sl)
  }

  // ===== 5. Bulan terbaik & terendah =====
  {
    const sl = newSlide(); head(sl, `${isl.name} · ${year}`, 'Bulan terbaik & terendah')
    const act = s.active
    if (!act.length) { card(sl, 0.6, 1.9, 12.1, 1.2); sl.addText('Tiada pendaratan direkod tahun ini.', { x: 0.9, y: 2.1, w: 11.5, h: 0.8, fontFace: BODY, fontSize: 18, color: C.text }) }
    else {
      const best = act.reduce((b, r) => r.telur > b.telur ? r : b, act[0])
      const low = act.reduce((b, r) => r.telur < b.telur ? r : b, act[0])
      const share = (r) => s.telur ? (r.telur / s.telur * 100).toFixed(1) : 0
      const box = (x, tag, color, r, extra) => {
        card(sl, x, 1.9, 5.9, 3.9, color)
        sl.addText(MONTH_LABELS[r.m], { x: x + 3.0, y: 1.95, w: 2.8, h: 1.6, align: 'right', fontFace: HEAD, fontSize: 80, bold: true, color: C.text, transparency: 92 })
        sl.addText(tag.toUpperCase(), { x: x + 0.35, y: 2.15, w: 5.2, h: 0.35, fontFace: BODY, fontSize: 11, bold: true, color, charSpacing: 3 })
        sl.addText(MONTH_FULL[r.m], { x: x + 0.35, y: 2.55, w: 5.3, h: 0.95, fontFace: HEAD, fontSize: 44, bold: true, color: C.text })
        sl.addText(fmt(r.telur), { x: x + 0.35, y: 3.5, w: 5.3, h: 0.7, fontFace: BODY, fontSize: 32, bold: true, color })
        sl.addText(`telur ditanam · ${share(r)}% daripada setahun · ${fmt(r.penyu)} sarang`, { x: x + 0.35, y: 4.2, w: 5.3, h: 0.4, fontFace: BODY, fontSize: 12, color: 'CBD5D1' })
        if (extra) sl.addText(runs(extra, { color: 'CBD5D1' }), { x: x + 0.35, y: 4.75, w: 5.3, h: 0.45, fontFace: BODY, fontSize: 13 })
      }
      box(0.6, '🏆 Bulan terbaik', C.gold, best, best.menetas + best.buruk ? `Kadar menetas bulan ini: <b>${(best.menetas / (best.menetas + best.buruk) * 100).toFixed(1)}%</b>` : '')
      box(6.8, '📉 Bulan terendah (ada pendaratan)', C.sky, low, `${act.length} bulan ada pendaratan tahun ini`)
      const bestRate = act.filter(r => r.menetas + r.buruk > 0).reduce((b, r) => (!b || r.menetas / (r.menetas + r.buruk) > b.menetas / (b.menetas + b.buruk)) ? r : b, null)
      if (bestRate) { card(sl, 0.6, 6.0, 12.1, 0.7); sl.addText(runs(`🐣 Kadar menetas tertinggi: <b>${MONTH_FULL[bestRate.m]}</b> — ${(bestRate.menetas / (bestRate.menetas + bestRate.buruk) * 100).toFixed(1)}% (${fmt(bestRate.menetas)} anak penyu)`, { color: 'CBD5D1' }), { x: 0.85, y: 6.05, w: 11.6, h: 0.6, fontFace: BODY, fontSize: 13 }) }
    }
    footer(sl)
  }

  // ===== 6. Penetasan =====
  {
    const sl = newSlide(); head(sl, `${isl.name} · ${year}`, 'Penetasan')
    const unknown = Math.max(0, s.telur - s.menetas - s.buruk)
    card(sl, 0.6, 1.85, 3.9, 4.6); card(sl, 4.7, 1.85, 8.0, 4.6)
    const lab = [`Menetas: ${fmt(s.menetas)}`, `Buruk: ${fmt(s.buruk)}`, ...(unknown ? [`Belum direkod: ${fmt(unknown)}`] : [])]
    const donut = await chartPng({ type: 'doughnut', data: { labels: lab, datasets: [{ data: [s.menetas, s.buruk, ...(unknown ? [unknown] : [])], backgroundColor: ['#2FA4B8', '#DC6A40', 'rgba(148,163,184,.3)'], borderColor: '#0b2530', borderWidth: 3 }] }, options: { cutout: '68%', plugins: { legend: { position: 'bottom', labels: { color: '#e2ebe9', usePointStyle: true, font: { size: 13 }, padding: 10 } } } } }, 3.6, 4.35)
    sl.addImage({ data: donut, x: 0.75, y: 1.98, w: 3.6, h: 4.35 })
    sl.addText([{ text: s.rate == null ? '—' : `${s.rate.toFixed(1)}%`, options: { fontSize: 22, bold: true, color: C.text, breakLine: true } }, { text: 'kadar menetas', options: { fontSize: 9, color: C.mute } }], { x: 1.55, y: 3.5, w: 2.0, h: 0.8, align: 'center', valign: 'middle', fontFace: BODY })
    const rate = months.map(r => r.menetas + r.buruk ? Math.round(r.menetas / (r.menetas + r.buruk) * 1000) / 10 : null)
    // kadar % ditulis di bawah nama bulan supaya tidak bertindih dengan angka bar
    const bar = await chartPng({ type: 'bar', data: { labels: MONTH_LABELS.map((m, i) => rate[i] == null ? [m, ''] : [m, rate[i].toFixed(0) + '%']), datasets: [
      { label: 'Menetas', data: months.map(r => r.menetas), backgroundColor: '#2FA4B8', borderRadius: 6, stack: 'a' },
      { label: 'Buruk', data: months.map(r => r.buruk), backgroundColor: '#DC6A40', borderRadius: 6, stack: 'a' },
      { type: 'line', label: 'Kadar %', data: rate, yAxisID: 'y2', borderColor: '#F1F5F4', backgroundColor: '#F1F5F4', pointRadius: 4, borderWidth: 2, tension: .3, spanGaps: true, noLabel: true }
    ] }, options: axis({ scales: { x: { stacked: true, grid: { display: false }, ticks: { color: '#cbd5d1', font: { size: 13 } } }, y: { stacked: true, grid: { color: 'rgba(255,255,255,.08)' }, ticks: { color: '#9fb3ae', callback: (v) => fmtShort(v) }, beginAtZero: true }, y2: { position: 'right', min: 0, max: 115, grid: { display: false }, ticks: { color: '#F1F5F4', callback: (v) => v <= 100 ? v + '%' : '' } } } }) }, 7.7, 4.3, 11)
    sl.addImage({ data: bar, x: 4.85, y: 2.0, w: 7.7, h: 4.3 })
    sl.addText(`Kadar menetas = menetas ÷ (menetas + buruk), ikut bulan telur ditanam.${s.hatchIncomplete ? ' ⚠ Sebahagian bulan belum ada data penetasan.' : ''}`, { x: 0.6, y: 6.5, w: 12.1, h: 0.35, align: 'center', fontFace: BODY, fontSize: 10.5, color: C.mute })
    footer(sl)
  }

  // ===== 7. Perbandingan =====
  if (cmpY) {
    const sl = newSlide()
    sl.addText(isl.name.toUpperCase(), { x: 0.6, y: 0.45, w: 12, h: 0.32, fontFace: BODY, fontSize: 11, bold: true, color: C.mint, charSpacing: 3 })
    sl.addText([{ text: `${year} `, options: { color: C.text } }, { text: 'vs ', options: { color: '7C8C89' } }, { text: String(cmpY), options: { color: C.gold } }], { x: 0.6, y: 0.78, w: 12, h: 0.85, fontFace: HEAD, fontSize: 34, bold: true })
    const k = [['Penyu / sarang', s.penyu, cs.penyu], ['Telur dikutip', s.dikutip, cs.dikutip], ['Telur ditanam', s.telur, cs.telur], ['Anak penyu menetas', s.menetas, cs.menetas, 'hatch'], ['Kadar menetas', s.rate, cs.rate, 'rate']]
    const cw = 2.3, gap = 0.15
    k.forEach((r, i) => {
      const x = 0.6 + i * (cw + gap)
      card(sl, x, 1.8, cw, 1.45)
      sl.addText(r[0], { x: x + 0.15, y: 1.88, w: cw - 0.3, h: 0.3, fontFace: BODY, fontSize: 10, color: 'CBD5D1' })
      sl.addText(r[3] === 'rate' ? (r[1] == null ? '—' : r[1].toFixed(1) + '%') : fmt(r[1]), { x: x + 0.15, y: 2.18, w: cw - 0.3, h: 0.5, fontFace: BODY, fontSize: 20, bold: true, color: C.text })
      let sub
      if (r[3] === 'rate') sub = [{ text: `${cmpY}: ${r[2] == null ? '—' : r[2].toFixed(1) + '%'}`, options: { color: C.mute, breakLine: true } }, ...(r[1] != null && r[2] != null ? [{ text: `${r[1] >= r[2] ? '▲' : '▼'} ${Math.abs(r[1] - r[2]).toFixed(1)} mata`, options: { color: r[1] >= r[2] ? C.up : C.down, bold: true } }] : [])]
      else if (r[3] === 'hatch' && (!cs.menetas || cs.hatchIncomplete || s.hatchIncomplete)) sub = [{ text: `${cmpY}: ${fmt(r[2])}`, options: { color: C.mute, breakLine: true } }, { text: `⚠ ${!cs.menetas ? `tiada data penetasan ${cmpY}` : `penetasan ${cs.hatchIncomplete ? cmpY : year} belum lengkap`}`, options: { color: C.warn } }]
      else sub = [{ text: `${cmpY}: ${fmt(r[2])}`, options: { color: C.mute, breakLine: true } }, ...delta(r[1], r[2])]
      sl.addText(sub, { x: x + 0.15, y: 2.68, w: cw - 0.25, h: 0.5, fontFace: BODY, fontSize: 9.5, valign: 'top' })
    })
    card(sl, 0.6, 3.45, 12.1, 3.35)
    sl.addImage({ data: await chartPng({ type: 'bar', data: { labels: MONTH_LABELS, datasets: [
      { label: String(year), data: months.map(r => r.telur), backgroundColor: '#2FA4B8', borderRadius: 6, labelFmt: kFmt },
      { label: String(cmpY), data: cmpM.map(r => r.telur), backgroundColor: '#E0A458', borderRadius: 6, labelFmt: kFmt }
    ] }, options: axis() }, 11.7, 3.1, 10), x: 0.8, y: 3.57, w: 11.7, h: 3.1 })
    footer(sl)
  }

  // ===== 8. Dalam sejarah =====
  if (series.length) {
    const sl = newSlide(); head(sl, isl.name, `${year} dalam sejarah ${series[0].y}–${series[series.length - 1].y}`)
    const best = series.reduce((b, r) => r.dikutip > b.dikutip ? r : b, series[0])
    const worst = series.filter(r => r.y !== thisYear).reduce((b, r) => r.dikutip < b.dikutip ? r : b, series[0])
    const rated = series.filter(r => r.rate != null && !r.hatchIncomplete)
    const bestRate = rated.reduce((b, r) => !b || r.rate > b.rate ? r : b, null)
    const avg = series.reduce((a, r) => a + r.dikutip, 0) / series.length
    const stats = [['🏆 Tahun tertinggi', String(best.y), C.gold, [{ text: `${fmt(best.dikutip)} telur dikutip`, options: { color: 'CBD5D1' } }]],
      ['📉 Tahun terendah', String(worst.y), C.sky, [{ text: `${fmt(worst.dikutip)} telur dikutip`, options: { color: 'CBD5D1' } }]],
      ...(bestRate ? [['🐣 Kadar menetas terbaik', String(bestRate.y), C.mint, [{ text: `${bestRate.rate.toFixed(1)}%`, options: { color: 'CBD5D1' } }]]] : []),
      [`📍 ${year}`, `#${rank}`, C.text, [...delta(s.dikutip, avg), { text: ' berbanding purata', options: { color: 'CBD5D1' } }]]]
    const cw = (12.1 - (stats.length - 1) * 0.2) / stats.length
    stats.forEach((st, i) => {
      const x = 0.6 + i * (cw + 0.2)
      card(sl, x, 1.8, cw, 1.35)
      sl.addText(st[0], { x: x + 0.2, y: 1.88, w: cw - 0.4, h: 0.3, fontFace: BODY, fontSize: 10.5, color: 'CBD5D1' })
      sl.addText(st[1], { x: x + 0.2, y: 2.17, w: cw - 0.4, h: 0.5, fontFace: BODY, fontSize: 22, bold: true, color: st[2] })
      sl.addText(st[3], { x: x + 0.2, y: 2.68, w: cw - 0.4, h: 0.35, fontFace: BODY, fontSize: 10 })
    })
    const col = (r) => r.y === year ? '#6EE7B7' : r.y === best.y ? '#E0A458' : r.y === worst.y ? '#7DD3FC' : 'rgba(47,164,184,.55)'
    card(sl, 0.6, 3.35, 12.1, 3.45)
    sl.addImage({ data: await chartPng({ data: { labels: series.map(r => r.y), datasets: [
      { type: 'bar', label: 'Telur dikutip', data: series.map(r => r.dikutip), backgroundColor: series.map(col), borderRadius: 4, yAxisID: 'y' },
      { type: 'line', label: 'Kadar menetas %', data: series.map(r => r.rate == null ? null : Math.round(r.rate * 10) / 10), yAxisID: 'y2', borderColor: 'rgba(241,245,244,.8)', pointRadius: 0, borderWidth: 2, tension: .3, spanGaps: true }
    ] }, options: axis({ scales: { x: { grid: { display: false }, ticks: { color: '#9fb3ae', maxRotation: 0, autoSkip: true, maxTicksLimit: 14, font: { size: 13 } } }, y: { grid: { color: 'rgba(255,255,255,.08)' }, ticks: { color: '#9fb3ae', callback: (v) => fmtShort(v) }, beginAtZero: true }, y2: { position: 'right', min: 0, max: 100, grid: { display: false }, ticks: { color: '#F1F5F4', callback: (v) => v + '%' } } } }) }, 11.7, 3.2), x: 0.8, y: 3.47, w: 11.7, h: 3.2 })
    footer(sl)
  }

  // ===== 9. Rumusan =====
  {
    const sl = newSlide(); head(sl, `${isl.name} · ${year}`, 'Rumusan')
    const ins = []
    if (rank) ins.push(['🏅', `<b>${year}</b> berada di kedudukan <b>#${rank}</b> daripada ${series.length} tahun bagi telur dikutip (${fmt(s.dikutip)} biji).`])
    if (prev) { const d = (s.dikutip - prev.dikutip) / prev.dikutip * 100; ins.push([d >= 0 ? '📈' : '📉', `Telur dikutip ${d >= 0 ? 'meningkat' : 'menurun'} <b>${Math.abs(d).toFixed(1)}%</b> berbanding ${prev.y} (${fmt(prev.dikutip)} biji).`]) }
    if (s.active.length) { const b = s.active.reduce((x, r) => r.telur > x.telur ? r : x, s.active[0]); ins.push(['🏆', `<b>${MONTH_FULL[b.m]}</b> bulan paling sibuk — ${fmt(b.telur)} telur (${(b.telur / (s.telur || 1) * 100).toFixed(0)}% setahun).`]) }
    if (s.rate != null) {
      const rated = series.filter(r => r.rate != null && !r.hatchIncomplete)
      const avgRate = rated.reduce((a, r) => a + r.rate, 0) / (rated.length || 1)
      const top = rated.slice().sort((a, b) => b.rate - a.rate).findIndex(r => r.y === year) + 1
      ins.push(['🐣', `Kadar menetas <b>${s.rate.toFixed(1)}%</b> — ${s.rate >= avgRate ? 'melebihi' : 'di bawah'} purata ${avgRate.toFixed(1)}% sejak ${series[0].y}${top === 1 ? ', <b>tertinggi dalam sejarah</b>' : top ? ` (#${top} terbaik)` : ''}.${s.hatchIncomplete ? ' (penetasan belum lengkap)' : ''}`])
    }
    const landas = months.map((r, i) => r.telur === 0 ? MONTH_LABELS[i] : null).filter(Boolean)
    if (landas.length && landas.length < 12) ins.push(['🌊', `Tiada pendaratan direkod pada <b>${landas.join(', ')}</b> — musim landas.`])
    const rh = Math.min(0.92, 4.9 / Math.max(ins.length, 1) - 0.12)
    ins.forEach((t, i) => {
      const y = 1.85 + i * (rh + 0.12)
      card(sl, 1.2, y, 10.9, rh)
      sl.addText(t[0], { x: 1.4, y, w: 0.6, h: rh, fontSize: 22, valign: 'middle' })
      sl.addText(runs(t[1], { color: 'CBD5D1' }), { x: 2.05, y, w: 9.9, h: rh, fontFace: BODY, fontSize: 15, valign: 'middle' })
    })
    footer(sl)
  }

  // ===== 10. Penutup =====
  {
    const sl = newSlide(bgPlain)
    const P = T.closing
    let y = 1.4
    if (logo) { const lw = 1.3; sl.addImage({ data: logo.data, x: (W - lw) / 2, y, w: lw, h: lw * logo.r }); y += lw * logo.r + 0.35 }
    sl.addText(P.title || 'Terima Kasih', { x: 0.5, y, w: W - 1, h: 1.1, align: 'center', fontFace: HEAD, fontSize: 52, bold: true, color: C.text }); y += 1.2
    if (P.name) { sl.addText(P.name, { x: 0.5, y, w: W - 1, h: 0.5, align: 'center', fontFace: BODY, fontSize: 18, color: 'CBD5D1' }); y += 0.6 }
    if (P.date) sl.addText(P.date.toUpperCase(), { x: 0.5, y, w: W - 1, h: 0.4, align: 'center', fontFace: BODY, fontSize: 12, bold: true, color: C.mint, charSpacing: 4 })
    n++
  }

  const fname = `Pembentangan-${island}-${year}.pptx`
  await pptx.writeFile({ fileName: fname })
  return fname
}

// Export ditulis TERUS ke dalam XML template (bukan melalui SheetJS) supaya
// warna, border, lebar lajur & formula JUMLAH template kekal 100%.
async function loadJSZip() {
  if (window.JSZip) return window.JSZip
  await new Promise((resolve, reject) => {
    const s = document.createElement('script')
    s.src = '../vendor/jszip-3.10.1/jszip.min.js'
    s.onload = resolve
    s.onerror = () => reject(new Error('Gagal muat JSZip'))
    document.head.appendChild(s)
  })
  return window.JSZip
}

const xmlEsc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')

// Ganti nilai sel dalam satu sheet XML sekali lalu. updates: Map(ref -> number | string | null)
// null = kosongkan sel (buang formula). Gaya sel (s="..") dikekalkan.
function patchSheetXml(xml, updates) {
  return xml.replace(/<c r="([A-Z]+\d+)"([^>]*?)(\/>|>[\s\S]*?<\/c>)/g, (m, ref, attrs) => {
    if (!updates.has(ref)) return m
    const v = updates.get(ref)
    const s = (attrs.match(/\ss="\d+"/) || [''])[0]
    if (v === null || v === undefined || v === '') return `<c r="${ref}"${s}/>`
    if (typeof v === 'number') return `<c r="${ref}"${s} t="n"><v>${v}</v></c>`
    return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`
  })
}

async function exportToExcel(island, year) {
  const templateUrl = `../assets/template-${island}.xlsx`
  const res = await fetch(templateUrl)
  if (!res.ok) throw new Error(`Template ${templateUrl} tidak dijumpai`)
  const JSZip = await loadJSZip()
  const zip = await JSZip.loadAsync(await res.arrayBuffer())

  const yearStart = `${year}-01-01`, yearEnd = `${year}-12-31`
  const [{ data: dailyRows }, { data: nestRows }, { data: hatchRows }] = await Promise.all([
    supabase.from('daily_entries').select('*').eq('island', island).gte('tarikh', yearStart).lte('tarikh', yearEnd).limit(10000),
    supabase.from('nest_records').select('*').eq('island', island).gte('tarikh_dijumpai', yearStart).lte('tarikh_dijumpai', yearEnd).limit(10000),
    supabase.from('monthly_hatch').select('*').eq('island', island).eq('year', year)
  ])

  // Kumpul ikut tarikh + RAM
  const buckets = {}
  const B = (date, ram) => buckets[`${date}|${ram}`] ||= { bp_b:0, bp_t:0, td_b:0, td_t:0, tm_b:0, tm_t:0, tm_has:false, tb_b:null, tb_t:null, dk:0, cat:[] }
  const addBuruk = (b, side, v) => { if (v === null || v === undefined) return; b[side] = (b[side] ?? 0) + v }
  ;(dailyRows||[]).forEach(d => {
    const b = B(d.tarikh, d.ram)
    b.bp_b += d.bilangan_penyu_bertag; b.bp_t += d.bilangan_penyu_takbertag
    b.td_b += d.jumlah_telur_diram_bertag; b.td_t += d.jumlah_telur_diram_takbertag
    if (d.telur_menetas_bertag != null) { b.tm_b += d.telur_menetas_bertag; b.tm_has = true }
    if (d.telur_menetas_takbertag != null) { b.tm_t += d.telur_menetas_takbertag; b.tm_has = true }
    addBuruk(b, 'tb_b', d.telur_buruk_bertag); addBuruk(b, 'tb_t', d.telur_buruk_takbertag)
    if (d.jumlah_telur_dikeluarkan) b.dk += d.jumlah_telur_dikeluarkan
    if (d.catatan) b.cat.push(d.catatan)
  })
  ;(nestRows||[]).forEach(n => {
    const b = B(n.tarikh_dijumpai, n.ram)
    const side = n.bertag ? 'b' : 't'
    b[`bp_${side}`] += 1; b[`td_${side}`] += n.jumlah_telur_diram
    if (n.telur_menetas != null) { b[`tm_${side}`] += n.telur_menetas; b.tm_has = true }
    addBuruk(b, `tb_${side}`, n.telur_buruk)
    if (n.jumlah_dikeluarkan) b.dk += n.jumlah_dikeluarkan
    if (n.catatan) b.cat.push(n.catatan)
  })
  // Telur buruk = angka sebenar kalau direkod; kalau menetas direkod tanpa buruk → diram − menetas;
  // kalau menetas belum direkod → 0 (BUKAN semua telur dikira buruk macam formula template)
  const buruk = (b, side) => {
    const explicit = b[`tb_${side}`]
    if (explicit !== null) return explicit
    return b.tm_has ? Math.max(0, b[`td_${side}`] - b[`tm_${side}`]) : 0
  }

  // Peta nama sheet → fail XML
  const wbXml = await zip.file('xl/workbook.xml').async('string')
  const relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('string')
  const relTarget = {}
  relsXml.replace(/<Relationship\b[^>]*>/g, tag => {
    const id = (tag.match(/Id="([^"]+)"/) || [])[1], tgt = (tag.match(/Target="([^"]+)"/) || [])[1]
    if (id && tgt) relTarget[id] = tgt.replace(/^\//, '').replace(/^(?!xl\/)/, 'xl/')
    return tag
  })
  const sheetFile = {}
  wbXml.replace(/<sheet\b[^>]*>/g, tag => {
    const name = (tag.match(/name="([^"]+)"/) || [])[1], rid = (tag.match(/r:id="([^"]+)"/) || [])[1]
    if (name && rid) sheetFile[name] = relTarget[rid]
    return tag
  })
  const fixYearTitle = (xml) => xml.replace(/(<c r="A[12]"[^>]*><is><t[^>]*>)([^<]*)/g, (m, a, t) => a + xmlEsc(t.replace(/&amp;/g, '&').replace(/20\d\d/, String(year))))

  const gabungNotes = {}
  for (let mi = 0; mi < 12; mi++) {
    const path = sheetFile[MONTH_SHEET_NAMES[mi]]
    if (!path || !zip.file(path)) continue
    const daysInMonth = new Date(year, mi + 1, 0).getDate()
    const up = new Map()
    for (let day = 1; day <= 31; day++) {
      const row = 7 + day
      const dateStr = `${year}-${String(mi+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`
      const lpp = day <= daysInMonth ? buckets[`${dateStr}|LPP`] : null
      const sfc = day <= daysInMonth ? buckets[`${dateStr}|SFC`] : null
      const nz = (v) => v ? v : null // sel kosong untuk 0, macam borang asal
      // Lajur buruk O-R: sentiasa nombor (ganti formula diram − menetas)
      up.set(`O${row}`, lpp ? buruk(lpp, 'b') : 0); up.set(`P${row}`, lpp ? buruk(lpp, 't') : 0)
      up.set(`Q${row}`, sfc ? buruk(sfc, 'b') : 0); up.set(`R${row}`, sfc ? buruk(sfc, 't') : 0)
      if (lpp) {
        up.set(`C${row}`, nz(lpp.bp_b)); up.set(`D${row}`, nz(lpp.bp_t)); up.set(`G${row}`, nz(lpp.td_b)); up.set(`H${row}`, nz(lpp.td_t))
        if (lpp.tm_has) { up.set(`K${row}`, lpp.tm_b); up.set(`L${row}`, lpp.tm_t) }
      }
      if (sfc) {
        up.set(`E${row}`, nz(sfc.bp_b)); up.set(`F${row}`, nz(sfc.bp_t)); up.set(`I${row}`, nz(sfc.td_b)); up.set(`J${row}`, nz(sfc.td_t))
        if (sfc.tm_has) { up.set(`M${row}`, sfc.tm_b); up.set(`N${row}`, sfc.tm_t) }
      }
      const dk = (lpp?.dk || 0) + (sfc?.dk || 0)
      if (dk) up.set(`S${row}`, dk)
      const notes = [...(lpp?.cat || []), ...(sfc?.cat || [])].join('; ')
      if (notes) up.set(`T${row}`, notes)
    }
    // Rekod Menetas Bulanan (tiada tarikh) → baris JUMLAH (39) sheet bulan ini.
    // Sheet JUMLAH tahunan ambil dari sini melalui formula =SUM(FEB!K39) dsb.
    const monthHatch = (hatchRows||[]).filter(h => h.month === mi + 1)
    const allRow = monthHatch.find(h => h.ram === 'ALL')
    if (allRow) {
      // Gabung LPP + SFC: tiada pecahan RAM → isi baris JUMLAH gabungan (41)
      let monthDiram = 0
      Object.entries(buckets).forEach(([k, b]) => { if (k.startsWith(`${year}-${String(mi+1).padStart(2,'0')}-`)) monthDiram += b.td_b + b.td_t })
      const m = allRow.menetas_bertag + allRow.menetas_takbertag
      up.set('K41', m); up.set('O41', Math.max(0, monthDiram - m))
      ;['K','L','M','N','O','P','Q','R'].forEach(col => up.set(`${col}40`, null))
      gabungNotes[mi] = { m, b: Math.max(0, monthDiram - m), pct: monthDiram ? Math.round(m / monthDiram * 1000) / 10 : 0 }
    } else {
      monthHatch.forEach(h => {
        const cols = h.ram === 'LPP' ? ['K','L','O','P'] : ['M','N','Q','R']
        ;[h.menetas_bertag, h.menetas_takbertag, h.buruk_bertag, h.buruk_takbertag].forEach((v, i) => up.set(`${cols[i]}39`, Number(v) || 0))
      })
    }
    const xml = await zip.file(path).async('string')
    zip.file(path, fixYearTitle(patchSheetXml(xml, up)))
  }

  // Sheet JUMLAH: formula asal dikekalkan (ia jumlahkan baris 39 setiap sheet bulan)
  const sumName = Object.keys(sheetFile).find(n => /^JUMLAH/i.test(n))
  if (sumName) {
    const up = new Map()
    // Bulan dengan rekod Gabung: tiada pecahan RAM, jadi jumlah ditulis dalam Catatan (lajur S)
    Object.entries(gabungNotes).forEach(([mi, g]) => up.set(`S${9 + Number(mi)}`, `Menetas (gabung LPP+SFC): ${g.m.toLocaleString()} · Buruk: ${g.b.toLocaleString()} · ${g.pct}%`))
    const path = sheetFile[sumName]
    const xml = await zip.file(path).async('string')
    zip.file(path, fixYearTitle(patchSheetXml(xml, up)))
    // Nama sheet ikut tahun
    zip.file('xl/workbook.xml', wbXml.replace(`name="${sumName}"`, `name="JUMLAH ${year}"`))
  }
  // Paksa Excel kira semula semua formula bila dibuka
  let wb2 = await zip.file('xl/workbook.xml').async('string')
  if (!/fullCalcOnLoad/.test(wb2)) wb2 = /<calcPr\b/.test(wb2) ? wb2.replace(/<calcPr\b/, '<calcPr fullCalcOnLoad="1"') : wb2.replace('</workbook>', '<calcPr fullCalcOnLoad="1"/></workbook>')
  zip.file('xl/workbook.xml', wb2)
  if (zip.file('xl/calcChain.xml')) zip.remove('xl/calcChain.xml')

  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' })
  // Jangan buang (revoke) link fail terlalu awal — kalau browser tanya "Save as",
  // dialog tu boleh terbuka lama dan download gagal "Insufficient permissions".
  // Link lama dibuang hanya bila export seterusnya dibuat.
  if (window.__lastExportUrl) URL.revokeObjectURL(window.__lastExportUrl)
  const url = URL.createObjectURL(blob)
  window.__lastExportUrl = url
  const a = document.createElement('a')
  a.href = url
  a.download = `Penyu-${island}-${year}.xlsx`
  document.body.appendChild(a); a.click(); a.remove()
}

// Gabung tetapan tersimpan dengan nilai asal. Teks wajib (pembukaan, pulau, nama) yang kosong
// kembali ke asal; Pendahuluan/Penutup yang kosong = slaid tidak dipapar.
function mergePresText(v) {
  const d = JSON.parse(JSON.stringify(PRES_TEXT_DEFAULT))
  if (!v || typeof v !== 'object') return d
  for (const sec of ['intro', 'islands', 'names']) for (const k in d[sec]) {
    const x = v[sec]?.[k]; if (typeof x === 'string' && x.trim()) d[sec][k] = x
  }
  for (const sec of ['prelude', 'closing']) for (const k in d[sec]) {
    const x = v[sec]?.[k]; if (typeof x === 'string') d[sec][k] = x.trim()
  }
  if (['hidup', 'ringkas', 'mati'].includes(v.anim)) d.anim = v.anim
  return d
}
async function loadPresText() {
  try {
    const { data, error } = await supabase.from('app_settings').select('value').eq('key', 'presentation').maybeSingle()
    if (error) throw error
    return mergePresText(data?.value)
  } catch (e) { return mergePresText(null) }
}
const presEsc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const presMulti = (s) => presEsc(s).replace(/\n/g, '<br/>')

// ---------- Penyu gaya B (garis halus) ----------
// x,y = pusat; ang = arah renang (radian); t = masa kayuhan; s = skala
function presTurtle(ctx, x, y, ang, t, s, alpha = 1) {
  if (alpha <= 0) return
  const LINE = '#8EF0CB', GLOW = 'rgba(110,231,183,.35)'
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s); ctx.globalAlpha = alpha
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'
  const stroke = (w, c) => { ctx.lineWidth = w; ctx.strokeStyle = c; ctx.stroke() }
  const sw = Math.sin(t * 2.6), sw2 = Math.sin(t * 2.6 + 1.4)
  const fin = (side, front) => {
    ctx.save()
    const k = front ? sw : sw2
    ctx.translate(front ? 18 : -26, side * (front ? 20 : 16))
    ctx.rotate(side * (front ? (0.9 + k * 0.55) : (0.5 + k * 0.25)))
    ctx.beginPath()
    if (front) { ctx.moveTo(0, 0); ctx.bezierCurveTo(10, side * 6, 30, side * 26, 6, side * 44); ctx.bezierCurveTo(0, side * 30, -6, side * 12, 0, 0) }
    else { ctx.moveTo(0, 0); ctx.bezierCurveTo(-6, side * 6, -20, side * 18, -10, side * 24); ctx.bezierCurveTo(-2, side * 16, 2, side * 8, 0, 0) }
    ctx.shadowColor = GLOW; ctx.shadowBlur = 8; stroke(1.6, LINE)
    ctx.restore()
  }
  fin(1, true); fin(-1, true); fin(1, false); fin(-1, false)
  ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(-44, Math.sin(t * 3) * 2); ctx.lineTo(-34, 3); stroke(1.4, LINE)
  ctx.beginPath(); ctx.ellipse(39, Math.sin(t * 1.3), 10, 7.5, 0, 0, Math.PI * 2)
  ctx.shadowColor = GLOW; ctx.shadowBlur = 8; stroke(1.6, LINE); ctx.shadowBlur = 0
  ctx.fillStyle = LINE
  for (const sy of [-4, 4]) { ctx.beginPath(); ctx.arc(43, sy, 1.2, 0, Math.PI * 2); ctx.fill() }
  ctx.beginPath(); ctx.ellipse(0, 0, 33, 25, 0, 0, Math.PI * 2)
  ctx.shadowColor = GLOW; ctx.shadowBlur = 10; stroke(1.8, LINE); ctx.shadowBlur = 0
  ctx.beginPath(); ctx.ellipse(2, 0, 12, 9, 0, 0, Math.PI * 2)
  for (const [x1, y1, x2, y2] of [[14, -6, 26, -15], [14, 6, 26, 15], [-10, -7, -22, -16], [-10, 7, -22, 16], [2, -9, 2, -24], [2, 9, 2, 24], [-10, 0, -32, 0], [14, 0, 32, 0]]) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2) }
  stroke(1.1, 'rgba(142,240,203,.7)')
  ctx.restore()
}
// Laluan renang beralun merentasi skrin
function presSwim(w, h, t, speed, lane, phase) {
  const span = w + 260, u = t * speed + phase
  return { x: (u % span) - 130, y: h * lane + Math.sin(u / 70) * 14, ang: Math.atan2(Math.cos(u / 70) * 14 / 70, 1) }
}
// Laut lut sinar di atas gambar pulau yang dikaburkan
function presOcean() {
  const bubbles = Array.from({ length: 30 }, () => ({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.6, v: .02 + Math.random() * .05, ph: Math.random() * 6 }))
  return (ctx, t, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h)
    g.addColorStop(0, 'rgba(15,74,88,.32)'); g.addColorStop(.55, 'rgba(8,48,61,.18)'); g.addColorStop(1, 'rgba(4,19,25,.42)')
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h)
    ctx.save(); ctx.globalCompositeOperation = 'lighter'
    for (let i = 0; i < 7; i++) {
      const x = w * (i / 7) + Math.sin(t * .3 + i) * 30
      const gr = ctx.createLinearGradient(x, 0, x + 40, h * .8)
      gr.addColorStop(0, 'rgba(160,240,220,.06)'); gr.addColorStop(1, 'rgba(160,240,220,0)')

const presData = { loaded: false, years: [], byIsl: {} }
async function loadPresData() {
  if (presData.loaded) return presData
  const thisYear = new Date().getFullYear()
  const years = Array.from({ length: thisYear - 1990 + 1 }, (_, i) => 1990 + i)
  const [ptb, ptk, psb, legacy] = await Promise.all([
    ...['PTB', 'PTK', 'PSB'].map(code => supabase.rpc('get_multi_year_monthly', { p_years: years, p_island: code })),
    (async () => {
      const out = []
      for (let from = 0; ; from += 1000) {
        const { data, error } = await supabase.from('monthly_summaries').select('island, year, month, telur_dikutip, jumlah_telur').order('year').order('month').range(from, from + 999)
        if (error) break
        out.push(...(data || []))
        if (!data || data.length < 1000) break
      }
      return out
    })()
  ])
  const legMap = {}
  legacy.forEach(r => { legMap[`${r.island}|${r.year}|${r.month}`] = r })
  const build = (code, res) => {
    const m = {}
    years.forEach(y => {
      const arr = res?.data?.[String(y)] || []
      m[y] = Array.from({ length: 12 }, (_, i) => {
        const r = arr[i] || {}
        const telur = Number(r.telur) || 0
        const L = legMap[`${code}|${y}|${i + 1}`]
        // telur dikutip: rekod lama simpan berasingan; data harian = sama dengan diram
        const dikutip = telur + (L && L.telur_dikutip != null ? L.telur_dikutip - (L.jumlah_telur || 0) : 0)
        return { telur, dikutip, penyu: Number(r.penyu) || 0, menetas: Number(r.menetas) || 0, buruk: Number(r.buruk) || 0 }
      })
    })
    return m
  }
  presData.byIsl.PTB = build('PTB', ptb)
  presData.byIsl.PTK = build('PTK', ptk)
  presData.byIsl.PSB = build('PSB', psb)
  const all = {}
  years.forEach(y => {
    all[y] = Array.from({ length: 12 }, (_, i) => {
      const o = { telur: 0, dikutip: 0, penyu: 0, menetas: 0, buruk: 0 }
      ;['PTB', 'PTK', 'PSB'].forEach(c => { const r = presData.byIsl[c][y][i]; for (const k in o) o[k] += r[k] })
      return o
    })
  })
  presData.byIsl.ALL = all
  presData.years = years
  presData.loaded = true
  return presData
}

// "Penetasan belum lengkap" hanya untuk TAHUN SEMASA; tahun lepas dianggap data muktamad
function yearSummary(months, year) {
  const s = { telur: 0, dikutip: 0, penyu: 0, menetas: 0, buruk: 0 }
  months.forEach(r => { for (const k in s) s[k] += r[k] })
  s.rate = (s.menetas + s.buruk) ? s.menetas / (s.menetas + s.buruk) * 100 : null
  s.hatchIncomplete = year === new Date().getFullYear() && months.some(r => r.telur > 0 && r.menetas + r.buruk === 0)
  s.active = months.map((r, i) => ({ ...r, m: i })).filter(r => r.telur > 0)
  return s
}

      const hint = S.level === 'intro' ? 'Klik atau tekan → untuk mula' : S.level === 'prelude' ? 'Tekan → untuk teruskan · Esc kembali' : 'Esc untuk kembali'
      dots.innerHTML = `<span class="pres-hint" style="position:static">${hint}</span>`
    }
  }
  function ripple(el, cx, cy) {
    if (MODE !== 'hidup') return
    const r = el.getBoundingClientRect()
    for (const cls of ['', 'b']) {
      const s = document.createElement('span'); s.className = 'pres-rip ' + cls
      s.style.left = (cx - r.left) + 'px'; s.style.top = (cy - r.top) + 'px'
      el.appendChild(s); setTimeout(() => s.remove(), 1400)
    }
  }

  // ---------- Animasi berterusan: laut, penyu, peralihan, penyu bar kemajuan ----------
  const ambC = $('#presAmb'), fxC = $('#presFx'), dotC = $('#presDotC')
  const ocean = presOcean()
  if (MODE === 'mati') ambC.style.display = 'none'
  const hatchlings = Array.from({ length: 8 }, (_, i) => ({ x: (i + .5) / 8 + (Math.random() - .5) * .06, v: 26 + Math.random() * 22, ph: Math.random() * 1000, s: .26 + Math.random() * .12 }))
  let dotX = null, dotDir = 0, fxDirty = false
  function drawAmbient(now) {
    const t = now / 1000
    const { ctx, w, h } = presFit(ambC, 1.25)
    ctx.clearRect(0, 0, w, h)
    ocean(ctx, t, w, h)
    if (MODE !== 'hidup') return
    const intro = S.level === 'intro' || S.level === 'prelude'
    for (const [sp, lane, ph, sc, al] of [[22, .8, 0, .9, .28], [15, .24, 500, .55, .2], [30, .52, 900, .72, .24], ...(intro ? [[18, .38, 1500, 1.1, .2]] : [])]) {
      const p = presSwim(w, h, t, sp, lane, ph); presTurtle(ctx, p.x, p.y, p.ang, t + ph, sc, al)
    }
    if (!intro) return
    // anak penyu naik ke permukaan
    for (const hl of hatchlings) {
      const y = h + 40 - ((t * hl.v + hl.ph) % (h + 120))
      const x = hl.x * w + Math.sin(t * 1.4 + hl.ph) * 14
      presTurtle(ctx, x, y, -Math.PI / 2 + Math.sin(t * 3 + hl.ph) * .18, t * 4 + hl.ph, hl.s, .45)
    }
    // logo terbentuk daripada riak air
    const logo = S.level === 'intro' && root.querySelector('.pres-logo')
    if (logo && logo.isConnected) {
      const lr = logo.getBoundingClientRect(), rr = ambC.getBoundingClientRect()
      const cx = lr.left + lr.width / 2 - rr.left, cy = lr.top + lr.height / 2 - rr.top
      const e = (now - S.introT0) / 1000
      ctx.save(); ctx.lineWidth = 2
      for (let k = 0; k < 5; k++) {
        const tt = e - k * .28
        if (tt > 0 && tt < 2.4) {
          const p = tt / 2.4, r = 12 + p * Math.max(220, lr.width * 1.6)
          ctx.strokeStyle = `rgba(160,255,225,${.55 * (1 - p)})`
          ctx.beginPath(); ctx.ellipse(cx, cy, r, r * .9, 0, 0, Math.PI * 2); ctx.stroke()
        }
      }
      const loopT = (e - 3) % 4.5
      if (e > 3 && loopT < 2.5) {
        const p = loopT / 2.5, r = lr.width * .55 + p * 160
        ctx.strokeStyle = `rgba(160,255,225,${.22 * (1 - p)})`
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke()
      }
      ctx.restore()
    }
  }
  function drawFx(now) {
    const { ctx, w: W, h: H } = presFit(fxC, 1.5)
    if (!anim) { if (fxDirty) { ctx.clearRect(0, 0, W, H); fxDirty = false } return }
    ctx.clearRect(0, 0, W, H); fxDirty = true
    const stage = $('#presStage')
    const w = stage.clientWidth, h = stage.clientHeight, oy = stage.offsetTop
    const p = Math.min(1, (now - anim.t0) / anim.dur), e = presEase(p)
    const { oldEl, nu, dir: d, fx } = anim
    const R = Math.hypot(w, h), ts = now / 1000
    ctx.save(); ctx.translate(0, oy)
    if (fx === 'swim') {
      const x = d > 0 ? -140 + e * (w + 280) : w + 140 - e * (w + 280)
      const reveal = d > 0 ? Math.max(0, x - 40) : Math.max(0, w - x - 40)
      nu.style.clipPath = d > 0 ? `inset(0 ${Math.max(0, w - reveal)}px 0 0)` : `inset(0 0 0 ${Math.max(0, w - reveal)}px)`
      oldEl.style.clipPath = d > 0 ? `inset(0 0 0 ${reveal + 60}px)` : `inset(0 ${reveal + 60}px 0 0)`
      for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.fillStyle = `rgba(200,255,240,${.35 - i * .022})`; ctx.arc(x - d * (30 + i * 16), h / 2 + Math.sin(i + now / 120) * 18, 2 + (i % 3), 0, Math.PI * 2); ctx.fill() }
      presTurtle(ctx, x, h / 2 + Math.sin(now / 300) * 10, d > 0 ? 0 : Math.PI, ts * 2.2, Math.min(3.2, h / 90))
    } else if (fx === 'dive') {
      const y = -120 + e * (h + 240)
      nu.style.clipPath = `inset(0 0 ${Math.max(0, h - Math.max(0, y - 30))}px 0)`
      oldEl.style.clipPath = `inset(${Math.max(0, y + 30)}px 0 0 0)`; oldEl.style.opacity = 1 - e
      for (let i = 0; i < 40; i++) { const bx = (i * 97 + anim.seed * 500) % w, by = h - ((p * 1.6 + i / 40) % 1) * h; ctx.beginPath(); ctx.fillStyle = 'rgba(200,255,240,.3)'; ctx.arc(bx, by, 2 + (i % 4), 0, Math.PI * 2); ctx.fill() }
      presTurtle(ctx, w / 2 + Math.sin(e * 6) * 30, y, Math.PI / 2, ts * 2.4, Math.min(3, h / 95))
    } else if (fx === 'ripple') {
      const r = e * R
      nu.style.clipPath = `circle(${r}px at 50% 50%)`
      oldEl.style.opacity = Math.max(0, 1 - e * 2.2); oldEl.style.transform = `scale(${1 - e * .06})`
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.strokeStyle = `rgba(160,255,225,${.45 * (1 - p)})`; ctx.lineWidth = 3; ctx.arc(w / 2, h / 2, Math.max(0, r - k * 26), 0, Math.PI * 2); ctx.stroke() }
      const s = Math.min(2.6, h / 110) * (p < .5 ? p * 2 : 1)
      presTurtle(ctx, w / 2, h / 2, -Math.PI / 2 + p * Math.PI * 2, ts * 2, s, p < .8 ? 1 : (1 - p) * 5)
    } else if (fx === 'hatch') {
      const y = h + 40 - e * (h + 120)
      nu.style.clipPath = `inset(${Math.max(0, y + 20)}px 0 0 0)`
      oldEl.style.clipPath = `inset(0 0 ${Math.max(0, h - y + 40)}px 0)`
      const n = w < 600 ? 6 : 9
      for (let i = 0; i < n; i++) {
        const hx = w * (i + .5) / n + Math.sin(i * 3 + now / 160) * 8
        const hy = y + Math.sin(i * 1.7) * 26 + (i % 2) * 18
        presTurtle(ctx, hx, hy, -Math.PI / 2 + Math.sin(now / 140 + i) * .25, ts * 5 + i, Math.min(.9, h / 340))
      }
    } else if (fx === 'wave') {
      const x = d > 0 ? -w * .3 + e * w * 1.5 : w * 1.3 - e * w * 1.5
      const front = (yy) => x + Math.sin(yy / 46 + now / 180) * 26 * d
      ctx.save(); ctx.beginPath()
      if (d > 0) { ctx.moveTo(-10, 0); for (let yy = 0; yy <= h; yy += 10) ctx.lineTo(front(yy), yy); ctx.lineTo(-10, h) }
      else { ctx.moveTo(w + 10, 0); for (let yy = 0; yy <= h; yy += 10) ctx.lineTo(front(yy), yy); ctx.lineTo(w + 10, h) }
      ctx.closePath()
      const g = ctx.createLinearGradient(x - d * 160, 0, x, 0); g.addColorStop(0, 'rgba(20,110,125,0)'); g.addColorStop(.75, 'rgba(40,150,160,.55)'); g.addColorStop(1, 'rgba(220,255,245,.85)')
      ctx.fillStyle = g; ctx.fill(); ctx.restore()
      const rv = d > 0 ? Math.max(0, x - 60) : Math.max(0, w - x - 60)
      nu.style.clipPath = d > 0 ? `inset(0 ${Math.max(0, w - rv)}px 0 0)` : `inset(0 0 0 ${Math.max(0, w - rv)}px)`
      oldEl.style.clipPath = d > 0 ? `inset(0 0 0 ${rv + 80}px)` : `inset(0 ${rv + 80}px 0 0)`
      presTurtle(ctx, x - d * 30, h * .42 + Math.sin(now / 200) * 14, d > 0 ? -.15 : Math.PI + .15, ts * 2.6, Math.min(2.4, h / 120))
    }
    ctx.restore()
    if (p >= 1) finishAnim()
  }
  function drawDotTurtle(now) {
    const { ctx, w, h } = presFit(dotC, 2)
    ctx.clearRect(0, 0, w, h)
    if (S.level !== 'report') { dotX = null; return }
    const on = root.querySelector('.pres-dot.on'); if (!on) return
    const r = on.getBoundingClientRect(), rr = dotC.getBoundingClientRect()
    const tx = r.left + r.width / 2 - rr.left
    if (dotX == null) dotX = tx - 36
    const dx = tx - dotX
    dotX += dx * .055
    if (Math.abs(dx) > 1.5) dotDir = dx < 0 ? Math.PI : 0
    const moving = Math.abs(dx) > 1.5, t = now / 1000
    presTurtle(ctx, dotX, h / 2 - 13 + (moving ? Math.sin(t * 9) * .8 : 0), dotDir, moving ? t * 3.2 : t * .7, .21, .95)
  }
  let raf = 0
  function frame(now) {
    if (!root.isConnected) return
    raf = requestAnimationFrame(frame)
    if (MODE !== 'mati') drawAmbient(now)
    if (MODE === 'hidup') { drawFx(now); drawDotTurtle(now) }
    if (S.live.length) S.live = S.live.filter(l => l.el.isConnected && l.draw(now) !== false)
  }
  raf = requestAnimationFrame(frame)

  // Telur retak → anak penyu keluar (sebelum donut Penetasan)
  function eggCrack(canvas) {
    const t0 = performance.now()
    S.live.push({ el: canvas, draw(now) {
      const t = (now - t0) / 1000
      if (t > 2.2) { canvas.remove(); return false }
      const { ctx, w, h } = presFit(canvas, 2)
      ctx.clearRect(0, 0, w, h)
      const cx = w / 2, cy = h * .45, R = Math.min(w, h) * .16, ry = R * 1.28
      ctx.save(); ctx.globalAlpha = t > 1.65 ? Math.max(0, 1 - (t - 1.65) / .5) : 1
      const wob = t < .85 ? Math.sin(t * 30) * .09 * (t / .85) : 0
      const split = t < .95 ? 0 : presEase(Math.min(1, (t - .95) / .6))
      const crack = Math.min(1, Math.max(0, (t - .5) / .4))
      const n = 8, zig = Array.from({ length: n + 1 }, (_, i) => [-R - 12 + (2 * R + 24) * i / n, -ry * .06 + (i % 2 ? -1 : 1) * R * .13])
      const half = (top, dx, dy, rot) => {
        ctx.save(); ctx.translate(cx + dx, cy + dy); ctx.rotate(wob + rot)
        ctx.beginPath()
        if (top) { ctx.moveTo(-R - 14, -ry - 14); ctx.lineTo(R + 14, -ry - 14); for (let i = n; i >= 0; i--) ctx.lineTo(zig[i][0], zig[i][1]) }
        else { ctx.moveTo(-R - 14, ry + 14); ctx.lineTo(R + 14, ry + 14); for (let i = n; i >= 0; i--) ctx.lineTo(zig[i][0], zig[i][1]) }
        ctx.closePath(); ctx.clip()
        ctx.beginPath(); ctx.ellipse(0, 0, R, ry, 0, 0, Math.PI * 2)
        ctx.fillStyle = 'rgba(142,240,203,.08)'; ctx.fill()
        ctx.shadowColor = 'rgba(110,231,183,.45)'; ctx.shadowBlur = 12; ctx.lineWidth = 2; ctx.strokeStyle = '#8EF0CB'; ctx.stroke()
        ctx.restore()
      }
      if (t > 1.05) presTurtle(ctx, cx, cy - (t - 1.05) * R * 1.5, -Math.PI / 2 + Math.sin(t * 7) * .12, t * 5, R * 1.25 / 90, Math.min(1, (t - 1.05) * 3))
      half(false, split * R * .12, split * R * .3, split * .18)
      half(true, -split * R * .45, -split * R * 1.0, -split * .7)
      if (crack > 0 && split === 0) {
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(wob)
        ctx.beginPath(); const upto = crack * n
        for (let i = 0; i <= Math.floor(upto); i++) { const [x, y] = zig[i]; i ? ctx.lineTo(x, y) : ctx.moveTo(Math.max(x, -R), y) }
        ctx.strokeStyle = '#E8FFF6'; ctx.lineWidth = 1.8; ctx.shadowColor = 'rgba(232,255,246,.8)'; ctx.shadowBlur = 8; ctx.stroke()
        ctx.restore()
      }
      ctx.restore()
    } })
  }
  // Anak penyu merangkak ke laut (Rumusan)
  function beach(canvas) {
    const hs = Array.from({ length: 9 }, (_, i) => ({ off: i / 9, sp: .075 + Math.random() * .045, lane: .22 + (i % 3) * .27 + Math.random() * .06, ph: Math.random() * 6 }))
    S.live.push({ el: canvas, draw(now) {
      const t = now / 1000
      const { ctx, w, h } = presFit(canvas, 2)
      ctx.clearRect(0, 0, w, h)
      const shoreAt = (y) => w * .66 + Math.sin(t * .9 + y / 18) * 9 + Math.sin(t * .5) * 8
      const sand = ctx.createLinearGradient(0, 0, w * .7, 0)
      sand.addColorStop(0, 'rgba(226,196,140,0)'); sand.addColorStop(.35, 'rgba(226,196,140,.13)'); sand.addColorStop(1, 'rgba(226,196,140,.24)')
      ctx.fillStyle = sand; ctx.fillRect(0, 0, w, h)
      ctx.beginPath(); ctx.moveTo(w, 0)
      for (let y = 0; y <= h; y += 6) ctx.lineTo(shoreAt(y), y)
      ctx.lineTo(w, h); ctx.closePath()
      const sea = ctx.createLinearGradient(w * .62, 0, w, 0)
      sea.addColorStop(0, 'rgba(47,164,184,.42)'); sea.addColorStop(1, 'rgba(10,70,90,.2)')
      ctx.fillStyle = sea; ctx.fill()
      ctx.beginPath(); for (let y = 0; y <= h; y += 6) { const x = shoreAt(y) - 2; y ? ctx.lineTo(x, y) : ctx.moveTo(x, y) }
      ctx.strokeStyle = 'rgba(225,255,246,.55)'; ctx.lineWidth = 2; ctx.stroke()
      for (const hl of hs) {
        const p = (t * hl.sp + hl.off) % 1
        const x = -16 + p * w * .82, y = hl.lane * h + Math.sin(t * 6 + hl.ph) * 1.2
        const sx = shoreAt(y)
        const a = x > sx ? Math.max(0, 1 - (x - sx) / 46) : Math.min(1, p * 10)
        ctx.fillStyle = 'rgba(142,240,203,.22)'
        for (let k = 1; k <= 6; k++) { const tx = x - k * 9; if (tx > 0 && tx < sx) { ctx.beginPath(); ctx.arc(tx, y + (k % 2 ? 3 : -3), 1.1, 0, Math.PI * 2); ctx.fill() } }
        presTurtle(ctx, x, y, Math.sin(t * 5 + hl.ph) * .12, t * 6 + hl.ph, .2, a)
      }
      // tepi lembut (tiada bucu segi empat)
      ctx.save(); ctx.globalCompositeOperation = 'destination-in'
      const fx = ctx.createLinearGradient(0, 0, w, 0); fx.addColorStop(0, 'rgba(0,0,0,0)'); fx.addColorStop(.08, '#000'); fx.addColorStop(.92, '#000'); fx.addColorStop(1, 'rgba(0,0,0,0)')
      ctx.fillStyle = fx; ctx.fillRect(0, 0, w, h)
      const fy = ctx.createLinearGradient(0, 0, 0, h); fy.addColorStop(0, 'rgba(0,0,0,0)'); fy.addColorStop(.2, '#000'); fy.addColorStop(.8, '#000'); fy.addColorStop(1, 'rgba(0,0,0,0)')
      ctx.fillStyle = fy; ctx.fillRect(0, 0, w, h)
      ctx.restore()
    } })
  }

  // ---------- 1. Pembukaan ----------
